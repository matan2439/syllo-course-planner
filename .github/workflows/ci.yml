name: CI

on:
  push:
    branches: [master, main, ui/frontend-modernization]
  pull_request:
    branches: [master, main, ui/frontend-modernization]

jobs:
  # ── Python tests ────────────────────────────────────────────────────────────
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest --tb=short -q

  # ── TypeScript API tests (root api/) ────────────────────────────────────────
  api-ts:
    name: TypeScript API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run API tests
        run: npx jest --testPathPattern=tests/api --no-coverage

      - name: Type-check API
        run: npm run typecheck

      # tests/ui drives semester_board_viewer.html through jsdom against a real,
      # gitignored Supabase board export (supabase_board_backup_2027_pre_sync.json)
      # that only exists on the original dev machine — every fresh checkout
      # (including this CI runner) is missing it, so ~38 of 60 suites currently
      # fail on ENOENT regardless of code correctness. Kept here (not deleted)
      # so real regressions in the suites that don't need the fixture still show
      # up in the log; continue-on-error until a checked-in/synthetic fixture
      # decision is made (tracking issue: see .remember/roadmap.md).
      - name: Run UI tests (tests/ui — known fixture gap, non-blocking)
        continue-on-error: true
        run: npx jest --config jest.ui.config.js --no-coverage

  # ── Next.js build (web/) ────────────────────────────────────────────────────
  web:
    name: Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Type-check web
        run: cd web && npm run typecheck

      - name: Build Next.js
        run: cd web && npm run build
