function computeProgramProgress() {
  if (!programRequirements) return null;
  const allPlaced  = allPlacedIds();
  const allCounted = new Set([...allPlaced, ...completedCourseIds]);

  let plannedHours = 0, unknownHoursCount = 0;
  for (const cid of allPlaced) {
    const c = courseMap[cid];
    if (c?.weekly_hours != null) plannedHours += c.weekly_hours;
    else unknownHoursCount++;
  }

  const total     = programRequirements.total_required_hours || null;
  const pct       = total ? Math.min(100, Math.round((plannedHours / total) * 100)) : 0;
  const remaining = total != null ? Math.max(0, total - plannedHours) : null;

  const categories = (programRequirements.categories || []).map(cat => {
    const catSet  = new Set(cat.course_ids || []);
    const selected = [...allCounted].filter(cid => catSet.has(cid)).length;
    const min      = cat.min_courses || 0;
    return { ...cat, selected_count: selected, satisfied: selected >= min };
  });

  /* Core-total: sum across categories that belong to core_categories */
  const coreTotalMin = programRequirements.core_courses_total_min ?? null;
  let coreSelected = null;
  let coreSatisfied = null;
  if (coreTotalMin !== null) {
    /* core categories are those with min_courses > 0 and NOT advanced_labs/other */
    const nonCoreIds = new Set(['advanced_labs', 'other_specialization',
                                'uncategorized_review', 'other_specialization_electives']);
    coreSelected = categories
      .filter(c => c.min_courses > 0 && !c.needs_review && !nonCoreIds.has(c.category_id))
      .reduce((sum, c) => sum + c.selected_count, 0);
    coreSatisfied = coreSelected >= coreTotalMin;
  }

  return {
    total, plannedHours: Math.round(plannedHours * 10) / 10,
    pct, remaining, unknownHoursCount, categories,
    coreTotalMin, coreSelected, coreSatisfied,
  };
}

function renderProgramProgress(prog) {
  if (!prog) return '';
  const barColor = prog.pct >= 100 ? 'var(--success)' : 'var(--blue)';
  const hoursBar = prog.total != null ? `
    <div class="prog-hours-bar">
      <div class="prog-hours-track">
        <div class="prog-hours-fill" style="width:${prog.pct}%;background:${barColor}"></div>
      </div>
      <div class="prog-hours-labels">
        <span>${prog.plannedHours} ש׳׳ש מתוכננות</span>
        <span>${prog.total} ש׳׳ש נדרשות</span>
      </div>
    </div>` : '';

  /* Core-total row (e.g. "קורסי ליבה: 2/6") */
  const coreTotalRow = prog.coreTotalMin != null ? `
    <div class="prog-cat-row ${prog.coreSatisfied ? 'ok' : 'warn'}">
      <span>קורסי ליבה (סה״כ)</span>
      <span class="prog-cat-count">${prog.coreSelected}/${prog.coreTotalMin}</span>
    </div>` : '';

  /* Per-category rows for categories with min_courses > 0 */
  const reqCats = (prog.categories || []).filter(c => c.min_courses > 0 && !c.needs_review);
  const catRows = reqCats.map(cat =>
    `<div class="prog-cat-row ${cat.satisfied ? 'ok' : 'warn'}">
      <span>${esc(cat.name_he || cat.category_id)}</span>
      <span class="prog-cat-count">${cat.selected_count}/${cat.min_courses}</span>
    </div>`
  ).join('');

  /* Remaining hours note */
  const remainNote = prog.remaining != null && prog.remaining > 0
    ? `<div class="prog-req-note">שעות חסרות עד ${prog.total}: <strong>${prog.remaining}</strong></div>` : '';

  const unkNote = prog.unknownHoursCount > 0
    ? `<div class="prog-req-note">⚠ ${prog.unknownHoursCount} קורסים ללא שעות ידועות</div>` : '';

  return `<div class="prog-requirements">
    <div class="prog-req-title">התקדמות בתוכנית</div>
    ${hoursBar}${coreTotalRow}${catRows}${remainNote}${unkNote}
  </div>`;
}

function semColHtml(sem) {
  const ids     = state.semesters[sem.id] || [];
  const courses = ids.map(id => courseMap[id]).filter(Boolean);
  let knownHrs  = 0, unknownCt = 0;
  for (const c of courses) {
    if (c.weekly_hours != null) knownHrs += c.weekly_hours;
    else unknownCt++;
  }
  const avgDiff = courses.length
    ? (courses.reduce((s,c)=>s+(c.difficulty_score||0),0)/courses.length).toFixed(1)
    : null;
  const pct    = Math.min(100, (knownHrs / MAX_HOURS) * 100).toFixed(1);
  const wlCls  = knownHrs >= 16 ? 'over' : knownHrs >= 10 ? 'med' : '';
  const hrsLbl = unknownCt > 0 ? `${knownHrs} שעות ידועות` : `${knownHrs} ש׳׳ש`;
  const unkNote = unknownCt > 0
    ? `<div class="wl-note">⚠ ${unknownCt} קורסים ללא שעות ידועות</div>` : '';
  const cards  = ids.map(id => cardHtml(courseMap[id], true)).join('');
  return `<div class="semester-col ${esc(sem.css)}">
    <div class="sem-hdr">
      <div class="sem-title">${esc(SEM_HE[sem.id] || sem.id)}</div>
      <div class="sem-stats">
        <span>⏱ ${esc(hrsLbl)}</span>
        <span>📚 ${courses.length} קורסים</span>
        ${avgDiff != null ? `<span>📊 קושי ${esc(avgDiff)}</span>` : ''}
      </div>
      <div class="wl-wrap">
        <div class="wl-row">
          <span>עומס שבועי</span>
          <span>${knownHrs}/${MAX_HOURS} ש׳׳ש</span>
        </div>
        <div class="wl-track"><div class="wl-fill ${wlCls}" style="width:${pct}%"></div></div>
        ${unkNote}
      </div>
    </div>
    <div class="sem-zone" data-zone="semester" data-sem="${esc(sem.id)}">${cards}</div>
  </div>`;
}

/* ── Course card HTML ───────────────────────────────────────────────────── */
function cardHtml(c, placed) {
  if (!c) return '';
  const type      = c.course_type || 'elective';
  const status    = c.status      || 'eligible';
  const level     = c.difficulty_level || '';
  const locked    = isLocked(c);
  const isBlocked = status === 'blocked';
  const canDrag   = !locked && !(isBlocked && !allowBlockedDrag);

  const isPartial    = status === 'partial_info';
  const isNotOffered = status === 'not_offered';

  const catId     = c.program_category_id || null;
  const catStyles = CAT_CSS[catId] || null;

  let cls = 'course-card';
  if (locked)                           cls += ' card-locked';
  else if (status === 'missing_from_db')  cls += ' card-missing';
  else if (isBlocked)                   cls += ' card-blocked';
  else if (isPartial || isNotOffered)   cls += ' card-missing'; /* reuse missing style */
  else if (type === 'mandatory')        cls += ' card-mandatory';
  else                                  cls += ' card-elective';
  if (placed && level && !locked)       cls += ` card-placed diff-${esc(level)}`;
  /* Category border override — only in repo (not placed), only for known categories */
  if (!placed && catStyles)             cls += ` ${catStyles.card}`;

  const isFixedMandatory = type === 'mandatory' && (c.locked_by_default ?? true) === true;
  const isFlexMand       = type === 'mandatory' && !isFixedMandatory;

  const typeBdg = status === 'missing_from_db'
    ? `<span class="badge bdg-missing">${STAT_HE.missing_from_db}</span>`
    : isNotOffered
    ? `<span class="badge bdg-not-offered">לא מוצע בתשפ"ז</span>`
    : isPartial
    ? `<span class="badge bdg-partial">מידע חלקי</span>`
    : status === 'blocked'
    ? `<span class="badge bdg-blocked">${STAT_HE.blocked}</span>`
    : isFlexMand
    ? `<span class="badge bdg-mandatory-flex">חובה — גמיש</span>`
    : type === 'mandatory'
    ? `<span class="badge bdg-mandatory">חובה — נעול</span>`
    : `<span class="badge bdg-elective">${TYPE_HE.elective}</span>`;

  /* Category badge — shown in repo for core categories (fluids/solids/systems/labs) */
  const catBdg = (!placed && catStyles)
    ? `<span class="badge ${catStyles.bdg}">${esc(catStyles.label)}</span>`
    : '';

  const diffBdg = level
    ? `<span class="badge bdg-${esc(level)}">${esc(DIFF_HE[level]||level)}${c.difficulty_score!=null?' '+c.difficulty_score:''}</span>`
    : '';

  const prereqVr      = placed ? boardValidation[c.course_id] : null;
  const prereqWarnBdg = prereqVr && !prereqVr.valid
    ? `<span class="badge bdg-prereq-warn" title="${esc('דרישות קדם: ' + prereqVr.errors.map(_prereqName).join(', '))}">⚠ דרישות קדם</span>`
    : '';

  const hoursHtml = c.weekly_hours != null
    ? `<span class="hrs-tag"><span class="v">${esc(c.weekly_hours)}</span> ש׳׳ש</span>`
    : `<span class="hrs-unk">שעות לא ידועות</span>`;

  const warnIcon  = (c.warnings||[]).length
    ? `<span class="warn-icon" title="${esc((c.warnings||[]).join(', '))}">⚠</span>` : '';

  let actionBtn = '';
  if (type === 'mandatory') {
    const icon  = locked ? '🔒' : isFlexMand ? '↔' : '🔓';
    const title = locked ? 'לחצו לביטול נעילה' : isFlexMand ? 'גמיש — ניתן להזזה בין סמסטרים מותרים' : 'לחצו לנעילה';
    actionBtn = `<button class="lock-btn" data-toggle-lock="${esc(c.course_id)}" title="${title}">${icon}</button>`;
  } else if (placed) {
    actionBtn = `<button class="rm-btn" data-rm="${esc(c.course_id)}" title="החזר למאגר">✕</button>`;
  }

  const dragHint = canDrag ? '<div class="card-drag-hint">⠿ גרירה</div>' : '';

  return `<div class="${cls}" ${canDrag?'draggable="true"':'draggable="false"'} data-cid="${esc(c.course_id)}">
  <div class="card-main">
    <div class="card-top">
      <span class="cid" dir="ltr">${esc(c.course_id)}</span>
      ${warnIcon}${actionBtn}
    </div>
    <div class="cname${c.name_he?'':' unnamed'}">${c.name_he?esc(c.name_he):'⚠ שם חסר — נדרש רענון מידע'}</div>
    <div class="card-row">${typeBdg} ${catBdg} ${diffBdg} ${prereqWarnBdg} ${hoursHtml}</div>
  </div>${dragHint}
</div>`;
}

/* ── Override localStorage helpers ─────────────────────────────────────── */
function getOverride(cid) {
  try {
    const raw = localStorage.getItem(LS_OVERRIDES);
    if (!raw) return null;
    return JSON.parse(raw)?.courses?.[cid] || null;
  } catch { return null; }
}

function saveOverride(cid) {
  const form = document.getElementById('override-form');
  if (!form) return;
  const hoursRaw = form.querySelector('[name=manual_weekly_hours]')?.value;
  const hours    = hoursRaw !== '' && hoursRaw != null ? parseFloat(hoursRaw) : null;
  const entry = {
    user_notes:                        form.querySelector('[name=user_notes]')?.value                       || '',
    manual_weekly_hours:               isNaN(hours) ? null : hours,
    manual_conceptual_complexity_note: form.querySelector('[name=manual_conceptual_complexity_note]')?.value || '',
    expected_instructor:               form.querySelector('[name=expected_instructor]')?.value               || '',
    known_instructor_notes:            form.querySelector('[name=known_instructor_notes]')?.value            || '',
    confidence_adjustment:             0,
    updated_at:                        new Date().toISOString(),
  };
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(LS_OVERRIDES) || '{}'); } catch {}
  if (!stored.courses) stored.courses = {};
  stored.courses[cid] = entry;
  localStorage.setItem(LS_OVERRIDES, JSON.stringify(stored));
}

function exportOverrides() {
  try {
    const raw  = localStorage.getItem(LS_OVERRIDES) || '{"courses":{}}';
    const blob = new Blob([raw], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'course_overrides.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) { console.error('[exportOverrides]', e); }
}

function _overrideHasData(ov) {
  return !!(ov?.user_notes?.trim() || ov?.manual_weekly_hours != null
            || ov?.manual_conceptual_complexity_note?.trim()

/**
 * Assemble a structured text summary of all grounded data available for a
 * course. This is the context that will be injected into the AI prompt when
 * the API is connected.
 *
 * TODO: Pass this string to POST /api/ai/course-chat alongside the question
 *       when implementing the real API call in handleAiSend().
 */
function buildCourseContext(c) {
  const ov = getOverride(c.course_id);
  const lines = [];

  if (c.name_he)         lines.push(`שם קורס: ${c.name_he} (${c.course_id})`);
  if (c.weekly_hours != null)
                         lines.push(`שעות שבועיות: ${c.weekly_hours}`);
  if (c.difficulty_level)
                         lines.push(`רמת קושי: ${DIFF_HE[c.difficulty_level] || c.difficulty_level} (ציון ${c.difficulty_score})`);

  const prereqs = (c.prerequisite_details || []).map(d => d.name_he ? `${d.name_he} (${d.course_id})` : d.course_id);
  if (prereqs.length)    lines.push(`דרישות קדם: ${prereqs.join(', ')}`);
  if (c.missing_prerequisites?.length)
                         lines.push(`דרישות קדם חסרות: ${c.missing_prerequisites.join(', ')}`);

  const hasSyllabus = !!(c.syllabus_url || c.syllabus_links?.length);
  lines.push(`סילבוס: ${hasSyllabus ? 'זמין' : 'לא זמין'}`);
  if (hasSyllabus && c.syllabus_url) lines.push(`קישור סילבוס: ${c.syllabus_url}`);

  const gs = c.grade_signal;
  if (gs) {
    if (gs.average_grade      != null) lines.push(`ממוצע היסטורי: ${gs.average_grade}`);
    if (gs.median_grade       != null) lines.push(`חציון היסטורי: ${gs.median_grade}`);
    if (gs.standard_deviation != null) lines.push(`סטיית תקן: ${gs.standard_deviation}`);
    if (gs.pass_rate          != null) lines.push(`שיעור עוברים: ${Math.round(gs.pass_rate * 100)}%`);
    if (gs.num_students_total != null) lines.push(`סה״כ סטודנטים: ${gs.num_students_total}`);
    if (gs.years_available?.length)    lines.push(`שנים: ${gs.years_available.join(', ')}`);
    lines.push(`מקור ציונים: ${gs.source_name || 'TAU Refactor'} (לא רשמי)`);
  }

  const iu = c.instructor_uncertainty;
  if (iu) {
    if (iu.current_lecturers?.length)    lines.push(`מרצה נוכחי: ${iu.current_lecturers.join(', ')}`);
    if (iu.historical_lecturers?.length) lines.push(`מרצים היסטוריים: ${iu.historical_lecturers.join(', ')}`);
    if (iu.instructor_uncertainty_score != null)
                                         lines.push(`אי-ודאות מרצה: ${Math.round(iu.instructor_uncertainty_score * 100)}%`);
    if (iu.instructor_changed_warning)   lines.push('אזהרה: מרצה שונה מהנתונים ההיסטוריים');
  }
  if (ov?.expected_instructor)         lines.push(`מרצה צפוי (משתמש): ${ov.expected_instructor}`);
  if (ov?.known_instructor_notes)      lines.push(`הערות מרצה (משתמש): ${ov.known_instructor_notes}`);

  if (ov?.user_notes)                  lines.push(`הערות משתמש: ${ov.user_notes}`);
  if (ov?.manual_weekly_hours != null) lines.push(`שעות ידניות: ${ov.manual_weekly_hours}`);
  if (ov?.manual_conceptual_complexity_note)
                                       lines.push(`הערת מורכבות: ${ov.manual_conceptual_complexity_note}`);

  return lines.join('\n');
}

  const prereqs = (c.prerequisites||[]).filter(Boolean);
  const missing = (c.missing_prerequisites||[]).filter(Boolean);
  const warns   = (c.warnings||[]);
  const conf    = c.data_quality?.placement_confidence || '';
  const src     = c.source || '';

  const mkSection = (title, content) =>
    `<div class="detail-section"><div class="detail-section-title">${title}</div>${content}</div>`;

  const mkRow = (label, val) =>
    `<div class="detail-row"><span class="detail-lbl">${label}</span> <span class="detail-val">${val}</span></div>`;

  /* Basic info section */
  const _allowedSemLabels = (c.allowed_semesters || []).map(sid => SEM_HE[sid] || sid).join(' / ');
  const basicRows = [
    mkRow('קוד קורס:', `<span dir="ltr" style="font-family:ui-monospace,monospace;unicode-bidi:isolate">${esc(cid)}</span>`),
    mkRow('סוג:', esc(_isFlexMand ? 'חובה — גמיש' : TYPE_HE[type] || type)),
    c.weekly_hours != null ? mkRow('שעות שבועיות:', `${esc(c.weekly_hours)} ש׳׳ש`) : mkRow('שעות שבועיות:', '<span style="color:var(--miss-accent)">לא ידוע</span>'),
    level ? mkRow('רמת קושי:', `${esc(DIFF_HE[level]||level)} (${esc(c.difficulty_score??'')})`) : '',
    status !== 'eligible' ? mkRow('מצב:', esc(STAT_HE[status] || status)) : '',
    c.semester_availability ? mkRow('זמינות:', esc(c.semester_availability)) : '',
    (c.allowed_semesters?.length > 1) ? mkRow('ניתן לשיבוץ ב:', esc(_allowedSemLabels)) : '',
    c.needs_verification ? mkRow('אימות:', '<span style="color:var(--warning)">⚠ ממתין לאימות</span>') : '',
  ].filter(Boolean).join('');

  /* Difficulty breakdown section */
  const hasDiffData = c.workload_score != null || c.conceptual_complexity_score != null
                      || c.prerequisite_depth_score != null || c.assessment_intensity_score != null;
  const diffSection = (() => {
    if (!hasDiffData) return '';
    const conf = c.difficulty_confidence;
    const pct  = score => score != null ? Math.round((score - 1) / 4 * 100) : null;

    const bar  = (label, score, color) => {
      if (score == null) return '';
      const p = pct(score);
      return `<div class="diff-brow">
        <span class="diff-blbl">${label}</span>
        <div class="diff-btrack"><div class="diff-bfill" style="width:${p}%;background:${color}"></div></div>
        <span class="diff-bval">${score.toFixed(1)}</span>
      </div>`;
    };

    const bars = [
      bar('מורכבות מושגית',  c.conceptual_complexity_score, 'var(--purple)'),
      bar('עומס לימודי',       c.workload_score,              '#3B82F6'),
      bar('עומק דרישות קדם',  c.prerequisite_depth_score,    'var(--success)'),
      bar('עצימות הערכה',     c.assessment_intensity_score,  'var(--warning)'),
    ].filter(Boolean).join('');

    const confHtml = conf != null
      ? `<div class="diff-conf">ביטחון: <strong>${Math.round(conf*100)}%</strong></div>`
      : '';

    const lowConfWarn = conf != null && conf < 0.6
      ? `<div class="detail-warn" style="margin-top:6px">⚠ מדד הקושי אינו ודאי כי חסר סילבוס או מידע שעות.</div>`
      : '';

    const diffWarns = (c.difficulty_warnings || []).map(w =>
      `<div class="detail-warn">⚠ ${esc(w)}</div>`).join('');

    return mkSection('פירוט מדד הקושי', bars + confHtml + lowConfWarn + diffWarns);
  })();

  /* Grade statistics section (secondary / unofficial) */
  const gradeSection = (() => {
    const gs = c.grade_signal;
    if (!gs) return '';
    const pct = gs.pass_rate != null ? `${Math.round(gs.pass_rate * 100)}%` : null;
    const rows = [
      gs.average_grade      != null ? mkRow('ממוצע:',           `${gs.average_grade}`)    : '',
      gs.median_grade       != null ? mkRow('חציון:',           `${gs.median_grade}`)      : '',
      gs.standard_deviation != null ? mkRow('סטיית תקן:',      `${gs.standard_deviation}`) : '',
      pct                           ? mkRow('שיעור עוברים:',   pct)                        : '',
      gs.num_students_total != null ? mkRow('סה״כ סטודנטים:', `${gs.num_students_total}`)  : '',
      gs.years_available?.length    ? mkRow('שנים זמינות:',    gs.years_available.join(', ')) : '',
      mkRow('מקור:', `<span style="color:var(--text-muted);font-size:.68rem">${esc(gs.source_name || 'TAU Refactor')}</span>`),
    ].filter(Boolean).join('');
    const unofficialWarn = `<div class="detail-warn" style="margin-top:6px">⚠ מקור לא רשמי; לא בהכרח משקף את הסמסטר הקרוב.</div>`;
    return mkSection('נתוני ציונים היסטוריים', rows + unofficialWarn);
  })();

  /* Instructor uncertainty section */
  const instructorSection = (() => {
    const iu = c.instructor_uncertainty;

    // Merge backend instructor_notes with user's localStorage override fields
    const ov = getOverride(cid);
    const userExpected = ov?.expected_instructor?.trim()        || null;
    const userNotes    = ov?.known_instructor_notes?.trim()     || null;

    // If nothing at all, render a minimal note only when current lecturer is unknown
    const hasBacked = iu && (iu.current_lecturers?.length || iu.historical_lecturers?.length
                             || iu.instructor_uncertainty_score > 0 || iu.warnings?.length);
    const hasUserData = userExpected || userNotes;
    if (!hasBacked && !hasUserData) return '';

    const score = iu?.instructor_uncertainty_score ?? null;
    const scoreColor = score == null ? '#9CA3AF'
      : score < 0.30 ? 'var(--success)'
      : score < 0.60 ? 'var(--warning)'
      : 'var(--danger)';

    let html = '';

    // Score bar
    if (score != null) {
      const pct = Math.round(score * 100);
      html += `<div class="iu-score-row">
        <div class="iu-track"><div class="iu-fill" style="width:${pct}%;background:${scoreColor}"></div></div>
        <span class="iu-val">${pct}%</span>
      </div>`;
    }

    // Current lecturers (backend data + user override)
    const currentAll = [...(iu?.current_lecturers || [])];
    if (userExpected && !currentAll.includes(userExpected)) currentAll.push(userExpected);
    if (currentAll.length) {
      html += mkRow('מרצה נוכחי:', '');
      html += `<div class="iu-lecturers">${currentAll.map(n => `<span class="iu-lecturer-tag">${esc(n)}</span>`).join('')}</div>`;
    }

    // Historical lecturers
    const hist = iu?.historical_lecturers || [];
    if (hist.length) {
      html += mkRow('מרצים היסטוריים:', '');
      html += `<div class="iu-lecturers">${hist.map(n => `<span class="iu-lecturer-tag" style="opacity:.7">${esc(n)}</span>`).join('')}</div>`;
    }

    // Warnings from backend
    const iuWarns = (iu?.warnings || []).map(w =>
      `<div class="detail-warn" style="margin-top:5px">⚠ ${esc(w)}</div>`
    ).join('');
    html += iuWarns;

    // User-provided instructor notes (from localStorage)
    if (userNotes) {
      html += `<div class="iu-user-note">✏ <strong>הערת משתמש:</strong> ${esc(userNotes)}</div>`;

    return mkSection('אי־ודאות מרצה', html || '<div class="detail-none">אין מידע מרצה</div>');

  const prereqDetails  = (c.prerequisite_details         || []);
  const missingDetails = (c.missing_prerequisite_details || []);

  const mkPrereqChip = (detail, isMissing) => {
    const cls = isMissing ? 'detail-chip missing' : 'detail-chip';
    if (detail.name_he) {
      return `<span class="${cls}">${esc(detail.name_he)} <span class="prereq-id">(${esc(detail.course_id)})</span></span>`;
    }
    return `<span class="${cls} prereq-no-name">${esc(detail.course_id)} <span class="prereq-id">— שם לא נמצא</span></span>`;
  };

  const prereqChipsHtml = prereqDetails.length
    ? `<div class="detail-chips">${prereqDetails.map(d => mkPrereqChip(d, false)).join('')}</div>`
    : (prereqs.length
        ? `<div class="detail-chips">${prereqs.map(p=>`<span class="detail-chip">${esc(p)}</span>`).join('')}</div>`
        : '<div class="detail-none">אין דרישות קדם</div>');

  const missingChipsHtml = missingDetails.length
    ? `<div style="margin-top:6px"><div class="detail-section-title" style="color:var(--danger)">דרישות קדם חסרות</div>
         <div class="detail-chips">${missingDetails.map(d => mkPrereqChip(d, true)).join('')}</div></div>`
    : (missing.length
        ? `<div style="margin-top:6px"><div class="detail-section-title" style="color:var(--danger)">דרישות קדם חסרות</div>
             <div class="detail-chips">${missing.map(p=>`<span class="detail-chip missing">${esc(p)}</span>`).join('')}</div></div>`
        : '');

  const prereqSection = (prereqs.length || missing.length || prereqDetails.length || missingDetails.length)
    ? mkSection('דרישות קדם', prereqChipsHtml + missingChipsHtml)
    : '';

  /* Prerequisite validation status section (only for placed courses) */
  const validationSection = (() => {
    const vr = boardValidation[cid];
    if (!vr) return '';

    const statusColor = vr.valid ? 'var(--success)' : 'var(--danger)';
    const statusIcon  = vr.valid ? '✅' : '❌';
    const statusText  = vr.valid ? 'כל דרישות הקדם מסופקות' : 'דרישות קדם לא מסופקות';
    const header = `<div style="margin-bottom:8px;font-weight:600;color:${statusColor}">${statusIcon} ${statusText}</div>`;

    const chips = (ids, cls) =>
      `<div class="detail-chips">${ids.map(p => `<span class="detail-chip ${cls}">${esc(_prereqName(p))} <span class="prereq-id">(${esc(p)})</span></span>`).join('')}</div>`;

    const rows = [
      vr.ok_completed.length ? mkRow('הושלמו לפני:',    chips(vr.ok_completed, ''))        : '',
      vr.ok_current?.length  ? mkRow('נלמד עכשיו:',     chips(vr.ok_current,   ''))        : '',
      vr.ok_earlier.length   ? mkRow('סמסטר קודם:',     chips(vr.ok_earlier,   ''))        : '',
      vr.same_sem.length     ? mkRow('אותו סמסטר:',     chips(vr.same_sem,     'missing')) : '',
      vr.too_late.length     ? mkRow('סמסטר מאוחר:',    chips(vr.too_late,     'missing')) : '',
      vr.missing.length      ? mkRow('לא שובצו כלל:',   chips(vr.missing,      'missing')) : '',
    ].filter(Boolean).join('');

    return mkSection('בדיקת דרישות קדם', header + rows);
  })();

  /* Warnings section */
  const warnSection = warns.length
    ? mkSection('אזהרות', warns.map(w=>`<div class="detail-warn">⚠ ${esc(w)}</div>`).join(''))
    : '';

  /* Source / quality section */
  const qualRows = [
    src  ? mkRow('מקור:', esc(src)) : '',
    conf ? mkRow('ביטחון הצבה:', esc(CONF_HE[conf] || conf)) : '',
    c.data_quality?.has_weekly_hours === false ? mkRow('שעות:', '<span style="color:var(--miss-accent)">חסרות</span>') : '',
  ].filter(Boolean).join('');
  const qualSection = qualRows ? mkSection('מקור ואיכות נתונים', qualRows) : '';

  /* Syllabus button */
  const sylBtn = sylUrl
    ? `<a href="${esc(sylUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">📖 פתח סילבוס</a>`
    : `<button class="btn" disabled>📖 פתח סילבוס</button>`;
  const sylNote = !sylUrl
    ? '<span class="detail-syl-note">סילבוס לא זמין במידע שנשמר</span>'
    : '';

  /* Override sections */
  const overrideDisplaySection = buildOverrideDisplaySection(existingOverride, mkSection, mkRow);
  const overrideEditPanel      = buildOverridePanel(cid, existingOverride);

  /* AI chat panel */
  const aiPanelHtml = buildAiChatPanel(c);

  /* Assemble panel */
  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-head">
      <div class="detail-head-row">
        <span class="detail-cid" dir="ltr">${esc(cid)}</span>
        <button class="detail-close" id="detail-close-x" aria-label="סגור">✕</button>
      </div>
      <div class="detail-name${c.name_he?'':' unnamed'}">${c.name_he?esc(c.name_he):'⚠ שם חסר — נדרש רענון מידע'}</div>
      <div class="detail-badges">${typeBdg} ${diffBdg} ${hoursHtml}</div>
    </div>
    <div class="detail-tabs">
      <button class="detail-tab active" data-tab="info">פרטי קורס</button>
      <button class="detail-tab" data-tab="ai">🤖 שיחה עם AI <span style="font-size:.58rem;opacity:.6">(לא מחובר)</span></button>
    </div>
    <div class="detail-body tabbed">
      <div class="detail-tab-panel active" id="dtab-info">
        ${mkSection('פרטי קורס', basicRows || '<div class="detail-none">אין מידע</div>')}
        ${diffSection}
        ${gradeSection}
        ${instructorSection}
        ${validationSection}
        ${prereqSection}
        ${warnSection}
        ${qualSection}
        ${overrideDisplaySection}
        ${overrideEditPanel}
      </div>
      <div class="detail-tab-panel" id="dtab-ai">
        ${aiPanelHtml}
      </div>
    </div>
    <div class="detail-foot">
      ${sylBtn}
      ${sylNote}
      <button class="btn btn-ghost" id="override-edit-btn">✏ עריכת מידע חסר</button>
      <button class="btn btn-ghost" id="detail-close-btn" style="margin-inline-start:auto">סגור</button>
    </div>`;

  const overlay = document.getElementById('detail-overlay');
  overlay.classList.remove('hiding');
  overlay.removeAttribute('hidden');

  document.getElementById('detail-close-x').addEventListener('click', closeDetails);
  document.getElementById('detail-close-btn').addEventListener('click', closeDetails);
  document.getElementById('override-edit-btn').addEventListener('click', () => {
    const panel = document.getElementById('override-panel');
    if (panel.hasAttribute('hidden')) panel.removeAttribute('hidden');
    else panel.setAttribute('hidden', '');
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  document.getElementById('override-save-btn').addEventListener('click', () => {
    saveOverride(cid);
    const msg = document.getElementById('override-save-msg');
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 1800);
  });
  document.getElementById('override-export-btn').addEventListener('click', exportOverrides);

  /* Tab switching */
  document.querySelectorAll('.detail-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.detail-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.detail-tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`dtab-${tab}`).classList.add('active');
    });
  });

  /* AI suggested prompts → populate textarea */
  document.getElementById('ai-prompt-list').addEventListener('click', e => {
    const btn = e.target.closest('.ai-prompt-btn');
    if (!btn) return;
    const input = document.getElementById('ai-chat-input');
    input.value = btn.dataset.prompt;
    input.focus();
  });

  /* AI send */
  document.getElementById('ai-chat-send').addEventListener('click', () => handleAiSend(c));
  document.getElementById('ai-chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleAiSend(c);
  });
}

function closeDetails() {
  const overlay = document.getElementById('detail-overlay');
  overlay.classList.add('hiding');
  setTimeout(() => {
    overlay.setAttribute('hidden', '');
    overlay.classList.remove('hiding');
  }, 200);
}

function setupDetailOverlay() {
  /* Click outside panel to close */
  document.getElementById('detail-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeDetails();
  });
}

/* ── Global keyboard handler ────────────────────────────────────────────── */
function setupGlobalKeys() {
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const detailOpen    = !document.getElementById('detail-overlay').hidden;
    const myCoursesOpen = !document.getElementById('my-courses-modal').hidden;
    const modalOpen     = !document.getElementById('prog-modal').hidden;
    if (detailOpen) {
      closeDetails();
    } else if (myCoursesOpen) {
      closeMyCoursesModal();
    } else if (modalOpen && selectedProg) {
      hideModal();
    }
  });
}

/* ── Lock helpers ───────────────────────────────────────────────────────── */
function isLocked(c) {
  return c &&
         c.course_type       === 'mandatory' &&
         (c.locked_by_default ?? true) === true &&
         !(state?.unlockedIds||[]).includes(c.course_id);
}

/* True when a mandatory course may be dragged between multiple allowed semesters */
function isFlexibleMandatory(c) {
  return c?.course_type === 'mandatory' && (c.allowed_semesters || []).length > 1;
}

/* False when drop target semester is outside the course's allowed_semesters */
function isSemesterAllowed(c, semId) {
  const allowed = c?.allowed_semesters || [];
  return allowed.length === 0 || allowed.includes(semId);
}

/* ── Prerequisite validation (client-side mirror of plan_validator.py) ──── */
function _prereqName(cid) {
  return courseMap[cid]?.name_he || cid;
}

function validatePlacement(courseId, targetSemId) {
  const semIds    = SEMESTERS.map(s => s.id);
  const targetIdx = semIds.indexOf(targetSemId);
  if (targetIdx === -1) {
    return { valid: true, missing: [], too_late: [], same_sem: [], ok_completed: [], ok_earlier: [], ok_current: [], errors: [] };
  }

  // Build index: courseId → semesterIndex, excluding the course being validated
  const courseSemIdx = {};
  for (let i = 0; i < semIds.length; i++) {
    for (const cid of (state.semesters[semIds[i]] || [])) {
      if (cid !== courseId) courseSemIdx[cid] = i;
    }
  }

  const prereqs      = courseMap[courseId]?.prerequisites || [];
  const completedSet = new Set(completedCourseIds);
  const currentSet   = new Set(myCoursesState.current);
  const missing = [], too_late = [], same_sem = [], ok_completed = [], ok_earlier = [], ok_current = [];

  for (const prereq of prereqs) {
    if (completedSet.has(prereq)) {
      ok_completed.push(prereq);
    } else if (currentSet.has(prereq)) {
      // Currently taking — satisfies prereq (with informational note, no blocking)
      ok_current.push(prereq);
    } else if (prereq in courseSemIdx) {
      const idx = courseSemIdx[prereq];
      if (idx < targetIdx)       ok_earlier.push(prereq);
      else if (idx === targetIdx) same_sem.push(prereq);
      else                        too_late.push(prereq);
    } else {
      missing.push(prereq);
    }
  }

  const valid  = missing.length === 0 && too_late.length === 0 && same_sem.length === 0;
  const errors = [...missing, ...too_late, ...same_sem];
  return { valid, missing, too_late, same_sem, ok_completed, ok_earlier, ok_current, errors };
}

function revalidateBoard() {
  // Keep completedCourseIds merged from board metadata + user-marked
  completedCourseIds = [...new Set([..._boardCompletedIds, ...myCoursesState.completed])];
  boardValidation = {};
  for (const [semId, ids] of Object.entries(state.semesters)) {
    for (const cid of (ids || [])) {
      boardValidation[cid] = validatePlacement(cid, semId);
    }
  }
}

/* ── Board notification toast ───────────────────────────────────────────── */
function showBoardNotify(msg) {
  let el = document.getElementById('board-notify');
  if (!el) {
    el = document.createElement('div');
    el.id = 'board-notify';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.removeAttribute('hidden');
  clearTimeout(_notifyTimer);
  _notifyTimer = setTimeout(hideBoardNotify, 3500);
}

function hideBoardNotify() {
  const el = document.getElementById('board-notify');
  if (el) el.setAttribute('hidden', '');
}

/* ── Drag & Drop ────────────────────────────────────────────────────────── */
function setupDragDelegation() {
  document.addEventListener('dragstart', e => {
    const card = e.target.closest('.course-card[draggable="true"]');
    if (!card) return;
    const cid = card.dataset.cid;
    const c   = courseMap[cid];
    if (isLocked(c)) { e.preventDefault(); return; }
    if (c?.status === 'blocked' && !allowBlockedDrag) { e.preventDefault(); return; }
    dragId      = cid;
    const sz    = card.closest('[data-zone="semester"]');
    dragFromSem = sz ? sz.dataset.sem : null;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', cid);
  });

  document.addEventListener('dragend', e => {
    const card = e.target.closest('.course-card');
    if (card) card.classList.remove('dragging');
    document.querySelectorAll('.drag-over,.drag-valid,.drag-invalid').forEach(el => {
      el.classList.remove('drag-over', 'drag-valid', 'drag-invalid');
      delete el.dataset.dragErr;
    });
    dragId = null; dragFromSem = null;
  });

  document.addEventListener('dragover', e => {
    const zone = e.target.closest('[data-zone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('drag-over');

    if (dragId && zone.dataset.zone === 'semester') {
      const vr         = validatePlacement(dragId, zone.dataset.sem);
      const dragCourse = courseMap[dragId];
      const semBlocked = !isSemesterAllowed(dragCourse, zone.dataset.sem);
      zone.classList.toggle('drag-valid',   vr.valid && !semBlocked);
      zone.classList.toggle('drag-invalid', !vr.valid || semBlocked);
      if (!vr.valid || semBlocked) {
        zone.dataset.dragErr = `חסרות דרישות קדם: ${vr.errors.map(_prereqName).join(', ')}`;
        e.dataTransfer.dropEffect = allowInvalidPlacement ? 'move' : 'none';
      } else {
        delete zone.dataset.dragErr;
        e.dataTransfer.dropEffect = 'move';
      }
    } else {
      e.dataTransfer.dropEffect = 'move';
    }
  });

  document.addEventListener('dragleave', e => {
    const zone = e.target.closest('[data-zone]');
    if (!zone) return;
    if (!zone.contains(e.relatedTarget)) {
      zone.classList.remove('drag-over', 'drag-valid', 'drag-invalid');
      delete zone.dataset.dragErr;
    }
  });

  document.addEventListener('drop', e => {
    const zone = e.target.closest('[data-zone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('drag-over', 'drag-valid', 'drag-invalid');
    delete zone.dataset.dragErr;

    const id    = e.dataTransfer.getData('text/plain') || dragId;
    const toSem = zone.dataset.zone === 'semester' ? zone.dataset.sem : null;

    if (id && toSem) {
      const dropCourse = courseMap[id];
      /* Mandatory course semester restriction */
      if (!isSemesterAllowed(dropCourse, toSem)) {
        if (!allowInvalidPlacement) {
          showBoardNotify('הקורס אינו מוצע בסמסטר זה לפי תוכנית הלימודים');
          return;
        }
        showBoardNotify('⚠ אזהרה: הקורס אינו מוצע בסמסטר זה לפי תוכנית הלימודים');
      }
      /* Prerequisite validation */
      const vr = validatePlacement(id, toSem);
      if (!vr.valid && !allowInvalidPlacement) {
        showBoardNotify(`לא ניתן לשבץ: חסרות דרישות קדם: ${vr.errors.map(_prereqName).join(', ')}`);
        return;
      }
    }
    moveCourse(id, dragFromSem, toSem);
  });

  /* Click delegation for rm/lock buttons */
  document.addEventListener('click', e => {
    const rmBtn = e.target.closest('[data-rm]');
    if (rmBtn) {
      const id = rmBtn.dataset.rm;
      const sz = rmBtn.closest('[data-zone="semester"]');
      if (sz) moveCourse(id, sz.dataset.sem, null);
      return;
    }
    const lkBtn = e.target.closest('[data-toggle-lock]');
    if (lkBtn) {
      const id = lkBtn.dataset.toggleLock;
      const c  = courseMap[id];
      if (!c || c.course_type !== 'mandatory') return;
      const idx = (state.unlockedIds||[]).indexOf(id);
      if (idx === -1) state.unlockedIds.push(id);
      else            state.unlockedIds.splice(idx,1);
      saveState(); renderAll();
    }
  });

  /* Accordion toggle tracking (capture phase — toggle doesn't bubble) */
  document.addEventListener('toggle', e => {
    const det = e.target.closest('details.repo-group[data-group]');
    if (!det) return;
    if (det.open) openGroups.add(det.dataset.group);
    else          openGroups.delete(det.dataset.group);
  }, true);
}

/* ── Card click → open details ──────────────────────────────────────────── */
function setupCardClick() {
  document.addEventListener('click', e => {
    /* Skip if clicking a button or other interactive element inside card */
    if (e.target.closest('button,a,input,textarea,summary')) return;
    const card = e.target.closest('.course-card');
    if (!card) return;
    openCourseDetails(card.dataset.cid);
  });
}

/* ── State mutations ────────────────────────────────────────────────────── */
function moveCourse(id, fromSem, toSem) {
  if (!id || fromSem === toSem) return;
  const c = courseMap[id];
  if (isLocked(c)) return;

  if (fromSem) state.semesters[fromSem] = (state.semesters[fromSem]||[]).filter(x=>x!==id);
  else         state.repo = state.repo.filter(x=>x!==id);

  if (toSem) {
    if (!state.semesters[toSem]) state.semesters[toSem] = [];
    if (!state.semesters[toSem].includes(id)) state.semesters[toSem].push(id);
  } else {
    if (!state.repo.includes(id)) state.repo.push(id);
  }
  saveState(); renderAll();
}

function resetBoard() {
  state = clone(originalState);
  localStorage.removeItem(_lsStateKey());
  renderAll();
}

function buildRecommendedPlan() {
  const MAX_PER_SEM = 5;
  const semA    = SEMESTERS.filter(s => s.season === 'a').map(s => s.id);
  const semB    = SEMESTERS.filter(s => s.season === 'b').map(s => s.id);
  const allSems = SEMESTERS.map(s => s.id);

  const byPref = { a: [], b: [], any: [] };
  for (const cid of [...state.repo]) {
    const c = courseMap[cid];
    if (!c || c.course_type === 'mandatory') continue;
    const sems = (c.offered_semesters || []).map(s => s.toLowerCase());
    if      (sems.length === 1 && sems[0] === 'a') byPref.a.push(cid);
    else if (sems.length === 1 && sems[0] === 'b') byPref.b.push(cid);
    else                                           byPref.any.push(cid);
  }

  const diff = cid => courseMap[cid]?.difficulty_score ?? 5;
  byPref.a.sort((a, b) => diff(a) - diff(b));
  byPref.b.sort((a, b) => diff(a) - diff(b));
  byPref.any.sort((a, b) => diff(a) - diff(b));

  /* Batch-place without re-rendering per course */
  const placed = new Set();
  const _place = (cids, semPool) => {
    for (const cid of cids) {
      if (placed.has(cid)) continue;
      const sem = semPool.find(s => (state.semesters[s] || []).length < MAX_PER_SEM);
      if (!sem) continue;
      state.repo = state.repo.filter(x => x !== cid);
      if (!state.semesters[sem]) state.semesters[sem] = [];
      if (!state.semesters[sem].includes(cid)) state.semesters[sem].push(cid);
      placed.add(cid);
    }
  };

  _place(byPref.a,   semA);
  _place(byPref.b,   semB);
  _place(byPref.any, allSems);

  saveState(); renderAll();
  showBoardNotify('תוכנית מומלצת נבנתה — ניתן לגרור קורסים לשינוי');
}

/* ── Persistence ────────────────────────────────────────────────────────── */
function _lsStateKey() { return `${LS_STATE_PREFIX}_${selectedProg?.program_id || 'default'}`; }
function saveState() {
  try {
    localStorage.setItem(_lsStateKey(), JSON.stringify({ ...state, program_id: selectedProg?.program_id, state_version: selectedProg?.state_version ?? null }));
  } catch {}
}
function tryLoadState() {
  try { return JSON.parse(localStorage.getItem(_lsStateKey())); } catch { return null; }
}
function validState(s) {
  if (!s || typeof s.semesters !== 'object' || !Array.isArray(s.repo)) return false;
  if (s.program_id && selectedProg?.program_id && s.program_id !== selectedProg.program_id) return false;
  if (selectedProg?.state_version && s.state_version !== selectedProg.state_version) return false;
  return true;
}

/* ── Dark mode ──────────────────────────────────────────────────────────── */
function applyTheme() {
  const dark = localStorage.getItem(LS_THEME) === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const btn = document.getElementById('btn-dark');
  if (btn) btn.textContent = dark ? '☀ יום' : '☾ לילה';
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(LS_THEME, next);
  document.documentElement.dataset.theme = next;
  document.getElementById('btn-dark').textContent = next === 'dark' ? '☀ יום' : '☾ לילה';
}

/* ── My Courses ─────────────────────────────────────────────────────────── */
function loadMyCoursesState() {
  try {
    const raw = localStorage.getItem(LS_MY_COURSES);
    if (raw) {
      const parsed = JSON.parse(raw);
      myCoursesState.completed = Array.isArray(parsed.completed) ? parsed.completed : [];
      myCoursesState.current   = Array.isArray(parsed.current)   ? parsed.current   : [];
    }
  } catch { myCoursesState = { completed: [], current: [] }; }
}

function saveMyCoursesState() {
  try { localStorage.setItem(LS_MY_COURSES, JSON.stringify(myCoursesState)); } catch {}
}

function toggleMyCourse(cid, status) {
  const compIdx = myCoursesState.completed.indexOf(cid);
  const currIdx = myCoursesState.current.indexOf(cid);
  if (status === 'completed') {
    if (compIdx !== -1) { myCoursesState.completed.splice(compIdx, 1); }
    else {
      myCoursesState.completed.push(cid);
      if (currIdx !== -1) myCoursesState.current.splice(currIdx, 1); // remove from current
    }
  } else if (status === 'current') {
    if (currIdx !== -1) { myCoursesState.current.splice(currIdx, 1); }
    else {
      myCoursesState.current.push(cid);
      if (compIdx !== -1) myCoursesState.completed.splice(compIdx, 1); // remove from completed
    }
  }
  saveMyCoursesState();
}

function openMyCoursesModal() {
  const modal = document.getElementById('my-courses-modal');
  document.body.classList.add('my-courses-open');
  modal.classList.remove('hiding');
  modal.removeAttribute('hidden');

  const searchEl = document.getElementById('my-courses-search');
  const listEl   = document.getElementById('my-courses-list');
  searchEl.value = '';
  _renderMyCoursesListContent(listEl, '');
  setTimeout(() => searchEl.focus(), 60);

  searchEl.oninput = () => _renderMyCoursesListContent(listEl, searchEl.value);

  listEl.onclick = e => {
    const btn = e.target.closest('[data-mc-status]');
    if (!btn) return;
    toggleMyCourse(btn.dataset.mcCid, btn.dataset.mcStatus);
    _renderMyCoursesListContent(listEl, searchEl.value);
    renderAll();
  };

  document.getElementById('my-courses-close-btn').onclick = closeMyCoursesModal;

  /* Click overlay (outside dialog) to close */
  modal.onclick = e => { if (e.target === modal) closeMyCoursesModal(); };
}

function closeMyCoursesModal() {
  const modal = document.getElementById('my-courses-modal');
  modal.classList.add('hiding');
  setTimeout(() => {
    modal.setAttribute('hidden', '');
    modal.classList.remove('hiding');
    document.body.classList.remove('my-courses-open');
  }, 220);
}

function _renderMyCoursesListContent(listEl, query) {
  const q = (query || '').toLowerCase().trim();
  const completedSet = new Set(myCoursesState.completed);
  const currentSet   = new Set(myCoursesState.current);

  const courses = Object.values(courseMap)
    .filter(c => !q ||
      c.course_id.toLowerCase().includes(q) ||
      (c.name_he || '').toLowerCase().includes(q))
    .sort((a, b) => {
      const an = a.name_he || a.course_id, bn = b.name_he || b.course_id;
      return an.localeCompare(bn, 'he');
    });

  /* Update summary line */
  const sumEl = document.getElementById('my-courses-summary');
  if (sumEl) {
    sumEl.innerHTML = `
      <span>✅ ${myCoursesState.completed.length} הושלמו</span>
      <span>📖 ${myCoursesState.current.length} נלמדים עכשיו</span>
    `;
  }

  if (!courses.length) {
    listEl.innerHTML = '<div class="prog-empty">לא נמצאו קורסים</div>';
    return;
  }

  listEl.innerHTML = courses.map(c => {
    const isDone    = completedSet.has(c.course_id);
    const isCurrent = currentSet.has(c.course_id);
    const rowCls    = isDone ? 'my-course-completed' : isCurrent ? 'my-course-current' : '';
    const nameHtml  = c.name_he
      ? esc(c.name_he)
      : `<span style="color:var(--text-faint);font-style:italic">שם חסר — ${esc(c.course_id)}</span>`;
    return `<div class="my-course-row ${rowCls}">
      <div class="my-course-info">
        <span class="my-course-id" dir="ltr">${esc(c.course_id)}</span>
        <span class="my-course-name">${nameHtml}</span>
      </div>
      <div class="my-course-actions">
        <button class="my-course-btn status-completed${isDone?' active':''}"
          data-mc-status="completed" data-mc-cid="${esc(c.course_id)}"
          title="${isDone ? 'בטל סימון הושלם' : 'סמן כהושלם'}">
          ${isDone ? '✅ הושלם' : 'הושלם'}
        </button>
        <button class="my-course-btn status-current${isCurrent?' active':''}"
          data-mc-status="current" data-mc-cid="${esc(c.course_id)}"
          title="${isCurrent ? 'בטל סימון נלמד עכשיו' : 'סמן כנלמד עכשיו'}">
          ${isCurrent ? '📖 נלמד' : 'נלמד עכשיו'}
        </button>
      </div>
    </div>`;
  }).join('');
}

/* ── Utilities ──────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function clone(o)       { return JSON.parse(JSON.stringify(o)); }
function allPlacedIds() { return new Set(Object.values(state?.semesters||{}).flat()); }
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return r.json();
}

main();
</script>
