<!DOCTYPE html>
<!--
  TAU Course Planner — Semester Board
  ────────────────────────────────────
  פתיחה:
    1. פיתחו טרמינל בתיקיית הפרויקט (tau-course-planner/).
    2. הריצו:  python -m http.server 8080
    3. פיתחו:  http://localhost:8080/app/web/semester_board_viewer.html
-->
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מתכנן לימודים — אוניברסיטת תל אביב</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Author display rules must never override the HTML hidden attribute */
[hidden] { display: none !important; }

/* ── Design tokens ──────────────────────────────────────────────────────── */
:root {
  --bg:        #F7F7FB;
  --bg2:       #EEEFF5;
  --surface:   #FFFFFF;
  --surface2:  #F3F4F9;
  --border:    #E5E7EB;
  --border2:   #D1D5DB;
  --text:      #111827;
  --text-muted:#6B7280;
  --text-faint:#9CA3AF;
  --radius:    10px;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,.12);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
  --t:         180ms ease;

  --easy-bg:#D1FAE5; --easy-text:#065F46; --easy-border:#6EE7B7;
  --med-bg:#FEF3C7;  --med-text:#92400E;  --med-border:#FCD34D;
  --hard-bg:#FEE2E2; --hard-text:#991B1B; --hard-border:#FCA5A5;
  --vhard-bg:#FCE7F3;--vhard-text:#9D174D;--vhard-border:#F9A8D4;

  --purple:      #7C3AED; --purple-soft:#EDE9FE;
  --blue:        #2563EB; --blue-soft:  #DBEAFE;
  --warning:     #F59E0B; --warn-soft:  #FEF3C7;
  --danger:      #EF4444;
  --success:     #10B981;

  --mand-accent:#2563EB; --mand-bg:#EFF6FF; --mand-lock-bg:#DBEAFE;
  --elec-accent:#7C3AED; --elec-bg:#FFFFFF;
  --blk-accent: #9CA3AF; --blk-bg: #F9FAFB;
  --miss-accent:#F59E0B; --miss-bg: #FFFBEB;

  --y3a:#2563EB; --y3b:#1D4ED8; --y4a:#7C3AED; --y4b:#6D28D9;
  --sidebar-w:284px;
  --hdr-h:54px;

  /* ── Category accent colors (2027 program) ── */
  --cat-fluids-accent:  #0891B2; --cat-fluids-bg:  rgba(8,145,178,.06);
  --cat-solids-accent:  #D97706; --cat-solids-bg:  rgba(217,119,6,.06);
  --cat-systems-accent: #7C3AED; --cat-systems-bg: rgba(124,58,237,.06);
  --cat-labs-accent:    #059669; --cat-labs-bg:    rgba(5,150,105,.06);
  --cat-other-accent:   #64748B; --cat-other-bg:   rgba(100,116,139,.04);
}

[data-theme="dark"] {
  --bg:#0F1117; --bg2:#171A23;
  --surface:#171A23; --surface2:#1F2430;
  --border:#2D3342; --border2:#3D4455;
  --text:#F9FAFB; --text-muted:#A1A1AA; --text-faint:#6B7280;

  --easy-bg:#064E3B; --easy-text:#6EE7B7; --easy-border:#065F46;
  --med-bg:#78350F;  --med-text:#FCD34D;  --med-border:#92400E;
  --hard-bg:#7F1D1D; --hard-text:#FCA5A5; --hard-border:#991B1B;
  --vhard-bg:#831843;--vhard-text:#F9A8D4;--vhard-border:#9D174D;

  --purple:#A78BFA; --purple-soft:#2E1065;
  --blue:  #60A5FA; --blue-soft:  #1E3A5F;
  --warning:#FCD34D;--warn-soft:  #451A03;
  --danger: #F87171;
  --success:#34D399;

  --mand-accent:#60A5FA; --mand-bg:#1E3A5F; --mand-lock-bg:#162E50;
  --elec-accent:#A78BFA; --elec-bg:#1F2430;
  --blk-bg:#1A1E2A; --miss-bg:#451A03;

  --cat-fluids-accent:  #22D3EE; --cat-fluids-bg:  rgba(8,145,178,.12);
  --cat-solids-accent:  #FBBF24; --cat-solids-bg:  rgba(217,119,6,.12);
  --cat-systems-accent: #A78BFA; --cat-systems-bg: rgba(124,58,237,.12);
  --cat-labs-accent:    #34D399; --cat-labs-bg:    rgba(5,150,105,.12);
  --cat-other-accent:   #94A3B8; --cat-other-bg:   rgba(100,116,139,.08);
}

/* ── Base ───────────────────────────────────────────────────────────────── */
html, body { height:100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; display: flex; flex-direction: column;
  overflow: hidden; transition: background var(--t), color var(--t);
}
/* Restore body scroll when modal is NOT open */
body:not(.prog-modal-open):not(.my-courses-open) { overflow: hidden; }

/* Workspace blur when program picker is open (only affects board content) */
body.prog-modal-open .workspace {
  filter: blur(3px) saturate(0.7);
  pointer-events: none;
  transition: filter 250ms ease;
}

/* ── Shared modal animation ─────────────────────────────────────────────── */
@keyframes fadeIn  { from { opacity:0; }              to { opacity:1; } }
@keyframes fadeOut { from { opacity:1; }              to { opacity:0; } }
@keyframes slideUp { from { transform:translateY(18px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes slideIn { from { transform:translateY(12px); opacity:0; } to { transform:none; opacity:1; } }

/* ── Program selection modal ────────────────────────────────────────────── */
.prog-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(5px);
  animation: fadeIn 220ms ease;
  padding: 20px;
}
.prog-overlay.hiding { animation: fadeOut 200ms ease forwards; }

.prog-dialog {
  background: var(--surface);
  border-radius: 18px;
  padding: 32px 34px 26px;
  box-shadow: var(--shadow-lg);
  max-width: 520px; width: 100%;
  max-height: 88vh;
  display: flex; flex-direction: column;
  animation: slideUp 240ms ease;
  overflow: hidden;
  position: relative;
}

.prog-close-btn {
  position: absolute; top: 14px; inset-inline-end: 14px;
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: .82rem; transition: background var(--t), color var(--t), border-color var(--t);
}
.prog-close-btn:hover { background: var(--bg2); color: var(--danger); border-color: var(--danger); }

.prog-header { margin-bottom: 16px; padding-inline-end: 28px; }
.prog-title {
  font-size: 1.4rem; font-weight: 800; margin-bottom: 4px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.prog-subtitle { font-size: .82rem; color: var(--text-muted); }

.prog-search-wrap { position: relative; margin-bottom: 12px; flex-shrink: 0; }
.prog-search-icon {
  position: absolute; inset-inline-end: 11px; top: 50%; transform: translateY(-50%);
  font-size: .85rem; color: var(--text-faint); pointer-events: none;
}
.prog-search {
  width: 100%; padding: 10px 12px 10px 36px;
  border: 1.5px solid var(--border2); border-radius: var(--radius);
  background: var(--surface2); color: var(--text);
  font-size: .85rem; font-family: inherit; direction: rtl;
  transition: border-color var(--t), background var(--t), box-shadow var(--t);
}
.prog-search:focus {
  outline: none; border-color: var(--purple); background: var(--surface);
  box-shadow: 0 0 0 3px rgba(124,58,237,.12);
}
.prog-search::placeholder { color: var(--text-faint); }

.prog-results {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: 8px;
  padding-inline-end: 2px;
}
.prog-empty {
  padding: 32px 0; text-align: center;
  font-size: .84rem; color: var(--text-faint);
}
.prog-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 16px; border-radius: var(--radius);
  border: 2px solid var(--border);
  background: var(--surface2); cursor: pointer; text-align: right;
  width: 100%; font: inherit; color: var(--text);
  transition: border-color var(--t), background var(--t), transform 140ms ease, box-shadow var(--t);
}
.prog-item:hover {
  border-color: var(--purple); background: var(--purple-soft);
  transform: translateY(-2px); box-shadow: 0 4px 14px rgba(124,58,237,.15);
}
.prog-item:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
.prog-item.kb-focus { border-color: var(--blue); background: var(--blue-soft); transform: translateY(-1px); }
.prog-item.loading  { opacity: .5; pointer-events: none; cursor: wait; }
[data-theme="dark"] .prog-item:hover { background: var(--purple-soft); }
[data-theme="dark"] .prog-item.kb-focus { background: var(--blue-soft); }

.prog-icon     { font-size: 1.5rem; flex-shrink: 0; margin-top: 3px; line-height: 1; }
.prog-info     { flex: 1; min-width: 0; text-align: right; }
.prog-name     { font-size: .95rem; font-weight: 700; line-height: 1.35; margin-bottom: 2px; }
.prog-spec     { font-size: .78rem; color: var(--blue); font-weight: 600; margin-bottom: 4px; }
.prog-desc     { font-size: .72rem; color: var(--text-muted); margin-bottom: 5px; line-height: 1.4; }
.prog-year-tag {
  display: inline-flex; align-items: center;
  font-size: .64rem; padding: 1px 7px; border-radius: 999px;
  background: var(--bg2); border: 1px solid var(--border2); color: var(--text-faint);
}

.prog-modal-error {
  margin-top: 12px; padding: 10px 14px; border-radius: 8px; flex-shrink: 0;
  background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B;
  font-size: .78rem; line-height: 1.5; direction: rtl;
}
[data-theme="dark"] .prog-modal-error { background: #7F1D1D; border-color: #991B1B; color: #FCA5A5; }

.prog-clear-wrap {
  margin-top: 14px; padding-top: 13px;
  border-top: 1px solid var(--border);
  text-align: center; flex-shrink: 0;
}
.prog-clear-btn {
  font-size: .72rem; color: var(--text-faint);
  background: none; border: none; cursor: pointer;
  padding: 4px 8px; border-radius: 6px;
  transition: color var(--t), background var(--t);
}
.prog-clear-btn:hover { color: var(--danger); background: var(--bg2); }

/* ── Course details modal ───────────────────────────────────────────────── */
.detail-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,.42);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
  animation: fadeIn 200ms ease;
  padding: 20px;
}
.detail-overlay.hiding { animation: fadeOut 180ms ease forwards; }

.detail-panel {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  max-width: 480px; width: 100%;
  max-height: 86vh;
  display: flex; flex-direction: column;
  animation: slideIn 220ms ease;
  direction: rtl;
  overflow: hidden;
}

.detail-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.detail-head-row {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 8px; margin-bottom: 6px;
}
.detail-cid {
  font-family: ui-monospace, "Cascadia Code", monospace;
  font-size: .68rem; color: var(--text-muted); letter-spacing: .04em;
  direction: ltr; unicode-bidi: isolate; margin-top: 3px;
}
.detail-close {
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text-muted); cursor: pointer; font-size: .82rem;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--t), color var(--t), border-color var(--t);
}
.detail-close:hover { background: var(--bg2); color: var(--danger); border-color: var(--danger); }
.detail-name {
  font-size: 1.05rem; font-weight: 700; line-height: 1.35;
  margin-bottom: 9px; word-break: break-word;
}
.detail-name.unnamed { color: var(--text-muted); font-style: italic; font-weight: 400; }
.detail-badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }

.detail-body { flex: 1; overflow-y: auto; padding: 16px 20px; }

.detail-section { margin-bottom: 14px; }
.detail-section:last-child { margin-bottom: 0; }
.detail-section-title {
  font-size: .61rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: var(--text-faint);
  margin-bottom: 6px;
}
.detail-row {
  font-size: .76rem; color: var(--text-muted);
  line-height: 1.5; margin-bottom: 3px;
  display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;
}
.detail-lbl { color: var(--text-faint); font-size: .7rem; flex-shrink: 0; }
.detail-val  { color: var(--text); }
.detail-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.detail-chip {
  font-family: ui-monospace, monospace; font-size: .64rem;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 5px; padding: 2px 6px; color: var(--text-muted);
  direction: ltr; unicode-bidi: isolate;
}
.detail-chip.missing { border-color: var(--danger); color: var(--danger); }
.detail-chip { direction: rtl; unicode-bidi: normal; font-family: system-ui, sans-serif; }
.prereq-id { font-family: ui-monospace, monospace; font-size: .6rem; color: var(--text-faint); direction: ltr; unicode-bidi: isolate; display: inline-block; }
.prereq-no-name { color: var(--text-muted); }
.detail-warn {
  font-size: .74rem; color: var(--miss-accent);
  background: var(--miss-bg); border-radius: 7px;
  padding: 7px 10px; margin-top: 3px; line-height: 1.45;
}
.detail-none { font-size: .74rem; color: var(--text-faint); font-style: italic; }

/* Difficulty breakdown bars */
.diff-brow {
  display: grid;
  grid-template-columns: 7rem 1fr 2.4rem;
  align-items: center; gap: 7px;
  margin-bottom: 6px;
  font-size: .73rem; color: var(--text-muted);
}
.diff-blbl { text-align: end; color: var(--text-faint); font-size: .68rem; }
.diff-btrack {
  height: 6px; border-radius: 3px;
  background: var(--border); overflow: hidden;
}
.diff-bfill { height: 100%; border-radius: 3px; transition: width .3s ease; }
.diff-bval { font-size: .68rem; color: var(--text-muted); direction: ltr; text-align: start; }
.diff-conf { font-size: .68rem; color: var(--text-faint); margin-top: 8px; }

/* ── Instructor uncertainty section ─────────────────────────────────────── */
.iu-score-row {
  display: grid;
  grid-template-columns: 1fr 2.4rem;
  align-items: center; gap: 7px; margin-bottom: 8px;
}
.iu-track {
  height: 6px; border-radius: 3px;
  background: var(--border); overflow: hidden;
}
.iu-fill { height: 100%; border-radius: 3px; transition: width .3s ease; }
.iu-val  { font-size: .68rem; color: var(--text-muted); direction: ltr; text-align: start; }
.iu-lecturers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.iu-lecturer-tag {
  font-size: .68rem; padding: 2px 7px; border-radius: 99px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted);
}
.iu-user-note {
  font-size: .72rem; color: var(--text-muted); background: var(--warn-soft);
  border: 1px solid var(--warning); border-radius: 7px;
  padding: 6px 10px; margin-top: 6px; line-height: 1.45;
}
[data-theme="dark"] .iu-user-note { background: #451A03; border-color: #92400E; color: var(--warning); }

/* ── Override panel ─────────────────────────────────────────────────────── */
.override-panel {
  border-top: 1px solid var(--border);
  padding: 12px 0 4px; margin-top: 8px;
}
.override-panel-hdr {
  font-size: .74rem; font-weight: 600; color: var(--text-muted);
  margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
}
.override-badge {
  display: inline-block; font-size: .6rem; font-weight: 600;
  background: var(--warn-soft); color: #92400E;
  border: 1px solid var(--warning); border-radius: 99px;
  padding: 1px 8px; white-space: nowrap;
}
[data-theme="dark"] .override-badge { background: #451A03; color: var(--warning); border-color: #92400E; }
.override-field { margin-bottom: 8px; }
.override-label { display: block; font-size: .68rem; color: var(--text-faint); margin-bottom: 3px; }
.override-input {
  width: 100%; font-size: .74rem;
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 8px; background: var(--surface); color: var(--text);
  font-family: inherit; resize: vertical; direction: rtl;
  transition: border-color var(--t);
}
.override-input:focus { outline: none; border-color: var(--warning); box-shadow: 0 0 0 2px rgba(245,158,11,.18); }
.override-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* ── Detail modal tabs ──────────────────────────────────────────────────── */
.detail-tabs {
  display: flex; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.detail-tab {
  flex: 1; padding: 9px 14px;
  font-size: .75rem; font-weight: 600; text-align: center;
  color: var(--text-muted); cursor: pointer;
  border: none; border-bottom: 2px solid transparent;
  background: none; outline: none; font-family: inherit;
  transition: color var(--t), border-color var(--t), background var(--t);
  white-space: nowrap;
}
.detail-tab:hover { color: var(--text); background: var(--surface2); }
.detail-tab.active { color: var(--purple); border-bottom-color: var(--purple); }

/* Override detail-body when tabs are present */
.detail-body.tabbed { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.detail-tab-panel { display: none; flex: 1; overflow-y: auto; padding: 16px 20px; min-height: 0; }
.detail-tab-panel.active { display: flex; flex-direction: column; }

/* ── AI chat panel ──────────────────────────────────────────────────────── */
.ai-chat-wrap { display: flex; flex-direction: column; gap: 14px; }
.ai-suggested-label {
  font-size: .63rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: 5px;
}
.ai-suggested-prompts { display: flex; flex-direction: column; gap: 5px; }
.ai-prompt-btn {
  font-size: .72rem; text-align: start; padding: 7px 10px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted);
  cursor: pointer; font-family: inherit; line-height: 1.4;
  transition: background var(--t), border-color var(--t), color var(--t);
}
.ai-prompt-btn:hover { background: var(--purple-soft); border-color: var(--purple); color: var(--purple); }
.ai-input-area { display: flex; flex-direction: column; gap: 6px; }
.ai-textarea-chat {
  width: 100%; font-size: .77rem; font-family: inherit; direction: rtl;
  border: 1px solid var(--border2); border-radius: 8px;
  padding: 8px 10px; background: var(--surface); color: var(--text);
  resize: vertical; min-height: 64px;
  transition: border-color var(--t);
}
.ai-textarea-chat:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 2px rgba(124,58,237,.15); }
.ai-send-row { display: flex; justify-content: flex-end; }
.ai-send-btn {
  font-size: .74rem; font-weight: 600; padding: 6px 18px; border-radius: 7px;
  background: var(--purple); color: #fff; border: none; cursor: pointer; font-family: inherit;
  transition: opacity var(--t);
}
.ai-send-btn:hover { opacity: .88; }
.ai-send-btn:disabled { opacity: .4; cursor: not-allowed; }
.ai-response-area {
  min-height: 72px; border-radius: 8px; border: 1px dashed var(--border2);
  padding: 10px 12px; font-size: .76rem; color: var(--text-muted); line-height: 1.65;
  background: var(--surface2); white-space: pre-wrap;
}
.ai-response-area.ai-empty::before { content: 'תשובת ה-AI תופיע כאן…'; color: var(--text-faint); font-style: italic; }
.ai-response-area.ai-loading { font-style: italic; color: var(--text-faint); }
.ai-no-api-note {
  font-size: .7rem; color: var(--text-faint); line-height: 1.5;
  background: var(--surface2); border-radius: 7px; padding: 7px 10px;
  border: 1px solid var(--border);
}
.ai-mock-banner {
  font-size: .68rem; line-height: 1.5;
  background: var(--warn-soft); color: #92400E;
  border: 1px solid var(--warning); border-radius: 7px;
  padding: 7px 10px; margin-bottom: 8px; direction: rtl;
}
[data-theme="dark"] .ai-mock-banner { background: #451A03; color: var(--warning); border-color: #92400E; }
.ai-context-note { font-size: .66rem; color: var(--text-faint); line-height: 1.5; }

.detail-foot {
  padding: 13px 20px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; gap: 8px; align-items: center;
}
.detail-syl-note { font-size: .67rem; color: var(--text-faint); }

/* Primary action button */
.btn-primary {
  background: var(--purple); color: #fff !important;
  border-color: transparent;
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 5px;
}
.btn-primary:hover { opacity: .88; background: var(--purple); }
.btn:disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }

/* ── Header ─────────────────────────────────────────────────────────────── */
.page-hdr {
  height: var(--hdr-h); flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex; align-items: center; gap: 10px;
  z-index: 30; transition: background var(--t);
}
.hdr-brand { display: flex; flex-direction: column; flex-shrink: 0; line-height: 1.2; }
.hdr-title { font-size: .92rem; font-weight: 800; }
.hdr-prog  { font-size: .68rem; color: var(--text-muted); }
.hdr-chips { display: flex; gap: 5px; flex: 1; overflow: hidden; }
.hdr-actions { display: flex; gap: 6px; flex-shrink: 0; }

.chip {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: .67rem; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border2); background: var(--surface2);
  white-space: nowrap; flex-shrink: 0; transition: background var(--t);
}
.chip .cl { color: var(--text-muted); }
.chip .cv { font-weight: 700; }
.chip.warn { background: var(--warn-soft); border-color: var(--warning); color: #92400E; }
[data-theme="dark"] .chip.warn { color: var(--warning); }

.btn {
  font-size: .72rem; font-weight: 600;
  padding: 5px 12px; border-radius: 7px;
  border: 1px solid var(--border2); background: var(--surface2);
  color: var(--text); cursor: pointer;
  transition: background var(--t), border-color var(--t), opacity var(--t);
}
.btn:hover { background: var(--bg2); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--bg2); }

/* ── Workspace ──────────────────────────────────────────────────────────── */
#app {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.workspace { flex:1; min-height:0; display:flex; overflow:hidden; }

/* ── Sidebar (right in RTL) ─────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  height: calc(100vh - var(--hdr-h));
  max-height: calc(100vh - var(--hdr-h));
  background: var(--surface);
  border-inline-start: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: background var(--t), filter 250ms ease;
}
.sb-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.sb-head-title { font-size: .85rem; font-weight: 700; }
.sb-head-sub   { font-size: .68rem; color: var(--text-muted); margin-top: 2px; }
.btn-auto-plan {
  margin-top: 8px; width: 100%;
  font-size: .72rem; font-weight: 600;
  padding: 6px 10px; border-radius: 7px;
  border: 1.5px solid var(--border2); background: var(--surface2);
  color: var(--text-faint); cursor: not-allowed;
  opacity: .7;
}
.btn-auto-plan:disabled { pointer-events: auto; }
.sb-body { flex:1; overflow-y: auto; padding: 8px; min-height: 0; overscroll-behavior: contain; }

/* Repo group accordion */
.repo-group { margin-bottom: 6px; }
.repo-group > summary {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: 7px;
  font-size: .65rem; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-faint);
  cursor: pointer; user-select: none; list-style: none;
  transition: background var(--t);
}
.repo-group > summary:hover { background: var(--bg2); }
.repo-group > summary::marker,
.repo-group > summary::-webkit-details-marker { display: none; }
.repo-group-chevron { font-size: .7rem; margin-inline-start: auto; transition: transform var(--t); }
.repo-group[open] .repo-group-chevron { transform: rotate(180deg); }
.repo-group-count {
  background: var(--bg2); border-radius: 999px;
  font-size: .6rem; padding: 1px 6px;
  color: var(--text-muted); font-weight: 600;
}
.repo-zone {
  padding: 4px 2px; display: flex; flex-direction: column; gap: 5px;
  min-height: 28px; border-radius: 7px; transition: background var(--t);
}
.repo-zone.drag-over {
  background: rgba(37,99,235,.07);
  outline: 2px dashed var(--blue); outline-offset: 1px;
}
.repo-zone:empty::after {
  content: 'אין קורסים'; display: block; padding: 10px 8px;
  font-size: .7rem; color: var(--text-faint); font-style: italic;
}
.repo-empty-msg {
  padding: 8px 8px; font-size: .7rem; color: var(--text-faint);
  font-style: italic; text-align: center;
}

/* Blocked drag toggle */
.blk-toggle {
  margin: 8px 6px 4px;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 10px; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: .7rem; color: var(--text-muted); cursor: pointer;
  transition: background var(--t), border-color var(--t);
}
.blk-toggle:hover { background: var(--bg2); }
.blk-toggle.active { border-color: var(--warning); background: var(--warn-soft); color: #92400E; }
[data-theme="dark"] .blk-toggle.active { color: var(--warning); }
.blk-toggle-icon { font-size: .85rem; }

/* ── AI panel ────────────────────────────────────────────────────────────── */
.ai-panel { border-top: 1px solid var(--border); }
.ai-panel > summary {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: pointer;
  font-size: .78rem; font-weight: 600;
  user-select: none; list-style: none; transition: background var(--t);
}
.ai-panel > summary:hover { background: var(--bg2); }
.ai-panel > summary::marker,
.ai-panel > summary::-webkit-details-marker { display: none; }
.ai-chevron { margin-inline-start: auto; font-size: .75rem; transition: transform var(--t); }
.ai-panel[open] .ai-chevron { transform: rotate(180deg); }
.ai-body { padding: 10px 14px 14px; border-top: 1px solid var(--border); max-height: 260px; overflow-y: auto; }
/* AI responses must be grounded in local DB/JSON data only. Never hallucinate. */
.ai-note {
  font-size: .65rem; color: var(--text-faint); margin-bottom: 8px;
  background: var(--surface2); border-radius: 6px; padding: 6px 8px;
}
.ai-textarea {
  width: 100%; resize: none; border: 1px solid var(--border2);
  border-radius: 7px; padding: 8px 10px;
  font-size: .75rem; line-height: 1.5;
  background: var(--surface); color: var(--text); font-family: inherit;
  transition: border-color var(--t);
}
.ai-textarea:focus { outline: none; border-color: var(--purple); }
.ai-send {
  margin-top: 7px; width: 100%; padding: 7px 14px; border-radius: 7px;
  background: var(--purple); color: #fff;
  border: none; font-size: .75rem; font-weight: 600; cursor: pointer;
  transition: opacity var(--t);
}
.ai-send:hover { opacity: .88; }
.ai-response {
  margin-top: 8px; font-size: .72rem; color: var(--text-muted);
  background: var(--surface2); border-radius: 7px; padding: 9px 10px; line-height: 1.5;
}

/* ── Program requirements progress panel ────────────────────────────────── */
.prog-requirements {
  padding: 10px 14px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.prog-req-title {
  font-size: .66rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-faint); margin-bottom: 8px;
}
.prog-hours-bar { margin-bottom: 8px; }
.prog-hours-track { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; margin-bottom: 3px; }
.prog-hours-fill  { height: 100%; border-radius: 3px; transition: width .3s ease; }
.prog-hours-labels {
  display: flex; justify-content: space-between; font-size: .63rem; color: var(--text-faint);
}
.prog-cat-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: .68rem; padding: 3px 0;
  color: var(--text-muted);
}
.prog-cat-row.ok  { color: var(--success); }
.prog-cat-row.warn { color: var(--warning); }
.prog-cat-count { font-size: .63rem; font-weight: 600; opacity: .85; }
.prog-req-note { font-size: .62rem; color: var(--text-faint); margin-top: 5px; font-style: italic; }

/* ── Legend (compact) ────────────────────────────────────────────────────── */
.sb-legend { padding: 8px 14px 10px; border-top: 1px solid var(--border); }
.legend-ttl {
  font-size: .61rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-faint); margin-bottom: 5px;
}
.legend-compact { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 5px; }
.legend-ci { display: flex; align-items: center; gap: 4px; font-size: .65rem; color: var(--text-muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.legend-workload-details { margin-top: 2px; }
.legend-workload-details > summary {
  display: flex; align-items: center; gap: 10px;
  font-size: .63rem; color: var(--text-faint); cursor: pointer;
  list-style: none; padding: 2px 0;
}
.legend-workload-details > summary::marker,
.legend-workload-details > summary::-webkit-details-marker { display: none; }
.legend-workload-more { margin-inline-start: auto; font-size: .6rem; }
.legend-workload-body { padding: 4px 0 0; font-size: .62rem; color: var(--text-faint); line-height: 1.7; }

/* ── My Courses modal ────────────────────────────────────────────────────── */
.my-course-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface2);
  margin-bottom: 5px; transition: background var(--t), border-color var(--t);
}
.my-course-row.my-course-completed { border-color: var(--success); background: rgba(16,185,129,.05); }
.my-course-row.my-course-current   { border-color: var(--blue);    background: rgba(37,99,235,.05); }
.my-course-info { flex: 1; min-width: 0; }
.my-course-id   { font-family: ui-monospace, monospace; font-size: .63rem; color: var(--text-faint); direction: ltr; display: block; }
.my-course-name { font-size: .78rem; font-weight: 500; word-break: break-word; }
.my-course-actions { display: flex; gap: 5px; flex-shrink: 0; }
.my-course-btn {
  font-size: .67rem; padding: 3px 8px; border-radius: 6px;
  border: 1px solid var(--border2); background: var(--surface);
  color: var(--text-muted); cursor: pointer; font-family: inherit;
  transition: background var(--t), border-color var(--t), color var(--t);
  white-space: nowrap;
}
.my-course-btn:hover { background: var(--bg2); }
.my-course-btn.active.status-completed { background: rgba(16,185,129,.15); border-color: var(--success); color: var(--success); }
.my-course-btn.active.status-current   { background: rgba(37,99,235,.15); border-color: var(--blue);    color: var(--blue); }
.my-courses-summary {
  display: flex; gap: 12px; font-size: .7rem; color: var(--text-muted);
  padding: 6px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.my-courses-summary span { display: flex; align-items: center; gap: 4px; }

/* ── Board area ──────────────────────────────────────────────────────────── */
.board-area { flex: 1; overflow: auto; padding: 14px; transition: filter 250ms ease; }
.board-grid {
  display: flex; flex-wrap: wrap; direction: rtl; /* earliest semester on far right */
  gap: 16px; align-items: start; min-width: 860px;
}

/* Year groups */
.year-group { display: flex; flex-direction: column; gap: 8px; flex: 1 1 0; min-width: 420px; }
.year-hdr {
  font-size: .78rem; font-weight: 700; color: var(--text-muted);
  text-align: center; padding: 5px 10px; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  letter-spacing: .03em;
}
.year-sems { display: flex; direction: rtl; gap: 12px; align-items: start; }

/* ── Semester column ────────────────────────────────────────────────────── */
.semester-col { display: flex; flex-direction: column; gap: 8px; flex: 1 1 0; min-width: 180px; }
.sem-hdr { color:#fff; border-radius: var(--radius); padding: 12px 14px 11px; }
.col-y3a .sem-hdr { background: var(--y3a); }
.col-y3b .sem-hdr { background: var(--y3b); }
.col-y4a .sem-hdr { background: var(--y4a); }
.col-y4b .sem-hdr { background: var(--y4b); }
.sem-title { font-size: .87rem; font-weight: 700; margin-bottom: 5px; direction: rtl; }
.sem-stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: .68rem; opacity: .9; direction: rtl; }
.sem-stats span { white-space: nowrap; }
.wl-wrap { margin-top: 8px; }
.wl-row  { display: flex; justify-content: space-between; font-size: .63rem; opacity: .85; margin-bottom: 3px; }
.wl-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
.wl-fill  { height: 100%; border-radius: 999px; background: rgba(255,255,255,.85); transition: width var(--t); }
.wl-fill.med  { background: #FCD34D; }
.wl-fill.over { background: #F87171; }
.wl-note  { font-size: .62rem; opacity: .75; margin-top: 3px; direction: rtl; }

/* Semester drop zone */
.sem-zone {
  display: flex; flex-direction: column; gap: 7px;
  min-height: 72px; border-radius: var(--radius); padding: 4px 2px;
  border: 1px solid transparent;
  transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  direction: rtl;
}
.sem-zone.drag-over {
  background: rgba(37,99,235,.06);
  border: 1.5px dashed var(--blue);
  box-shadow: inset 0 0 0 1px rgba(37,99,235,.1);
}
/* Drag-validation highlight classes */
.sem-zone.drag-valid {
  background: rgba(16,185,129,.06);
  border: 1.5px dashed var(--success);
  box-shadow: inset 0 0 0 1px rgba(16,185,129,.1);
}
.sem-zone.drag-invalid {
  background: rgba(239,68,68,.06);
  border: 1.5px dashed var(--danger);
}
.sem-zone.drag-invalid::before {
  content: attr(data-drag-err);
  display: block; padding: 5px 8px; border-radius: 6px;
  font-size: .67rem; color: var(--danger);
  background: rgba(239,68,68,.08); margin-bottom: 4px;
  text-align: center; line-height: 1.4;
  white-space: pre-wrap;
}
.sem-zone:empty::after {
  content: 'גרור קורס לכאן';
  display: flex; align-items: center; justify-content: center;
  min-height: 60px; font-size: .72rem; color: var(--text-faint);
  border: 1px dashed var(--border2); border-radius: 7px;
  transition: border-color 160ms ease, color 160ms ease;
}
.sem-zone.drag-over:empty::after { border-color: var(--blue);    color: var(--blue);    }
.sem-zone.drag-valid:empty::after  { border-color: var(--success); color: var(--success); }
.sem-zone.drag-invalid:empty::after { border-color: var(--danger);  color: var(--danger);  }

/* Board notification toast */
#board-notify {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1F2937; color: #FCA5A5; padding: 9px 20px; border-radius: 9px;
  font-size: .78rem; font-weight: 600; z-index: 300;
  box-shadow: var(--shadow-md); pointer-events: none;
  animation: fadeIn 150ms ease;
}

/* Invalid-placement override toggle */
.invalid-toggle {
  margin: 4px 6px 4px;
  display: flex; align-items: center; gap: 7px;
  padding: 7px 10px; border-radius: 7px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: .7rem; color: var(--text-muted); cursor: pointer;
  transition: background var(--t), border-color var(--t);
}
.invalid-toggle:hover { background: var(--bg2); }
.invalid-toggle.active { border-color: var(--danger); background: rgba(239,68,68,.08); color: var(--danger); }

/* Validation badge on course cards */
.bdg-prereq-warn {
  background: rgba(239,68,68,.12); color: var(--danger);
  border: 1px solid rgba(239,68,68,.3);
}

/* Validation section in modal */
.val-prereq-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }

/* ── Course cards ───────────────────────────────────────────────────────── */
.course-card {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border-inline-start: 4px solid var(--border);
  cursor: pointer;
  user-select: none;
  overflow: hidden;
  transition:
    box-shadow 200ms ease,
    transform  200ms ease,
    opacity    200ms ease,
    background var(--t),
    border-inline-start-color var(--t),
    border-inline-start-width var(--t);
}

/* Draggable (elective) cards — full lift on hover */
.course-card[draggable="true"]:not(.card-locked):hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.07), 0 0 0 1.5px var(--border2);
  z-index: 2;
}
/* Non-draggable cards — gentler lift */
.course-card[draggable="false"]:not(.card-locked):hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,0,0,.10);
}
/* Locked cards — restrained, shows cursor hint */
.card-locked { cursor: default; }
.card-locked:hover {
  transform: none;
  box-shadow: var(--shadow);
}
/* Dragging state */
.course-card.dragging {
  opacity: .3;
  transform: scale(.96) rotate(.5deg);
  cursor: grabbing;
  z-index: 50;
  box-shadow: none;
}

/* Card type styles */
.card-mandatory {
  border-inline-start-color: var(--mand-accent);
  background: var(--mand-bg);
  border-inline-start-width: 5px;
}
.card-locked {
  border-inline-start-color: var(--mand-accent);
  background: var(--mand-lock-bg);
  border-inline-start-width: 5px;
}
.card-elective  { border-inline-start-color: var(--elec-accent); background: var(--elec-bg); }
.card-blocked   { border-inline-start-color: var(--blk-accent); background: var(--blk-bg); opacity: .76; }
.card-missing   { border-inline-start-color: var(--miss-accent); background: var(--miss-bg); }

/* Placed cards get difficulty color on border */
.card-placed.diff-easy      { border-inline-start-color: var(--easy-border); }
.card-placed.diff-medium    { border-inline-start-color: var(--med-border); }
.card-placed.diff-hard      { border-inline-start-color: var(--hard-border); }
.card-placed.diff-very_hard { border-inline-start-color: var(--vhard-border); }

/* Card body */
.card-main { padding: 9px 11px 8px; }
.card-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 4px; margin-bottom: 4px;
}
.cid {
  font-family: ui-monospace, "Cascadia Code", monospace;
  font-size: .66rem; color: var(--text-muted); letter-spacing: .02em;
  direction: ltr; unicode-bidi: isolate;
}
.cname {
  font-size: .83rem; font-weight: 600; line-height: 1.3;
  word-break: break-word; margin-bottom: 5px;
}
.cname.unnamed { color: var(--text-muted); font-style: italic; font-weight: 400; }
.card-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.warn-icon { font-size: .75rem; margin-inline-start: auto; cursor: help; }

/* Drag hint strip — visible on hover for draggable cards */
.card-drag-hint {
  font-size: .6rem; color: var(--text-faint);
  text-align: center; letter-spacing: .04em;
  padding: 3px 0 4px;
  border-top: 1px solid var(--border);
  opacity: 0;
  transition: opacity 160ms ease;
  cursor: grab;
}
.course-card[draggable="true"]:not(.card-locked):hover .card-drag-hint { opacity: 1; }

/* ── Badges ──────────────────────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: .61rem; font-weight: 600;
  padding: 1px 6px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.bdg-mandatory      { background: var(--blue-soft);   color: #1E40AF; border-color: #93C5FD; }
.bdg-mandatory-flex { background: #ECFDF5;            color: #065F46; border-color: #6EE7B7; }
.bdg-elective       { background: var(--purple-soft); color: #5B21B6; border-color: #C4B5FD; }
.bdg-blocked        { background: #F3F4F6;            color: #6B7280; border-color: #D1D5DB; }
.bdg-missing        { background: var(--warn-soft);   color: #92400E; border-color: var(--warning); }
.bdg-partial        { background: #FFFBEB;            color: #92400E; border-color: #FCD34D; }
.bdg-not-offered    { background: #F1F5F9;            color: #64748B; border-color: #CBD5E1; }
[data-theme="dark"] .bdg-mandatory      { background: #1E3A5F; color: #93C5FD; border-color: #2563EB; }
[data-theme="dark"] .bdg-mandatory-flex { background: #064E3B; color: #6EE7B7; border-color: #065F46; }
[data-theme="dark"] .bdg-elective       { background: #2E1065; color: #C4B5FD; border-color: #7C3AED; }
[data-theme="dark"] .bdg-blocked        { background: #1E293B; color: #94A3B8; border-color: #334155; }
[data-theme="dark"] .bdg-missing        { background: #451A03; color: var(--warning); border-color: #92400E; }
[data-theme="dark"] .bdg-partial        { background: #451A03; color: #FCD34D; border-color: #92400E; }
[data-theme="dark"] .bdg-not-offered    { background: #1E293B; color: #94A3B8; border-color: #334155; }

.bdg-easy      { background: var(--easy-bg);  color: var(--easy-text);  border-color: var(--easy-border); }
.bdg-medium    { background: var(--med-bg);   color: var(--med-text);   border-color: var(--med-border); }
.bdg-hard      { background: var(--hard-bg);  color: var(--hard-text);  border-color: var(--hard-border); }
.bdg-very_hard { background: var(--vhard-bg); color: var(--vhard-text); border-color: var(--vhard-border); }

/* ── Category card & badge styles (2027 program) ────────────────────────── */
.card-cat-fluids  { border-inline-start-color: var(--cat-fluids-accent)  !important; }
.card-cat-solids  { border-inline-start-color: var(--cat-solids-accent)  !important; }
.card-cat-systems { border-inline-start-color: var(--cat-systems-accent) !important; }
.card-cat-labs    { border-inline-start-color: var(--cat-labs-accent)    !important; }
.card-cat-other   { border-inline-start-color: var(--cat-other-accent)   !important; }

<script>
'use strict';

/* ── Programs registry ──────────────────────────────────────────────────────
 * Add entries here when more programs are supported.
 * board_json / audit_json: paths relative to this HTML file.
 */
const PROGRAM_LIST = [

  {

    program_name_he:        'הנדסה מכנית',
    specialization_name_he: null,
    year:                   2025,
    description_he:         'תכנון קורסי חובה ובחירה בהנדסה מכנית',
    icon:                   '⚙️',
    board_json:             '../../data/parsed_json/mechanical_semester_board.json',
    audit_json:             '../../data/parsed_json/mechanical_electives_profile_audit.json',
    program_json:           null,
  },
  {
    program_id:             'mechanical_engineering_biomedical_track_2025',
    program_name_he:        'הנדסה מכנית',
    specialization_name_he: 'מגמה בהנדסה ביו-רפואית',
    year:                   2025,
    description_he:         'תכנון קורסים להנדסה מכנית עם דגש ביו-רפואי',
    icon:                   '🔬',
    board_json:             '../../data/parsed_json/mechanical_semester_board.json',
    audit_json:             '../../data/parsed_json/mechanical_electives_profile_audit.json',
    program_json:           null,
  },
];
const PROGRAMS = Object.fromEntries(PROGRAM_LIST.map(p => [p.program_id, p]));

/* ── Label maps ─────────────────────────────────────────────────────────── */
const SEM_HE = {
  year_3_semester_a: "שנה ג׳ — סמסטר א׳",
  year_3_semester_b: "שנה ג׳ — סמסטר ב׳",
  year_4_semester_a: "שנה ד׳ — סמסטר א׳",
  year_4_semester_b: "שנה ד׳ — סמסטר ב׳",
};
const DIFF_HE  = { easy:'קל', medium:'בינוני', hard:'קשה', very_hard:'קשה מאוד' };
const TYPE_HE  = { mandatory:'חובה', elective:'בחירה' };
const STAT_HE  = { blocked:'חסום', missing_from_db:'חסר' };
const CONF_HE  = { high:'גבוה', medium:'בינוני', low:'נמוך' };

/* Category styling map — keyed by program_category_id */
const CAT_CSS = {
  fluids:               { card: 'card-cat-fluids',  bdg: 'bdg-cat-fluids',  label: 'זורמים' },
  solids:               { card: 'card-cat-solids',  bdg: 'bdg-cat-solids',  label: 'מוצקים' },
  systems:              { card: 'card-cat-systems', bdg: 'bdg-cat-systems', label: 'מערכות' },
  advanced_labs:        { card: 'card-cat-labs',    bdg: 'bdg-cat-labs',    label: 'מעבדה' },
};

const REPO_GROUPS = {
  mandatory:       { name_he: 'קורסי חובה',          open: true  },
  elective_avail:  { name_he: 'קורסי בחירה זמינים',  open: true  },
  elective_blocked:{ name_he: 'קורסי בחירה חסומים',  open: false },
  missing:         { name_he: 'חסר מידע',             open: false },
};

const SEMESTERS = [
  { id:'year_3_semester_a', css:'col-y3a' },
  { id:'year_3_semester_b', css:'col-y3b' },
  { id:'year_4_semester_a', css:'col-y4a' },
  { id:'year_4_semester_b', css:'col-y4b' },
];

const MAX_HOURS    = 20;
const LS_STATE_PREFIX = 'tau_board_v3';   // appended with _${program_id}
const LS_THEME     = 'tau_theme';
const LS_PROG      = 'tau_program';
const LS_OVERRIDES = 'tau_course_overrides';
const LS_MY_COURSES = 'tau_my_courses';

/* ── App state ──────────────────────────────────────────────────────────── */
let courseMap     = {};
let state         = null; // { semesters:{}, repo:[], unlockedIds:[] }
let originalState = null;
let selectedProg  = null;

/* UI-only state */
let dragId              = null;
let dragFromSem         = null;
let allowBlockedDrag    = false;
let allowInvalidPlacement = false;   // override toggle: allow invalid drops with warning
let boardValidation     = {};        // {courseId: validatePlacement result}; refreshed on render
let completedCourseIds  = [];        // authoritative: board meta + user-marked completed
let _boardCompletedIds  = [];        // from board.metadata.completed_course_ids
let myCoursesState      = { completed: [], current: [] }; // user-marked; persisted to localStorage
let programRequirements = null;      // {total_required_hours, categories:[]} from board metadata
let _notifyTimer        = null;
const openGroups     = new Set(['mandatory', 'elective_avail', '_mandatory']);

/* ── Bootstrap ──────────────────────────────────────────────────────────── */
async function main() {
  applyTheme();
  loadMyCoursesState();
  setupDragDelegation();
  setupCardClick();
  setupDetailOverlay();
  setupGlobalKeys();

  document.getElementById('btn-dark').addEventListener('click', toggleTheme);
  document.getElementById('btn-reset').addEventListener('click', resetBoard);
  document.getElementById('btn-change-prog').addEventListener('click', () => showModal());
  document.getElementById('btn-my-courses').addEventListener('click', openMyCoursesModal);
  /* btn-auto-plan is disabled — no click handler until AI is connected */

  buildProgModal();

  const savedId = localStorage.getItem(LS_PROG);
  if (savedId && PROGRAMS[savedId]) {
    console.log('[main] Restoring saved program:', savedId);
    await loadProgram(savedId, false);
  } else {
    showModal();
  }
}

/* ── Program modal ──────────────────────────────────────────────────────── */
function buildProgModal() {
  const searchEl  = document.getElementById('prog-search');
  const resultsEl = document.getElementById('prog-results');
  const closeBtn  = document.getElementById('prog-close-btn');
  const clearBtn  = document.getElementById('prog-clear-btn');
  let kbIdx = -1;

  function renderResults(query) {
    const q = (query || '').trim().toLowerCase();
    const filtered = q
      ? PROGRAM_LIST.filter(p =>
          [p.program_name_he, p.specialization_name_he, p.description_he]
            .some(f => f && f.toLowerCase().includes(q))
        )
      : PROGRAM_LIST;
    kbIdx = -1;
    if (!filtered.length) {
      resultsEl.innerHTML = '<div class="prog-empty">לא נמצאו תארים מתאימים</div>';
      return;
    }
    resultsEl.innerHTML = filtered.map(p => `
      <button class="prog-item" data-prog-id="${esc(p.program_id)}" role="option" type="button">
        <span class="prog-icon" aria-hidden="true">${esc(p.icon || '📚')}</span>
        <div class="prog-info">
          <div class="prog-name">${esc(p.program_name_he)}</div>
          ${p.specialization_name_he
            ? `<div class="prog-spec">${esc(p.specialization_name_he)}</div>`
            : ''}
          <div class="prog-desc">${esc(p.description_he)}</div>
          <span class="prog-year-tag">${esc(p.year)}</span>
        </div>
      </button>`).join('');
  }

  function applyKbFocus() {
    const items = resultsEl.querySelectorAll('.prog-item');
    items.forEach((el, i) => el.classList.toggle('kb-focus', i === kbIdx));
    if (kbIdx >= 0) items[kbIdx]?.scrollIntoView({ block: 'nearest' });
  }

  renderResults('');

  searchEl.addEventListener('input', () => renderResults(searchEl.value));

  searchEl.addEventListener('keydown', e => {
    const items = resultsEl.querySelectorAll('.prog-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      kbIdx = Math.min(kbIdx + 1, items.length - 1);
      applyKbFocus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      kbIdx = Math.max(kbIdx - 1, 0);
      applyKbFocus();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const target = kbIdx >= 0 ? items[kbIdx] : items[0];
      target?.click();
    } else if (e.key === 'Escape' && selectedProg) {
      hideModal();
    }
  });

  resultsEl.addEventListener('click', async e => {
    const btn = e.target.closest('[data-prog-id]');
    if (!btn) return;
    await loadProgram(btn.dataset.progId, true);
  });

  closeBtn.addEventListener('click', () => { if (selectedProg) hideModal(); });

  clearBtn.addEventListener('click', () => {
    console.log('[prog] Clearing program selection');
    localStorage.removeItem(LS_PROG);
    if (selectedProg) localStorage.removeItem(_lsStateKey());
    selectedProg = null;
    courseMap = {}; state = null; originalState = null;
    document.getElementById('app').setAttribute('hidden', '');
    showModal();
  });
}

function showModal() {
  const modal    = document.getElementById('prog-modal');
  const closeBtn = document.getElementById('prog-close-btn');
  const clearWrp = document.getElementById('prog-clear-wrap');
  const errEl    = document.getElementById('prog-modal-error');
  const searchEl = document.getElementById('prog-search');

  closeBtn.hidden = !selectedProg;
  clearWrp.hidden = !selectedProg;
  errEl.hidden    = true;

  document.body.classList.add('prog-modal-open');
  modal.classList.remove('hiding');
  modal.removeAttribute('hidden');

  /* Reset search + re-render */
  searchEl.value = '';
  searchEl.dispatchEvent(new Event('input'));
  setTimeout(() => searchEl.focus(), 60);
}

function hideModal() {
  const modal = document.getElementById('prog-modal');
  modal.classList.add('hiding');
  setTimeout(() => {
    modal.setAttribute('hidden', '');
    modal.classList.remove('hiding');
    document.body.classList.remove('prog-modal-open');
  }, 220);
}

/* ── Load program ───────────────────────────────────────────────────────── */
/* fromModal=true: loading state inside modal; false: loading state in board */
async function loadProgram(progId, fromModal) {
  const prog = PROGRAMS[progId];
  if (!prog) {
    console.error('[loadProgram] Unknown program id:', progId);
    return;
  }
  console.log('[loadProgram] Loading:', progId, '| fromModal:', fromModal);

  const errEl     = document.getElementById('prog-modal-error');
  let modalItems  = [];

  errEl.hidden = true;

  if (fromModal) {
    modalItems = [...document.querySelectorAll('#prog-results .prog-item')];
    modalItems.forEach(el => el.classList.add('loading'));
  } else {
    /* Show app skeleton while fetching */
    document.getElementById('app').removeAttribute('hidden');
    document.getElementById('msg-load').removeAttribute('hidden');
    document.getElementById('board').setAttribute('hidden', '');
    document.getElementById('msg-err').setAttribute('hidden', '');
  }

  try {
    const [board, audit, programJson] = await Promise.all([
      fetchJSON(prog.board_json),
      fetchJSON(prog.audit_json).catch(err => {
        console.warn('[loadProgram] audit JSON unavailable:', err.message);
        return null;
      }),
      prog.program_json
        ? fetchJSON(prog.program_json).catch(err => {
            console.warn('[loadProgram] program JSON unavailable:', err.message);
            return null;
          })
        : Promise.resolve(null),
    ]);
    console.log('[loadProgram] OK — semesters:', board.semesters?.length ?? 0,
                '| programJson:', programJson ? 'loaded' : 'none');

    /* Commit */
    selectedProg = prog;
    localStorage.setItem(LS_PROG, progId);

    /* Update header */
    const nameStr = prog.specialization_name_he
      ? `${prog.program_name_he} · ${prog.specialization_name_he} · ${prog.year}`
      : `${prog.program_name_he} · ${prog.year}`;
    document.getElementById('hdr-prog-name').textContent = nameStr;

    init(board, audit, programJson);
    renderAll();

    document.getElementById('app').removeAttribute('hidden');
    document.getElementById('msg-load').setAttribute('hidden', '');
    document.getElementById('board').removeAttribute('hidden');
    document.getElementById('msg-err').setAttribute('hidden', '');

    hideModal(); /* no-op if already hidden */

  } catch (err) {
    console.error('[loadProgram] Failed:', err);

    localStorage.removeItem(LS_PROG);
    selectedProg = null;
    document.getElementById('app').setAttribute('hidden', '');
    modalItems.forEach(el => el.classList.remove('loading'));

    errEl.textContent = `שגיאה בטעינת הנתונים: ${err.message}`;
    errEl.hidden = false;

    /* If loading was triggered without modal (saved program), open modal with error */
    if (!fromModal) showModal();
  }
}

/* ── Data init ──────────────────────────────────────────────────────────── */
function init(board, audit, programJson) {
  courseMap = {};

  for (const sem of (board.semesters || [])) {
    for (const c of (sem.courses || [])) {
      courseMap[c.course_id] = normalizeCourse(c, c.locked_by_user ? 'locked' : 'eligible');
    }
  }

  /* When the board embeds program_repository_courses, the audit must only
   * enrich courses already in the program — it must not introduce unrelated
   * audit-only courses that do not belong to this program. */
  const hasProgramRepo = (board.metadata?.program_repository_courses?.length ?? 0) > 0;

  if (audit) {
    for (const ac of audit) {
      if (!courseMap[ac.course_id]) {
        if (hasProgramRepo) continue;   // skip audit-only courses; they are not in this program
        courseMap[ac.course_id] = {
          course_id:                   ac.course_id,
          name_he:                     ac.name_he    || null,
          weekly_hours:                ac.weekly_hours,
          difficulty_score:            ac.difficulty_score,
          difficulty_level:            ac.difficulty_level || null,
          workload_score:              ac.workload_score              ?? null,
          conceptual_complexity_score: ac.conceptual_complexity_score ?? null,
          prerequisite_depth_score:    ac.prerequisite_depth_score    ?? null,
          assessment_intensity_score:  ac.assessment_intensity_score  ?? null,
          difficulty_confidence:       ac.difficulty_confidence        ?? null,
          difficulty_warnings:         ac.difficulty_warnings          || [],
          course_type:                 'elective',
          status:                      ac.status     || 'eligible',
          locked_by_user:              false,
          source:                      'audit',
          missing_prerequisites:        ac.missing_prerequisites         || [],
          missing_prerequisite_details: ac.missing_prerequisite_details  || [],
          prerequisites:                ac.prerequisites                 || [],
          prerequisite_details:         ac.prerequisite_details          || [],
          warnings:                    ac.weekly_hours == null ? ['שעות שבועיות חסרות.'] : [],
          data_quality:                { has_weekly_hours: ac.weekly_hours != null },
          syllabus_url:                ac.syllabus_url   || null,
          syllabus_links:              ac.syllabus_links  || [],
          source_urls:                 ac.source_urls     || [],
          semester_availability:       ac.semester_availability || null,
          grade_signal:                ac.grade_signal          || null,
        };
      } else {
        /* Enrich board entry with audit data if missing */
        const entry = courseMap[ac.course_id];
        if (!entry.syllabus_url  && ac.syllabus_url)  entry.syllabus_url  = ac.syllabus_url;
        if (!entry.syllabus_links?.length && ac.syllabus_links?.length)
          entry.syllabus_links = ac.syllabus_links;
        if (entry.workload_score              == null) entry.workload_score              = ac.workload_score              ?? null;
        if (entry.conceptual_complexity_score == null) entry.conceptual_complexity_score = ac.conceptual_complexity_score ?? null;
        if (entry.prerequisite_depth_score    == null) entry.prerequisite_depth_score    = ac.prerequisite_depth_score    ?? null;
        if (entry.assessment_intensity_score  == null) entry.assessment_intensity_score  = ac.assessment_intensity_score  ?? null;
        if (entry.difficulty_confidence       == null) entry.difficulty_confidence       = ac.difficulty_confidence        ?? null;
        if (!entry.difficulty_warnings?.length)        entry.difficulty_warnings         = ac.difficulty_warnings          || [];
        if (!entry.prerequisite_details?.length)       entry.prerequisite_details        = ac.prerequisite_details         || [];
        if (!entry.missing_prerequisite_details?.length) entry.missing_prerequisite_details = ac.missing_prerequisite_details || [];
        if (!entry.grade_signal && ac.grade_signal)    entry.grade_signal                = ac.grade_signal;
        if (!entry.program_category_id && ac.program_category_id) {
          entry.program_category_id      = ac.program_category_id;
          entry.program_category_name_he = ac.program_category_name_he || null;
          entry.needs_category_review    = ac.needs_category_review    || false;
        }
      }
    }
  }

  /* ── Supplement courseMap with PDF program data ─────────────────────────
   * Loads from two sources in priority order:
   *   1. board.metadata.program_repository_courses  (embedded by backend)
   *   2. programJson.elective_courses + other_specialization_electives (live fetch)
   *
   * For every course not already in courseMap: add with status "partial_info"
   * (or "not_offered") using PDF name / hours / category as display data.
   * For courses already in courseMap: only enrich category + offered fields.
   */
  const _addOrEnrichCourse = (cid, name_he, hours, offered_semesters, offered_in_year, catId, prereqs, catNameHe) => {
    if (!cid) return;
    if (courseMap[cid]) {
      const e = courseMap[cid];
      if (!e.program_category_id && catId)         e.program_category_id      = catId;
      if (!e.program_category_name_he && catNameHe) e.program_category_name_he = catNameHe;
      if (e.offered_in_year == null)               e.offered_in_year          = offered_in_year !== false;
      if (!e.offered_semesters?.length && offered_semesters?.length)
        e.offered_semesters = offered_semesters;
    } else {
      const isOffered = offered_in_year !== false;
      courseMap[cid] = {
        course_id:                   cid,
        name_he:                     name_he || null,
        weekly_hours:                hours   ?? null,
        difficulty_score:            null,
        difficulty_level:            null,
        workload_score:              null,
        conceptual_complexity_score: null,
        prerequisite_depth_score:    null,
        assessment_intensity_score:  null,
        difficulty_confidence:       null,
        difficulty_warnings:         [],
        course_type:                 'elective',
        status:                      isOffered ? 'partial_info' : 'not_offered',
        locked_by_user:              false,
        source:                      'program_json',
        program_category_id:         catId,
        program_category_name_he:    catNameHe || null,
        needs_category_review:       false,
        offered_in_year:             isOffered,
        offered_semesters:           offered_semesters || [],
        missing_prerequisites:       [],
        missing_prerequisite_details:[],
        prerequisites:               (prereqs || []).filter(p => p.course_id).map(p => p.course_id),
        prerequisite_details:        (prereqs || []).filter(p => p.name_he)
                                       .map(p => ({ course_id: p.course_id || null, name_he: p.name_he })),
        warnings:                    isOffered ? [] : ['לא מוצע בשנת הלימודים הנוכחית'],
        data_quality:                { has_weekly_hours: hours != null, partial: true },
        syllabus_url:                null,
        syllabus_links:              [],
        source_urls:                 [],
        semester_availability:       null,
        grade_signal:                null,
        instructor_uncertainty:      null,
        allowed_semesters:           [],
        locked_by_default:           false,
        placement_rule:              'choose_one_allowed_semester',
        needs_verification:          false,
        source_note:                 '',
        selection_reason:            null,
      };
    }
  };

  /* Source 1: embedded in board metadata (available even after localStorage restore) */
  for (const rc of (board.metadata?.program_repository_courses || [])) {
    _addOrEnrichCourse(
      rc.course_id, rc.name_he, rc.weekly_hours,
      rc.offered_semesters, rc.offered_in_year, rc.category_id, null,
      rc.program_category_name_he || null
    );
  }

  /* Source 2: live programJson fetch (enriches with prerequisites etc.) */
  if (programJson) {
    for (const ec of (programJson.elective_courses || [])) {
      _addOrEnrichCourse(
        ec.course_id, ec.name_he, ec.hours,
        ec.offered_semesters, ec.offered_in_year,
        ec.category_id || null, ec.prerequisites
      );
    }
    for (const ec of (programJson.other_specialization_electives || [])) {
      _addOrEnrichCourse(
        ec.course_id, ec.name_he, null,
        [], ec.offered_in_year, 'other_specialization', null
      );
    }
  }

  const origSems  = Object.fromEntries(SEMESTERS.map(s => [s.id, []]));
  const placedSet = new Set();
  for (const sem of (board.semesters || [])) {
    if (origSems[sem.semester_id] !== undefined) {
      origSems[sem.semester_id] = (sem.courses || []).map(c => c.course_id);
      for (const c of (sem.courses || [])) placedSet.add(c.course_id);
    }
  }
  const origRepo = Object.keys(courseMap).filter(id => !placedSet.has(id));
  originalState  = { semesters: clone(origSems), repo: origRepo, unlockedIds: [] };

  const saved = tryLoadState();
  if (saved && validState(saved)) {
    state = saved;
    if (!Array.isArray(state.unlockedIds)) state.unlockedIds = [];

    /* Reconcile: courseMap may have grown (program_repository_courses loaded above)
     * since localStorage state was saved. Add any new courseMap entries that are
     * not already placed or in repo. */
    const savedPlacedSet = new Set(Object.values(state.semesters).flat());
    const savedRepoSet   = new Set(state.repo);
    for (const cid of Object.keys(courseMap)) {
      if (!savedPlacedSet.has(cid) && !savedRepoSet.has(cid)) {
        state.repo.push(cid);
        savedRepoSet.add(cid);
      }
    }
  } else {
    state = clone(originalState);
  }

  // Extract board-level completed course IDs
  _boardCompletedIds = board.metadata?.completed_course_ids || [];
  if (!_boardCompletedIds.length && audit) {
    const derived = new Set();
    for (const ac of audit) {
      for (const p of (ac.satisfied_prerequisites || [])) {
        if (!courseMap[p]) derived.add(p);
      }
    }
    _boardCompletedIds = [...derived];
  }

  // Merge board completed + user-marked completed
  completedCourseIds = [...new Set([..._boardCompletedIds, ...myCoursesState.completed])];

  // Extract program requirements categories from board metadata
  programRequirements = board.metadata?.program_requirements_categories || null;

  // When the board is empty, pre-open required (min_courses > 0) categories so they are
  // immediately visible. other_specialization (min_courses === 0) stays collapsed.
  if (allPlacedIds().size === 0 && programRequirements?.categories) {
    for (const cat of programRequirements.categories) {
      if (cat.min_courses > 0 && !cat.needs_review) openGroups.add(cat.category_id);
    }
  }

  /* ── Dev diagnostics (console only) ───────────────────────────────────── */
  const _planned = Object.values(state.semesters).flat().length;
  const _pdfRepo = board.metadata?.program_repository_courses?.length ?? 0;
  console.log('[init] program:', selectedProg?.program_id);
  console.log('[init] board JSON:', selectedProg?.board_json);
  console.log('[init] planned courses:', _planned);
  console.log('[init] repository courses (state.repo):', state.repo.length);
  console.log('[init] PDF repository courses (board.metadata):', _pdfRepo);
}

function normalizeCourse(c, status) {
  return {
    course_id:                   c.course_id,
    name_he:                     c.name_he               || null,
    weekly_hours:                c.weekly_hours,
    difficulty_score:            c.difficulty_score,
    difficulty_level:            c.difficulty_level       || null,
    workload_score:              c.workload_score           ?? null,
    conceptual_complexity_score: c.conceptual_complexity_score ?? null,
    prerequisite_depth_score:    c.prerequisite_depth_score    ?? null,
    assessment_intensity_score:  c.assessment_intensity_score  ?? null,
    difficulty_confidence:       c.difficulty_confidence        ?? null,
    difficulty_warnings:         c.difficulty_warnings          || [],
    course_type:                 c.course_type            || 'elective',
    status,
    locked_by_user:              !!c.locked_by_user,
    source:                      c.source                 || 'auto',
    missing_prerequisites:        c.missing_prerequisites         || [],
    missing_prerequisite_details: c.missing_prerequisite_details  || [],
    prerequisites:                c.prerequisites                 || [],
    prerequisite_details:         c.prerequisite_details          || [],
    warnings:                     c.warnings                      || [],
    data_quality:                c.data_quality           || {},
    syllabus_url:                c.syllabus_url           || null,
    syllabus_links:              c.syllabus_links         || [],
    source_urls:                 c.source_urls            || [],
    semester_availability:       c.semester_availability  || null,
    grade_signal:                c.grade_signal           || null,
    instructor_uncertainty:      c.instructor_uncertainty || null,
    program_category_id:         c.program_category_id         || null,
    program_category_name_he:    c.program_category_name_he    || null,
    needs_category_review:       c.needs_category_review       || false,
    selection_reason:            c.selection_reason            || null,
    allowed_semesters:           c.allowed_semesters           || [],
    locked_by_default:           c.locked_by_default           ?? true,
    placement_rule:              c.placement_rule              || 'fixed_semester',
    needs_verification:          c.needs_verification          || false,
    source_note:                 c.source_note                 || '',
    offered_in_year:             c.offered_in_year             ?? true,
    offered_semesters:           c.offered_semesters           || [],
  };
}

function renderChips() {
  const placed  = allPlacedIds().size;
  const noHours = Object.values(courseMap).filter(c => c.weekly_hours == null).length;
  const invalidCt = Object.values(boardValidation).filter(r => !r.valid).length;
  const planChip = placed > 0
    ? (invalidCt > 0
        ? mkChip('בעיות דרישות', invalidCt, true)
        : mkChip('תוכנית תקינה', '✓', false))
    : '';
  document.getElementById('hdr-chips').innerHTML = [
    mkChip('סה״כ', Object.keys(courseMap).length, false),
    mkChip('מוצבים', placed, false),
    mkChip('במאגר', state.repo.length, false),
    mkChip('חסרות שעות', noHours, noHours > 0),
    planChip,
  ].filter(Boolean).join('');
}
function mkChip(lbl, val, warn) {
  return `<div class="chip${warn?' warn':''}"><span class="cl">${esc(lbl)}</span> <span class="cv">${esc(val)}</span></div>`;
}

function _buildRepoSection(gid, nameHe, ids, forceOpen, emptyMsg) {
  const cards = ids.map(id => cardHtml(courseMap[id], false)).join('');
  const isOpen = forceOpen || openGroups.has(gid);
  const emptyHint = !ids.length && emptyMsg
    ? `<div class="repo-empty-msg">${emptyMsg}</div>` : '';
  return `<details class="repo-group" data-group="${esc(gid)}"${isOpen?' open':''}>
    <summary>
      ${esc(nameHe)}
      <span class="repo-group-count">${ids.length}</span>
      <span class="repo-group-chevron">›</span>
    </summary>
    <div class="repo-zone" data-zone="repo">${cards}${emptyHint}</div>
  </details>`;
}

function renderSidebar() {
  const avail = state.repo.length;
  document.getElementById('repo-sub').textContent =
    `${avail} קורס${avail !== 1 ? 'ים' : ''} זמינים`;

  /* Bucket courses from repo */
  const mandatoryIds   = [];
  const blockedIds     = [];
  const missingIds     = [];
  const byCatId        = {};   // category_id → [ids]
  const otherIds       = [];   // in repo but not in any program category

  const useCats = programRequirements?.categories?.length > 0;
  if (useCats) {
    for (const cat of programRequirements.categories) byCatId[cat.category_id] = [];
  }

  /* Build a quick lookup: course_id → category_id from programRequirements */
  const progCatMap = {};
  if (useCats) {
    for (const cat of programRequirements.categories) {
      for (const cid of (cat.course_ids || [])) progCatMap[cid] = cat.category_id;
    }
  }

  for (const id of state.repo) {
    const c = courseMap[id];
    if (!c) continue;
    if (c.course_type === 'mandatory') { mandatoryIds.push(id); continue; }

    /* If the course belongs to a program category, always show it there —
       even if it is blocked or has partial data.  The category section card
       will display the appropriate status badge. */
    const catId = c.program_category_id || progCatMap[id] || null;
    if (useCats && catId && byCatId[catId] !== undefined) {
      byCatId[catId].push(id);
      continue;
    }

    /* Courses not in any program category fall into the generic sections */
    if (c.status === 'missing_from_db') { missingIds.push(id);   continue; }
    if (c.status === 'blocked')         { blockedIds.push(id);   continue; }
    if (useCats) {
      otherIds.push(id);
    } else {
      otherIds.push(id); /* fallback: all elective_avail */
    }
  }

  /* Build section HTML */
  let sections = '';
  /* Mandatory group — always shown; message when empty */
  sections += _buildRepoSection('_mandatory', 'קורסי חובה', mandatoryIds, true,
    'קורסי חובה עדיין לא הוזנו לתוכנית זו');

  if (useCats) {
    /* Ordered category groups from program */
    for (const cat of programRequirements.categories) {
      const ids = byCatId[cat.category_id] || [];
      const suffix = (cat.min_courses > 0 && !cat.needs_review)
        ? ` (נדרש לפחות ${cat.min_courses})` : '';
      sections += _buildRepoSection(cat.category_id, (cat.name_he || cat.category_id) + suffix, ids, false);
    }
    if (otherIds.length) {
      const otherLabel = programRequirements?.other_category_label || 'לא משויך לתוכנית הנבחרת';
      sections += _buildRepoSection('_other', otherLabel, otherIds, false);
    }
  } else {
    sections += _buildRepoSection('elective_avail', 'קורסי בחירה זמינים', otherIds, true);

  if (blockedIds.length) {

        <span style="font-size:.66rem;color:var(--text-faint);padding:3px 6px;background:var(--surface2);border-radius:5px">אני עובד יום בשבוע</span>

        <span style="font-size:.66rem;color:var(--text-faint);padding:3px 6px;background:var(--surface2);border-radius:5px">אני רוצה לסיים את קורסי הליבה מוקדם</span>
      </div>
      <textarea class="ai-textarea" rows="3" id="ai-sidebar-textarea"
