/* ── Lock helpers ───────────────────────────────────────────────────────── */
/* placement_policy: 'fixed' (mandatory_fixed) → never draggable
                      'flexible' (mandatory_flexible) → draggable within allowed_semesters
                      'elective' → existing drag rules */
function isLocked(c) {
  return c?.placement_policy === 'fixed';
}

/* True when a mandatory course may be dragged between multiple allowed semesters */
function isFlexibleMandatory(c) {
  return c?.placement_policy === 'flexible';
}

/* False when drop target semester is outside the course's effective allowed semesters
   (program allowed_semesters narrowed by this year's actual offering, if known) */
function isSemesterAllowed(c, semId) {
  const allowed = c?.effective_allowed_semesters || c?.allowed_semesters || [];
  return allowed.length === 0 || allowed.includes(semId);
}

/* True when a course is officially flexible in the program but this year's actual
   offering restricts it to a single semester (effective narrower than program-level) */
function isOfferingRestrictedFlex(c) {
  const program = c?.program_allowed_semesters || c?.allowed_semesters || [];
  const effective = c?.effective_allowed_semesters || program;
  return c?.placement_policy === 'flexible'
    && program.length > 1
    && effective.length === 1;
}

/* False when the course's offered_semesters (A/B) excludes the target semester's A/B slot */
function isOfferedInSemester(c, semId) {
  const offered = c?.offered_semesters || [];
  if (!offered.length) return true;
  const part = semId.endsWith('_semester_a') ? 'A' : semId.endsWith('_semester_b') ? 'B' : null;
  return !part || offered.includes(part);
}

/* ── Prerequisite validation (client-side mirror of plan_validator.py) ──── */
function _prereqName(cid) {
  return courseMap[cid]?.name_he || cid;
}

/* Index of a semester id within SEMESTERS, or -1 if unknown */
function _semIndexOf(semId) {
  return SEMESTERS.findIndex(s => s.id === semId);
}

/* Semester index a course should be considered "in" for prerequisite-timing purposes:
   personal planned/current semester takes precedence over the official board placement. */
function _userSemesterIndex(cid, courseSemIdx) {
  const us = userCourseStatuses[cid];
  if (us?.planned_semester) {
    const idx = _semIndexOf(us.planned_semester);
    if (idx !== -1) return idx;
  }
  return cid in courseSemIdx ? courseSemIdx[cid] : -1;
}

function validatePlacement(courseId, targetSemId) {
  const semIds    = SEMESTERS.map(s => s.id);
  const targetIdx = semIds.indexOf(targetSemId);
  if (targetIdx === -1) {
    return { valid: true, missing: [], too_late: [], same_sem: [], ok_completed: [], ok_earlier: [], ok_current: [], ok_planned: [], blocked_current_same: [], blocked_planned_later: [], errors: [] };
  }

  // Build index: courseId → semesterIndex, excluding the course being validated
  const courseSemIdx = {};
  for (let i = 0; i < semIds.length; i++) {
    for (const cid of (state.semesters[semIds[i]] || [])) {
      if (cid !== courseId) courseSemIdx[cid] = i;
    }
  }

  const prereqs = courseMap[courseId]?.prerequisites || [];
  const missing = [], too_late = [], same_sem = [], ok_completed = [], ok_earlier = [], ok_current = [], ok_planned = [],
        blocked_current_same = [], blocked_planned_later = [];

  for (const prereq of prereqs) {
    const status = userCourseStatuses[prereq]?.status || 'not_taken';

    if (status === 'completed') {
      ok_completed.push(prereq);
      continue;
    }

    if (status === 'currently_taking' || status === 'planned') {
      const idx = _userSemesterIndex(prereq, courseSemIdx);
      if (idx === -1) {
        // No timing information available — informational only, doesn't block.
        (status === 'currently_taking' ? ok_current : ok_planned).push(prereq);
      } else if (targetIdx > idx) {
        (status === 'currently_taking' ? ok_current : ok_planned).push(prereq);
      } else if (status === 'currently_taking') {
        blocked_current_same.push(prereq);
      } else {
        blocked_planned_later.push(prereq);
      }
      continue;
    }

    // not_taken — fall back to official board placement
    if (prereq in courseSemIdx) {
      const idx = courseSemIdx[prereq];
      if (idx < targetIdx)       ok_earlier.push(prereq);
      else if (idx === targetIdx) same_sem.push(prereq);
      else                        too_late.push(prereq);
    } else {
      missing.push(prereq);
    }
  }

  const valid  = missing.length === 0 && too_late.length === 0 && same_sem.length === 0
    && blocked_current_same.length === 0 && blocked_planned_later.length === 0;
  const errors = [...missing, ...too_late, ...same_sem];
  return { valid, missing, too_late, same_sem, ok_completed, ok_earlier, ok_current, ok_planned, blocked_current_same, blocked_planned_later, errors };
}

/* Build the list of human-readable Hebrew validation messages for a validatePlacement() result */
function validationMessages(vr) {
  const msgs = [];
  const blockedPrereqIds = [...vr.missing, ...vr.too_late, ...vr.same_sem];
  if (blockedPrereqIds.length) {
    msgs.push(`חסרות דרישות קדם: ${blockedPrereqIds.map(_prereqName).join(', ')}`);
  }
  for (const cid of vr.blocked_current_same) {
    msgs.push(`הקורס ${_prereqName(cid)} נלמד עכשיו ולכן יכול לשמש כדרישת קדם רק מסמסטר הבא.`);
  }
  for (const cid of vr.blocked_planned_later) {
    msgs.push(`דרישת הקדם ${_prereqName(cid)} מתוכננת לאחר הקורס הזה.`);
  }
  return msgs;
}

function revalidateBoard() {
  // Keep completedCourseIds merged from board metadata + user-marked
  const userCompleted = Object.keys(userCourseStatuses).filter(cid => userCourseStatuses[cid].status === 'completed');
  completedCourseIds = [...new Set([..._boardCompletedIds, ...userCompleted])];
  boardValidation = {};
  for (const [semId, ids] of Object.entries(state.semesters)) {
    for (const cid of (ids || [])) {
      boardValidation[cid] = validatePlacement(cid, semId);
    }
  }
}

/* ── Drag & Drop ────────────────────────────────────────────────────────── */
function setupDragDelegation() {
  document.addEventListener('dragstart', e => {
    const card = e.target.closest('.course-card[draggable="true"]');
    if (!card) return;
    const cid = card.dataset.cid;
    const c   = courseMap[cid];
    if (isLocked(c)) { e.preventDefault(); return; }
    if (c?.status === 'blocked' && !allowBlockedDrag) { e.preventDefault(); return; }
    dragId      = cid;
    const sz    = card.closest('[data-zone="semester"]');
    dragFromSem = sz ? sz.dataset.sem : null;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', cid);
  });

  document.addEventListener('dragend', e => {
    const card = e.target.closest('.course-card');
    if (card) card.classList.remove('dragging');
    document.querySelectorAll('.drag-over,.drag-valid,.drag-invalid').forEach(el => {
      el.classList.remove('drag-over', 'drag-valid', 'drag-invalid');
      delete el.dataset.dragErr;
    });
    dragId = null; dragFromSem = null;
  });

  document.addEventListener('dragover', e => {
    const zone = e.target.closest('[data-zone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('drag-over');

    if (dragId && zone.dataset.zone === 'semester') {
      const vr         = validatePlacement(dragId, zone.dataset.sem);
      const dragCourse = courseMap[dragId];
      const semBlocked = !isSemesterAllowed(dragCourse, zone.dataset.sem);
      const notOffered = !semBlocked && !isOfferedInSemester(dragCourse, zone.dataset.sem);
      zone.classList.toggle('drag-valid',   vr.valid && !semBlocked && !notOffered);
      zone.classList.toggle('drag-invalid', !vr.valid || semBlocked || notOffered);
      if (semBlocked) {
        zone.dataset.dragErr = 'הקורס אינו ניתן לשיבוץ בסמסטר זה — אינו ברשימת הסמסטרים המותרים לקורס חובה זה';
        e.dataTransfer.dropEffect = allowInvalidPlacement ? 'move' : 'none';
      } else if (notOffered) {
        zone.dataset.dragErr = 'הקורס אינו מוצע בסמסטר זה לפי תוכנית הלימודים';
        e.dataTransfer.dropEffect = allowInvalidPlacement ? 'move' : 'none';
      } else if (!vr.valid) {
        zone.dataset.dragErr = validationMessages(vr).join(' | ');
        e.dataTransfer.dropEffect = allowInvalidPlacement ? 'move' : 'none';
      } else {
        delete zone.dataset.dragErr;
        e.dataTransfer.dropEffect = 'move';
      }
    } else {
      e.dataTransfer.dropEffect = 'move';
    }
  });

  document.addEventListener('dragleave', e => {
    const zone = e.target.closest('[data-zone]');
    if (!zone) return;
    if (!zone.contains(e.relatedTarget)) {
      zone.classList.remove('drag-over', 'drag-valid', 'drag-invalid');
      delete zone.dataset.dragErr;
    }
  });

  document.addEventListener('drop', e => {
    const zone = e.target.closest('[data-zone]');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('drag-over', 'drag-valid', 'drag-invalid');
    delete zone.dataset.dragErr;

    const id    = e.dataTransfer.getData('text/plain') || dragId;
    const toSem = zone.dataset.zone === 'semester' ? zone.dataset.sem : null;

    if (id && toSem) {
      const dropCourse = courseMap[id];
      /* Mandatory course semester restriction */
      if (!isSemesterAllowed(dropCourse, toSem)) {
        if (!allowInvalidPlacement) {
          showBoardNotify('הקורס אינו ניתן לשיבוץ בסמסטר זה — אינו ברשימת הסמסטרים המותרים לקורס חובה זה');
          return;
        }
        showBoardNotify('⚠ אזהרה: הקורס אינו ניתן לשיבוץ בסמסטר זה — אינו ברשימת הסמסטרים המותרים לקורס חובה זה');
      } else if (!isOfferedInSemester(dropCourse, toSem)) {
        if (!allowInvalidPlacement) {
          showBoardNotify('הקורס אינו מוצע בסמסטר זה לפי תוכנית הלימודים');
          return;
        }
        showBoardNotify('⚠ אזהרה: הקורס אינו מוצע בסמסטר זה לפי תוכנית הלימודים');
      }
      /* Prerequisite validation */
      const vr = validatePlacement(id, toSem);
      if (!vr.valid && !allowInvalidPlacement) {
        showBoardNotify(`לא ניתן לשבץ: ${validationMessages(vr).join(' | ')}`);
        return;
      }
    }
    moveCourse(id, dragFromSem, toSem);
  });

  /* Click delegation for rm/lock buttons */
  document.addEventListener('click', e => {
    const rmBtn = e.target.closest('[data-rm]');
    if (rmBtn) {
      const id = rmBtn.dataset.rm;
      const sz = rmBtn.closest('[data-zone="semester"]');
      if (sz) moveCourse(id, sz.dataset.sem, null);
      return;
    }
  });

  /* Accordion toggle tracking (capture phase — toggle doesn't bubble) */
  document.addEventListener('toggle', e => {
    const det = e.target.closest('details.repo-group[data-group]');
    if (!det) return;
    if (det.open) openGroups.add(det.dataset.group);
    else          openGroups.delete(det.dataset.group);
  }, true);
}

    if (e.target.closest('button,a,input,textarea,summary')) return;

    if (!card) return;

/* ── State mutations ────────────────────────────────────────────────────── */
function moveCourse(id, fromSem, toSem) {
  if (!id || fromSem === toSem) return;
  const c = courseMap[id];
  if (isLocked(c)) return;

  if (fromSem) state.semesters[fromSem] = (state.semesters[fromSem]||[]).filter(x=>x!==id);
  else         state.repo = state.repo.filter(x=>x!==id);

  if (toSem) {
    if (!state.semesters[toSem]) state.semesters[toSem] = [];
    if (!state.semesters[toSem].includes(id)) state.semesters[toSem].push(id);
  } else {
    if (!state.repo.includes(id)) state.repo.push(id);
  }

  // Keep a flexible mandatory course's personal planned semester in sync with its
  // board placement, unless the user has explicitly overridden it.
  if (toSem && isFlexibleMandatory(c)) {
    const us = userCourseStatuses[id] || { status: 'not_taken', planned_semester: null, override_reason: null };
    if (!us.override_reason) {
      us.planned_semester = toSem;
      if (us.status === 'not_taken') us.status = 'planned';
      userCourseStatuses[id] = us;
      saveUserCourseStatuses();
    }
  }

  saveState(); renderAll();
}

function resetBoard() {
  state = clone(originalState);
  localStorage.removeItem(_lsStateKey());
  renderAll();
}

function buildRecommendedPlan() {
  const MAX_PER_SEM = 5;
  const semA    = SEMESTERS.filter(s => s.season === 'a').map(s => s.id);
  const semB    = SEMESTERS.filter(s => s.season === 'b').map(s => s.id);
  const allSems = SEMESTERS.map(s => s.id);

  const byPref = { a: [], b: [], any: [] };
  for (const cid of [...state.repo]) {
    const c = courseMap[cid];
    if (!c || c.course_type === 'mandatory') continue;
    const sems = (c.offered_semesters || []).map(s => s.toLowerCase());
    if      (sems.length === 1 && sems[0] === 'a') byPref.a.push(cid);
    else if (sems.length === 1 && sems[0] === 'b') byPref.b.push(cid);
    else                                           byPref.any.push(cid);
  }

  const diff = cid => courseMap[cid]?.difficulty_score ?? 5;
  byPref.a.sort((a, b) => diff(a) - diff(b));
  byPref.b.sort((a, b) => diff(a) - diff(b));
  byPref.any.sort((a, b) => diff(a) - diff(b));

  /* Batch-place without re-rendering per course */
  const placed = new Set();
  const _place = (cids, semPool) => {
    for (const cid of cids) {
      if (placed.has(cid)) continue;
      const sem = semPool.find(s => (state.semesters[s] || []).length < MAX_PER_SEM);
      if (!sem) continue;
      state.repo = state.repo.filter(x => x !== cid);
      if (!state.semesters[sem]) state.semesters[sem] = [];
      if (!state.semesters[sem].includes(cid)) state.semesters[sem].push(cid);
      placed.add(cid);
    }
  };

  _place(byPref.a,   semA);
  _place(byPref.b,   semB);
  _place(byPref.any, allSems);

  saveState(); renderAll();
  showBoardNotify('תוכנית מומלצת נבנתה — ניתן לגרור קורסים לשינוי');
}

/* ── Reconciliation ─────────────────────────────────────────────────────────
 * If a saved layout (from localStorage, possibly stale) places a flexible
 * mandatory course in a semester outside its current effective_allowed_semesters
 * (board data may have been updated since the layout was saved — e.g. a course
 * that was officially flexible A/B is now known to be offered only in B this
 * year), move it to the first valid effective semester. Notify the user once. */
function reconcilePlacements() {
  if (!state || typeof state.semesters !== 'object') return;
  let changed = false;

  for (const [semId, ids] of Object.entries(state.semesters)) {
    if (!Array.isArray(ids)) continue;
    for (const cid of [...ids]) {
      const c = courseMap[cid];
      const effective = c?.effective_allowed_semesters;
      if (!effective || !effective.length) continue;
      if (effective.includes(semId)) continue;

      const target = effective.find(s => state.semesters[s] !== undefined) || null;
      state.semesters[semId] = state.semesters[semId].filter(x => x !== cid);
      if (target) {
        if (!state.semesters[target]) state.semesters[target] = [];
        if (!state.semesters[target].includes(cid)) state.semesters[target].push(cid);
      } else if (!state.repo.includes(cid)) {
        state.repo.push(cid);
      }
      changed = true;
    }
  }

  if (changed) {
    saveState();
    showBoardNotify('עודכנו נתוני תוכנית הלימודים — שיבוצים לא חוקיים תוקנו');
  }
}

/* ── Persistence ────────────────────────────────────────────────────────── */
function _lsStateKey() { return `${LS_STATE_PREFIX}_${selectedProg?.program_id || 'default'}`; }
function saveState() {
  try {
    localStorage.setItem(_lsStateKey(), JSON.stringify({ ...state, program_id: selectedProg?.program_id, state_version: selectedProg?.state_version ?? null }));
  } catch {}
}
function tryLoadState() {
  try { return JSON.parse(localStorage.getItem(_lsStateKey())); } catch { return null; }
}
function validState(s) {
  if (!s || typeof s.semesters !== 'object' || !Array.isArray(s.repo)) return false;
  if (s.program_id && selectedProg?.program_id && s.program_id !== selectedProg.program_id) return false;
  if (selectedProg?.state_version && s.state_version !== selectedProg.state_version) return false;
  return true;
}

/* ── Dark mode ──────────────────────────────────────────────────────────── */
function applyTheme() {
  const dark = localStorage.getItem(LS_THEME) === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const btn = document.getElementById('btn-dark');
  if (btn) btn.textContent = dark ? '☀ יום' : '☾ לילה';
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(LS_THEME, next);
  document.documentElement.dataset.theme = next;
  document.getElementById('btn-dark').textContent = next === 'dark' ? '☀ יום' : '☾ לילה';
}

/* ── My Courses ─────────────────────────────────────────────────────────── */
const USER_STATUS_HE = {
  completed:        'הושלם',
  currently_taking: 'נלמד עכשיו',
  planned:          'מתוכנן בלוח',
  not_taken:        'לא נלקח',
};

/* Legacy load — kept only to migrate old tau_my_courses data into userCourseStatuses */
function loadMyCoursesState() {
  try {
    const raw = localStorage.getItem(LS_MY_COURSES);
    if (raw) {
      const parsed = JSON.parse(raw);
      myCoursesState.completed = Array.isArray(parsed.completed) ? parsed.completed : [];
      myCoursesState.current   = Array.isArray(parsed.current)   ? parsed.current   : [];
    }
  } catch { myCoursesState = { completed: [], current: [] }; }
}

/* Load per-course personal status. Migrates legacy tau_my_courses on first run. */
function loadUserCourseStatuses() {
  try {
    const raw = localStorage.getItem(LS_USER_STATUSES);
    if (raw) {
      const parsed = JSON.parse(raw);
      userCourseStatuses = (parsed && typeof parsed === 'object') ? parsed : {};
      return;
    }
  } catch { userCourseStatuses = {}; }

  // Migration from legacy tau_my_courses (completed / currently-taking only)
  for (const cid of myCoursesState.completed || []) {
    userCourseStatuses[cid] = { status: 'completed', planned_semester: null, override_reason: null };
  }
  for (const cid of myCoursesState.current || []) {
    if (!userCourseStatuses[cid]) {
      userCourseStatuses[cid] = { status: 'currently_taking', planned_semester: null, override_reason: null };
    }
  }
  if (Object.keys(userCourseStatuses).length) saveUserCourseStatuses();
}

function saveUserCourseStatuses() {
  try { localStorage.setItem(LS_USER_STATUSES, JSON.stringify(userCourseStatuses)); } catch {}
}

function getUserStatus(cid) {
  return userCourseStatuses[cid] || { status: 'not_taken', planned_semester: null, override_reason: null };
}

/* True if the user has personally marked this course as completed. */
function isCourseCompleted(cid) {
  return getUserStatus(cid).status === 'completed';
}

/* Default semester to place a course back on the board: the user's planned
 * semester if set, otherwise the recommended/first effective semester. */
function _defaultRestoreSemester(c, us) {
  if (us?.planned_semester) return us.planned_semester;
  if (c?.recommended_semester) return c.recommended_semester;
  const effective = c?.effective_allowed_semesters || c?.allowed_semesters || [];
  return effective[0] || null;
}

/* Set a course's personal status. plannedSemester applies to currently_taking/planned only. */
function setUserStatus(cid, status, plannedSemester) {
  const us = userCourseStatuses[cid] || { status: 'not_taken', planned_semester: null, override_reason: null };
  const prevStatus = us.status;
  const c = courseMap[cid];
  us.status = status;
  if (status === 'currently_taking' || status === 'planned') {
    us.planned_semester = plannedSemester || us.planned_semester || null;
  } else if (status !== 'completed') {
    us.planned_semester = null;
  }

  if (status === 'completed' && prevStatus !== 'completed' && state) {
    // Remove from the visible board — completed courses no longer occupy a
    // future semester slot or count toward weekly hours.
    const currentSem = findCourseBoardSemester(cid);
    if (currentSem) {
      us._pre_completion_semester = currentSem;
      state.semesters[currentSem] = (state.semesters[currentSem] || []).filter(x => x !== cid);
    }
  } else if (prevStatus === 'completed' && status !== 'completed' && state) {
    // Restore to the board.
    if (status === 'not_taken' && c?.course_type !== 'mandatory') {
      if (!state.repo.includes(cid)) state.repo.push(cid);
    } else {
      const target = us._pre_completion_semester || _defaultRestoreSemester(c, us);
      if (target && state.semesters[target] !== undefined) {
        if (!state.semesters[target].includes(cid)) state.semesters[target].push(cid);
      } else if (!state.repo.includes(cid)) {
        state.repo.push(cid);
      }
    }
    delete us._pre_completion_semester;
  }

  userCourseStatuses[cid] = us;
  saveUserCourseStatuses();
  if (state) saveState();

  // Keep legacy myCoursesState in sync for any old code paths
  myCoursesState.completed = Object.keys(userCourseStatuses).filter(id => userCourseStatuses[id].status === 'completed');
  myCoursesState.current   = Object.keys(userCourseStatuses).filter(id => userCourseStatuses[id].status === 'currently_taking');
}

/* The semester id (if any) in which a course is currently placed on the board */
function findCourseBoardSemester(cid) {
  for (const [semId, ids] of Object.entries(state?.semesters || {})) {
    if ((ids || []).includes(cid)) return semId;
  }
  return null;
}

function openMyCoursesModal() {
  const modal = document.getElementById('my-courses-modal');
  document.body.classList.add('my-courses-open');
  modal.classList.remove('hiding');
  modal.removeAttribute('hidden');

  const searchEl = document.getElementById('my-courses-search');
  const listEl   = document.getElementById('my-courses-list');
  searchEl.value = '';
  _renderMyCoursesListContent(listEl, '');
  setTimeout(() => searchEl.focus(), 60);

  searchEl.oninput = () => _renderMyCoursesListContent(listEl, searchEl.value);

  listEl.onchange = e => {
    const statusSel = e.target.closest('[data-mc-status-select]');
    const semSel    = e.target.closest('[data-mc-sem-select]');
    if (statusSel) {
      const cid = statusSel.dataset.mcStatusSelect;
      setUserStatus(cid, statusSel.value, getUserStatus(cid).planned_semester);
    } else if (semSel) {
      const cid = semSel.dataset.mcSemSelect;
      const us  = getUserStatus(cid);
      setUserStatus(cid, us.status, semSel.value || null);
    } else {
      return;
    }
    _renderMyCoursesListContent(listEl, searchEl.value);
    renderAll();
  };

  document.getElementById('my-courses-close-btn').onclick = closeMyCoursesModal;

  /* Click overlay (outside dialog) to close */
  modal.onclick = e => { if (e.target === modal) closeMyCoursesModal(); };
}

function closeMyCoursesModal() {
  const modal = document.getElementById('my-courses-modal');
  modal.classList.add('hiding');
  setTimeout(() => {
    modal.setAttribute('hidden', '');
    modal.classList.remove('hiding');
    document.body.classList.remove('my-courses-open');
  }, 220);
}

function _renderMyCoursesListContent(listEl, query) {
  const q = (query || '').toLowerCase().trim();

  const courses = Object.values(courseMap)
    .filter(c => !q ||
      c.course_id.toLowerCase().includes(q) ||
      (c.name_he || '').toLowerCase().includes(q))
    .sort((a, b) => {
      const an = a.name_he || a.course_id, bn = b.name_he || b.course_id;
      return an.localeCompare(bn, 'he');
    });

  /* Update summary line */
  const sumEl = document.getElementById('my-courses-summary');
  if (sumEl) {
    const counts = { completed: 0, currently_taking: 0, planned: 0 };
    for (const us of Object.values(userCourseStatuses)) {
      if (counts[us.status] != null) counts[us.status]++;
    }
    sumEl.innerHTML = `
      <span>✅ ${counts.completed} הושלמו</span>
      <span>📖 ${counts.currently_taking} נלמדים עכשיו</span>
      <span>🗓 ${counts.planned} מתוכננים</span>
    `;
  }

  if (!courses.length) {
    listEl.innerHTML = '<div class="prog-empty">לא נמצאו קורסים</div>';
    return;
  }

  listEl.innerHTML = courses.map(c => {
    const us     = getUserStatus(c.course_id);
    const status = us.status;
    const rowCls = status === 'completed' ? 'my-course-completed'
                 : status === 'currently_taking' ? 'my-course-current'
                 : status === 'planned' ? 'my-course-planned' : '';
    const nameHtml = c.name_he
      ? esc(c.name_he)
      : `<span style="color:var(--text-faint);font-style:italic">שם חסר — ${esc(c.course_id)}</span>`;

    const recSemId  = c.recommended_semester;
    const recSemHe  = recSemId ? (SEM_HE[recSemId] || recSemId) : null;
    const boardSemId = findCourseBoardSemester(c.course_id);
    const boardSemHe = boardSemId ? (SEM_HE[boardSemId] || boardSemId) : null;

    const metaParts = [];
    if (recSemHe)   metaParts.push(`<span class="my-course-meta">מומלץ רשמית: ${esc(recSemHe)}</span>`);
    if (boardSemHe) metaParts.push(`<span class="my-course-meta">בלוח כעת: ${esc(boardSemHe)}</span>`);

    const showSemPicker = status === 'currently_taking' || status === 'planned';
    const semOptions = ['<option value="">בחר סמסטר…</option>']
      .concat(SEMESTERS.map(s => `<option value="${esc(s.id)}"${us.planned_semester === s.id ? ' selected' : ''}>${esc(SEM_HE[s.id] || s.id)}</option>`))
      .join('');

    return `<div class="my-course-row ${rowCls}">
      <div class="my-course-info">
        <span class="my-course-id" dir="ltr">${esc(c.course_id)}</span>
        <span class="my-course-name">${nameHtml}</span>
        ${metaParts.join('')}
      </div>
      <div class="my-course-actions">
        <select class="my-course-status-select" data-mc-status-select="${esc(c.course_id)}" aria-label="סטטוס אישי">
          <option value="not_taken"        ${status==='not_taken'?'selected':''}>${USER_STATUS_HE.not_taken}</option>
          <option value="completed"        ${status==='completed'?'selected':''}>${USER_STATUS_HE.completed}</option>
          <option value="currently_taking" ${status==='currently_taking'?'selected':''}>${USER_STATUS_HE.currently_taking}</option>
          <option value="planned"          ${status==='planned'?'selected':''}>${USER_STATUS_HE.planned}</option>
        </select>
        ${showSemPicker ? `<select class="my-course-sem-select" data-mc-sem-select="${esc(c.course_id)}" aria-label="סמסטר אישי">${semOptions}</select>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ── Utilities ──────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function clone(o)       { return JSON.parse(JSON.stringify(o)); }
function allPlacedIds() { return new Set(Object.values(state?.semesters||{}).flat()); }
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return r.json();
}

/**
 * Load board JSON for a program.
 *
 * Strategy (in order):
 *   1. GET /api/board/{program_id}  — Vercel / vercel dev (Postgres)
 *   2. prog.board_json static path  — python -m http.server or any static server
 *
 * Falls back silently on any network error, non-200 status, or malformed JSON.
 * Logs the source so the developer can see which path was taken.
 */
async function fetchBoardJSON(prog) {
  const apiUrl = `/api/board/${encodeURIComponent(prog.program_id)}`;
  try {
    const r = await fetch(apiUrl);
    if (r.ok) {
      const data = await r.json();
      if (data && typeof data === 'object') {
        const repo    = data.metadata?.program_repository_courses?.length ?? '?';
        const placed  = (data.semesters || []).flatMap(s => s.courses || []).length;
        console.log(`[board] source: api | program: ${prog.program_id} | repo: ${repo} | placed: ${placed}`);
        return data;
      }
    }
  } catch { /* network error or JSON parse failure — fall through */ }

  // Fallback: load from the local static JSON file
  console.log(`[board] source: static-json | program: ${prog.program_id} | path: ${prog.board_json}`);
  return fetchJSON(prog.board_json);
}
