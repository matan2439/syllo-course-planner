/* ── Program modal ──────────────────────────────────────────────────────── */
function buildProgModal() {
  const searchEl  = document.getElementById('prog-search');
  const resultsEl = document.getElementById('prog-results');
  const closeBtn  = document.getElementById('prog-close-btn');
  const clearBtn  = document.getElementById('prog-clear-btn');
  let kbIdx = -1;

  function renderResults(query) {
    const q = (query || '').trim().toLowerCase();
    /* Filter by family-level display fields — not by year/program_id */
    const filtered = q
      ? PROGRAM_FAMILIES.filter(f =>
          [f.display_name_he, f.specialization_name_he, f.description_he]
            .some(v => v && v.toLowerCase().includes(q))
        )
      : PROGRAM_FAMILIES;
    kbIdx = -1;
    if (!filtered.length) {
      resultsEl.innerHTML = '<div class="prog-empty">לא נמצאו תארים מתאימים</div>';
      return;
    }
    resultsEl.innerHTML = filtered.map(f => {
      const defProg = PROGRAMS[f.default_program_id];
      const yearTag = defProg?.year
        ? `<span class="prog-year-tag">מקור: ${esc(String(defProg.year))}</span>`
        : '';
      /* Archive versions row — rendered outside the main button to avoid invalid nesting */
      const archiveHtml = f.archive_ids?.length
        ? `<div class="prog-archive-row" data-family="${esc(f.family_id)}">
             <span class="prog-archive-label">גרסה ישנה זמינה:</span>
             ${f.archive_ids.map(id => {
               const ap = PROGRAMS[id];
               return ap
                 ? `<button class="prog-archive-btn" data-prog-id="${esc(id)}" type="button"
                      title="${esc(ap.description_he || id)}">${esc(String(ap.year || id))}</button>`
                 : '';
             }).join('')}
           </div>`
        : '';
      return `
        <button class="prog-item" data-prog-id="${esc(f.default_program_id)}" role="option" type="button">
          <span class="prog-icon" aria-hidden="true">${esc(f.icon || '📚')}</span>
          <div class="prog-info">
            <div class="prog-name">${esc(f.display_name_he)}</div>
            ${f.specialization_name_he
              ? `<div class="prog-spec">${esc(f.specialization_name_he)}</div>`
              : ''}
            <div class="prog-desc">${esc(f.description_he)}</div>
            ${yearTag}
          </div>
        </button>
        ${archiveHtml}`;
    }).join('');
    /* Wire archive buttons (separate click, don't propagate to parent card) */
    resultsEl.querySelectorAll('.prog-archive-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        await loadProgram(btn.dataset.progId, true);
      });
    });
  }

  function applyKbFocus() {
    const items = resultsEl.querySelectorAll('.prog-item');
    items.forEach((el, i) => el.classList.toggle('kb-focus', i === kbIdx));
    if (kbIdx >= 0) items[kbIdx]?.scrollIntoView({ block: 'nearest' });
  }

  renderResults('');

  searchEl.addEventListener('input', () => renderResults(searchEl.value));

  searchEl.addEventListener('keydown', e => {
    const items = resultsEl.querySelectorAll('.prog-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      kbIdx = Math.min(kbIdx + 1, items.length - 1);
      applyKbFocus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      kbIdx = Math.max(kbIdx - 1, 0);
      applyKbFocus();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const target = kbIdx >= 0 ? items[kbIdx] : items[0];
      target?.click();
    } else if (e.key === 'Escape' && selectedProg) {
      hideModal();
    }
  });

  resultsEl.addEventListener('click', async e => {
    const btn = e.target.closest('[data-prog-id]');
    if (!btn) return;
    await loadProgram(btn.dataset.progId, true);
  });

  closeBtn.addEventListener('click', () => { if (selectedProg) hideModal(); });

  clearBtn.addEventListener('click', () => {
    console.log('[prog] Clearing program selection');
    localStorage.removeItem(LS_PROG);
    if (selectedProg) localStorage.removeItem(_lsStateKey());
    selectedProg = null;
    courseMap = {}; state = null; originalState = null;
    document.getElementById('app').setAttribute('hidden', '');
    showModal();
  });
}

function showModal() {
  const modal    = document.getElementById('prog-modal');
  const closeBtn = document.getElementById('prog-close-btn');
  const clearWrp = document.getElementById('prog-clear-wrap');
  const errEl    = document.getElementById('prog-modal-error');
  const searchEl = document.getElementById('prog-search');

  closeBtn.hidden = !selectedProg;
  clearWrp.hidden = !selectedProg;
  errEl.hidden    = true;

  document.body.classList.add('prog-modal-open');
  modal.classList.remove('hiding');
  modal.removeAttribute('hidden');

  /* Reset search + re-render */
  searchEl.value = '';
  searchEl.dispatchEvent(new Event('input'));
  setTimeout(() => searchEl.focus(), 60);
}

function hideModal() {
  const modal = document.getElementById('prog-modal');
  modal.classList.add('hiding');
  setTimeout(() => {
    modal.setAttribute('hidden', '');
    modal.classList.remove('hiding');
    document.body.classList.remove('prog-modal-open');
  }, 220);
}

/* ── Load program ───────────────────────────────────────────────────────── */
/* fromModal=true: loading state inside modal; false: loading state in board */
async function loadProgram(progId, fromModal) {
  const prog = PROGRAMS[progId];
  if (!prog) {
    console.error('[loadProgram] Unknown program id:', progId);
    return;
  }
  console.log('[loadProgram] Loading:', progId, '| fromModal:', fromModal);

  const errEl     = document.getElementById('prog-modal-error');
  let modalItems  = [];

  errEl.hidden = true;

  if (fromModal) {
    modalItems = [...document.querySelectorAll('#prog-results .prog-item')];
    modalItems.forEach(el => el.classList.add('loading'));
  } else {
    /* Show app skeleton while fetching */
    document.getElementById('app').removeAttribute('hidden');
    document.getElementById('msg-load').removeAttribute('hidden');
    document.getElementById('board').setAttribute('hidden', '');
    document.getElementById('msg-err').setAttribute('hidden', '');
  }

  try {
    const [board, audit, programJson] = await Promise.all([
      fetchBoardJSON(prog),
      fetchJSON(prog.audit_json).catch(err => {
        console.warn('[loadProgram] audit JSON unavailable:', err.message);
        return null;
      }),
      prog.program_json
        ? fetchJSON(prog.program_json).catch(err => {
            console.warn('[loadProgram] program JSON unavailable:', err.message);
            return null;
          })
        : Promise.resolve(null),
    ]);
    console.log('[loadProgram] OK — semesters:', board.semesters?.length ?? 0,
                '| programJson:', programJson ? 'loaded' : 'none');

    /* Commit */
    selectedProg = prog;
    localStorage.setItem(LS_PROG, progId);

    /* Update header */
    const nameStr = prog.specialization_name_he
      ? `${prog.program_name_he} · ${prog.specialization_name_he} · ${prog.year}`
      : `${prog.program_name_he} · ${prog.year}`;
    document.getElementById('hdr-prog-name').textContent = nameStr;

    init(board, audit, programJson);
    renderAll();

    document.getElementById('app').removeAttribute('hidden');
    document.getElementById('msg-load').setAttribute('hidden', '');
    document.getElementById('board').removeAttribute('hidden');
    document.getElementById('msg-err').setAttribute('hidden', '');

    hideModal(); /* no-op if already hidden */

  } catch (err) {
    console.error('[loadProgram] Failed:', err);

    localStorage.removeItem(LS_PROG);
    selectedProg = null;
    document.getElementById('app').setAttribute('hidden', '');
    modalItems.forEach(el => el.classList.remove('loading'));

    errEl.textContent = `שגיאה בטעינת הנתונים: ${err.message}`;
    errEl.hidden = false;

    /* If loading was triggered without modal (saved program), open modal with error */
    if (!fromModal) showModal();
  }
}

/* ── Data init ──────────────────────────────────────────────────────────── */
function init(board, audit, programJson) {
  courseMap = {};

  for (const sem of (board.semesters || [])) {
    for (const c of (sem.courses || [])) {
      courseMap[c.course_id] = normalizeCourse(c, c.locked_by_user ? 'locked' : 'eligible');
    }
  }

  /* When the board embeds program_repository_courses, the audit must only
   * enrich courses already in the program — it must not introduce unrelated
   * audit-only courses that do not belong to this program. */
  const hasProgramRepo = (board.metadata?.program_repository_courses?.length ?? 0) > 0;

  if (audit) {
    for (const ac of audit) {
      if (!courseMap[ac.course_id]) {
        if (hasProgramRepo) continue;   // skip audit-only courses; they are not in this program
        courseMap[ac.course_id] = {
          course_id:                   ac.course_id,
          name_he:                     ac.name_he    || null,
          weekly_hours:                ac.weekly_hours,
          difficulty_score:            ac.difficulty_score,
          difficulty_level:            ac.difficulty_level || null,
          workload_score:              ac.workload_score              ?? null,
          conceptual_complexity_score: ac.conceptual_complexity_score ?? null,
          prerequisite_depth_score:    ac.prerequisite_depth_score    ?? null,
          assessment_intensity_score:  ac.assessment_intensity_score  ?? null,
          difficulty_confidence:       ac.difficulty_confidence        ?? null,
          difficulty_warnings:         ac.difficulty_warnings          || [],
          course_type:                 'elective',
          status:                      ac.status     || 'eligible',
          locked_by_user:              false,
          source:                      'audit',
          missing_prerequisites:        ac.missing_prerequisites         || [],
          missing_prerequisite_details: ac.missing_prerequisite_details  || [],
          prerequisites:                ac.prerequisites                 || [],
          prerequisite_details:         ac.prerequisite_details          || [],
          warnings:                    ac.weekly_hours == null ? ['שעות שבועיות חסרות.'] : [],
          data_quality:                { has_weekly_hours: ac.weekly_hours != null },
          syllabus_url:                ac.syllabus_url   || null,
          syllabus_links:              ac.syllabus_links  || [],
          source_urls:                 ac.source_urls     || [],
          semester_availability:       ac.semester_availability || null,
          grade_signal:                ac.grade_signal          || null,
        };
      } else {
        /* Enrich board entry with audit data if missing */
        const entry = courseMap[ac.course_id];
        if (!entry.syllabus_url  && ac.syllabus_url)  entry.syllabus_url  = ac.syllabus_url;
        if (!entry.syllabus_links?.length && ac.syllabus_links?.length)
          entry.syllabus_links = ac.syllabus_links;
        if (entry.workload_score              == null) entry.workload_score              = ac.workload_score              ?? null;
        if (entry.conceptual_complexity_score == null) entry.conceptual_complexity_score = ac.conceptual_complexity_score ?? null;
        if (entry.prerequisite_depth_score    == null) entry.prerequisite_depth_score    = ac.prerequisite_depth_score    ?? null;
        if (entry.assessment_intensity_score  == null) entry.assessment_intensity_score  = ac.assessment_intensity_score  ?? null;
        if (entry.difficulty_confidence       == null) entry.difficulty_confidence       = ac.difficulty_confidence        ?? null;
        if (!entry.difficulty_warnings?.length)        entry.difficulty_warnings         = ac.difficulty_warnings          || [];
        if (!entry.prerequisite_details?.length)       entry.prerequisite_details        = ac.prerequisite_details         || [];
        if (!entry.missing_prerequisite_details?.length) entry.missing_prerequisite_details = ac.missing_prerequisite_details || [];
        if (!entry.grade_signal && ac.grade_signal)    entry.grade_signal                = ac.grade_signal;
        if (!entry.program_category_id && ac.program_category_id) {
          entry.program_category_id      = ac.program_category_id;
          entry.program_category_name_he = ac.program_category_name_he || null;
          entry.needs_category_review    = ac.needs_category_review    || false;
        }
      }
    }
  }

  /* ── Supplement courseMap with PDF program data ─────────────────────────
   * Loads from two sources in priority order:
   *   1. board.metadata.program_repository_courses  (embedded by backend)
   *   2. programJson.elective_courses + other_specialization_electives (live fetch)
   *
   * For every course not already in courseMap: add with status "partial_info"
   * (or "not_offered") using PDF name / hours / category as display data.
   * For courses already in courseMap: only enrich category + offered fields.
   */
  const _addOrEnrichCourse = (cid, name_he, hours, offered_semesters, offered_in_year, catId, prereqs, catNameHe) => {
    if (!cid) return;
    if (courseMap[cid]) {
      const e = courseMap[cid];
      if (!e.program_category_id && catId)         e.program_category_id      = catId;
      if (!e.program_category_name_he && catNameHe) e.program_category_name_he = catNameHe;
      if (e.offered_in_year == null)               e.offered_in_year          = offered_in_year !== false;
      if (!e.offered_semesters?.length && offered_semesters?.length)
        e.offered_semesters = offered_semesters;
    } else {
      const isOffered = offered_in_year !== false;
      courseMap[cid] = {
        course_id:                   cid,
        name_he:                     name_he || null,
        weekly_hours:                hours   ?? null,
        difficulty_score:            null,
        difficulty_level:            null,
        workload_score:              null,
        conceptual_complexity_score: null,
        prerequisite_depth_score:    null,
        assessment_intensity_score:  null,
        difficulty_confidence:       null,
        difficulty_warnings:         [],
        course_type:                 'elective',
        status:                      isOffered ? 'partial_info' : 'not_offered',
        locked_by_user:              false,
        source:                      'program_json',
        program_category_id:         catId,
        program_category_name_he:    catNameHe || null,
        needs_category_review:       false,
        offered_in_year:             isOffered,
        offered_semesters:           offered_semesters || [],
        missing_prerequisites:       [],
        missing_prerequisite_details:[],
        prerequisites:               (prereqs || []).filter(p => p.course_id).map(p => p.course_id),
        prerequisite_details:        (prereqs || []).filter(p => p.name_he)
                                       .map(p => ({ course_id: p.course_id || null, name_he: p.name_he })),
        warnings:                    isOffered ? [] : ['לא מוצע בשנת הלימודים הנוכחית'],
        data_quality:                { has_weekly_hours: hours != null, partial: true },
        syllabus_url:                null,
        syllabus_links:              [],
        source_urls:                 [],
        course_details_url:          null,
        exam_url:                    null,
        prerequisites_url:           null,
        moodle_url:                  null,
        mailing_list_url:            null,
        assessment_type:             null,
        assessment_text_raw:         null,
        assessment_analysis_status:  null,
        assessment_ai_notes:         null,
        syllabus_text_available:     null,
        syllabus_ai_analysis_status: null,
        syllabus_ai_topics:          [],
        syllabus_ai_complexity_notes: null,
        tau_factor_lookup_id:        null,
        tau_factor_status:           null,
        tau_factor_avg_grade:        null,
        tau_factor_sample_size:      null,
        tau_factor_source_url:       null,
        detail_source_type:          null,
        official_details_available:  null,
        semester_availability:       null,
        grade_signal:                null,
        instructor_uncertainty:      null,
        allowed_semesters:           [],
        locked_by_default:           false,
        placement_rule:              'choose_one_allowed_semester',
        needs_verification:          false,
        source_note:                 '',
        selection_reason:            null,
        name_source:                 name_he ? 'program_json' : 'not_found',
        name_source_confidence:      name_he ? 'high' : 'none',
        syllabus_summary_he:         null,
        syllabus_topics_he:          [],
        syllabus_prerequisites_he:   [],
        syllabus_assessment_he:      null,
        syllabus_structure_he:       null,
        syllabus_source_url:         null,
        syllabus_confidence:         null,
        semester_hours:              null,
        lecture_hours:               null,
        tutorial_hours:              null,
        lab_hours:                   null,
        teaching_format:             null,
        hours_source:                null,
        hours_source_confidence:     null,
      };
    }
  };

  /* Source 1: embedded in board metadata (available even after localStorage restore) */
  for (const rc of (board.metadata?.program_repository_courses || [])) {
    _addOrEnrichCourse(
      rc.course_id, rc.name_he, rc.weekly_hours,
      rc.offered_semesters, rc.offered_in_year, rc.category_id, null,
      rc.program_category_name_he || null
    );
    /* Enrich with difficulty, URL, and detail data from board JSON */
    const _ce = courseMap[rc.course_id];
    if (_ce) {
      if (_ce.difficulty_score == null && rc.difficulty_score != null) {
        _ce.difficulty_score            = rc.difficulty_score;
        _ce.difficulty_level            = rc.difficulty_level            || null;
        _ce.difficulty_confidence       = rc.difficulty_confidence       ?? null;
        _ce.workload_score              = rc.workload_score              ?? null;
        _ce.conceptual_complexity_score = rc.conceptual_complexity_score ?? null;
        _ce.prerequisite_depth_score    = rc.prerequisite_depth_score    ?? null;
        _ce.assessment_intensity_score  = rc.assessment_intensity_score  ?? null;
      }
      if (!_ce.course_details_url  && rc.course_details_url)  _ce.course_details_url  = rc.course_details_url;
      if (!_ce.syllabus_url        && rc.syllabus_url)         _ce.syllabus_url        = rc.syllabus_url;
      if (!_ce.syllabus_links?.length && rc.syllabus_links?.length) _ce.syllabus_links = rc.syllabus_links;
      if (!_ce.exam_url            && rc.exam_url)             _ce.exam_url            = rc.exam_url;
      if (!_ce.prerequisites_url   && rc.prerequisites_url)   _ce.prerequisites_url   = rc.prerequisites_url;
      if (!_ce.moodle_url          && rc.moodle_url)          _ce.moodle_url          = rc.moodle_url;
      if (!_ce.mailing_list_url    && rc.mailing_list_url)    _ce.mailing_list_url    = rc.mailing_list_url;
      if (_ce.assessment_type      == null && rc.assessment_type)    _ce.assessment_type            = rc.assessment_type;
      if (_ce.assessment_text_raw  == null && rc.assessment_text_raw) _ce.assessment_text_raw       = rc.assessment_text_raw;
      if (_ce.assessment_analysis_status == null)              _ce.assessment_analysis_status = rc.assessment_analysis_status ?? null;
      if (_ce.assessment_ai_notes  == null && rc.assessment_ai_notes) _ce.assessment_ai_notes       = rc.assessment_ai_notes;
      if (_ce.syllabus_text_available == null)                 _ce.syllabus_text_available    = rc.syllabus_text_available  ?? null;
      if (_ce.syllabus_ai_analysis_status == null)             _ce.syllabus_ai_analysis_status = rc.syllabus_ai_analysis_status ?? null;
      if (!_ce.tau_factor_lookup_id && rc.tau_factor_lookup_id) _ce.tau_factor_lookup_id      = rc.tau_factor_lookup_id;
      if (_ce.tau_factor_status    == null)                    _ce.tau_factor_status          = rc.tau_factor_status ?? null;
      if (_ce.tau_factor_avg_grade == null && rc.tau_factor_avg_grade != null) _ce.tau_factor_avg_grade = rc.tau_factor_avg_grade;
      if (_ce.tau_factor_sample_size == null && rc.tau_factor_sample_size != null) _ce.tau_factor_sample_size = rc.tau_factor_sample_size;
      if (!_ce.tau_factor_source_url && rc.tau_factor_source_url) _ce.tau_factor_source_url   = rc.tau_factor_source_url;
      if (!_ce.grade_signal && rc.grade_signal)                _ce.grade_signal               = rc.grade_signal;
      if (_ce.official_details_available == null)              _ce.official_details_available = rc.official_details_available ?? null;
      if (!_ce.detail_source_type && rc.detail_source_type)   _ce.detail_source_type  = rc.detail_source_type;
      if (!_ce.syllabus_summary_he && rc.syllabus_summary_he) _ce.syllabus_summary_he = rc.syllabus_summary_he;
      if (!_ce.syllabus_topics_he?.length && rc.syllabus_topics_he?.length) _ce.syllabus_topics_he = rc.syllabus_topics_he;
      if (!_ce.syllabus_prerequisites_he?.length && rc.syllabus_prerequisites_he?.length) _ce.syllabus_prerequisites_he = rc.syllabus_prerequisites_he;
      if (!_ce.syllabus_assessment_he && rc.syllabus_assessment_he) _ce.syllabus_assessment_he = rc.syllabus_assessment_he;
      if (!_ce.syllabus_structure_he && rc.syllabus_structure_he) _ce.syllabus_structure_he = rc.syllabus_structure_he;
      if (!_ce.syllabus_source_url && rc.syllabus_source_url) _ce.syllabus_source_url = rc.syllabus_source_url;
      if (_ce.syllabus_confidence == null && rc.syllabus_confidence != null) _ce.syllabus_confidence = rc.syllabus_confidence;
      if (_ce.semester_hours == null && rc.semester_hours != null) _ce.semester_hours = rc.semester_hours;
      if (_ce.lecture_hours == null && rc.lecture_hours != null) _ce.lecture_hours = rc.lecture_hours;
      if (_ce.tutorial_hours == null && rc.tutorial_hours != null) _ce.tutorial_hours = rc.tutorial_hours;
      if (_ce.lab_hours == null && rc.lab_hours != null) _ce.lab_hours = rc.lab_hours;
      if (!_ce.teaching_format && rc.teaching_format) _ce.teaching_format = rc.teaching_format;
      if (!_ce.hours_source && rc.hours_source) _ce.hours_source = rc.hours_source;
      if (!_ce.hours_source_confidence && rc.hours_source_confidence) _ce.hours_source_confidence = rc.hours_source_confidence;
      if (rc.name_source)                                     _ce.name_source            = rc.name_source;
      if (rc.name_source_confidence)                          _ce.name_source_confidence = rc.name_source_confidence;
    }
  }

  /* Source 2: live programJson fetch (enriches with prerequisites etc.) */
  if (programJson) {
    for (const ec of (programJson.elective_courses || [])) {
      _addOrEnrichCourse(
        ec.course_id, ec.name_he, ec.hours,
        ec.offered_semesters, ec.offered_in_year,
        ec.category_id || null, ec.prerequisites
      );
    }
    for (const ec of (programJson.other_specialization_electives || [])) {
      _addOrEnrichCourse(
        ec.course_id, ec.name_he, null,
        [], ec.offered_in_year, 'other_specialization', null
      );
    }
  }

  const origSems  = Object.fromEntries(SEMESTERS.map(s => [s.id, []]));
  const placedSet = new Set();
  for (const sem of (board.semesters || [])) {
    if (origSems[sem.semester_id] !== undefined) {
      origSems[sem.semester_id] = (sem.courses || []).map(c => c.course_id);
      for (const c of (sem.courses || [])) placedSet.add(c.course_id);
    }
  }
  const origRepo = Object.keys(courseMap).filter(id => !placedSet.has(id));
  originalState  = { semesters: clone(origSems), repo: origRepo, unlockedIds: [] };

  const saved = tryLoadState();
  if (saved && validState(saved)) {
    state = saved;
    if (!Array.isArray(state.unlockedIds)) state.unlockedIds = [];

    /* Reconcile: courseMap may have grown (program_repository_courses loaded above)
     * since localStorage state was saved. Add any new courseMap entries that are
     * not already placed or in repo. */
    const savedPlacedSet = new Set(Object.values(state.semesters).flat());
    const savedRepoSet   = new Set(state.repo);
    for (const cid of Object.keys(courseMap)) {
      if (!savedPlacedSet.has(cid) && !savedRepoSet.has(cid)) {
        state.repo.push(cid);
        savedRepoSet.add(cid);
      }
    }
  } else {
    state = clone(originalState);
  }

  reconcilePlacements();

  // Extract board-level completed course IDs
  _boardCompletedIds = board.metadata?.completed_course_ids || [];
  if (!_boardCompletedIds.length && audit) {
    const derived = new Set();
    for (const ac of audit) {
      for (const p of (ac.satisfied_prerequisites || [])) {
        if (!courseMap[p]) derived.add(p);
      }
    }
    _boardCompletedIds = [...derived];
  }

  // Merge board completed + user-marked completed
  const userCompletedIds = Object.keys(userCourseStatuses).filter(cid => userCourseStatuses[cid].status === 'completed');
  completedCourseIds = [...new Set([..._boardCompletedIds, ...userCompletedIds])];

  // Extract program requirements categories from board metadata
  programRequirements = board.metadata?.program_requirements_categories || null;

  // When the board is empty, pre-open required (min_courses > 0) categories and the
  // other_specialization section so elective courses are immediately visible.
  if (allPlacedIds().size === 0 && programRequirements?.categories) {
    for (const cat of programRequirements.categories) {
      if (cat.min_courses > 0 && !cat.needs_review) openGroups.add(cat.category_id);
      if (cat.category_id === 'other_specialization') openGroups.add(cat.category_id);
    }
  }

  /* ── Dev diagnostics (console only) ───────────────────────────────────── */
  const _planned = Object.values(state.semesters).flat().length;
  const _pdfRepo = board.metadata?.program_repository_courses?.length ?? 0;
  console.log('[init] program:', selectedProg?.program_id);
  console.log('[init] board JSON:', selectedProg?.board_json);
  console.log('[init] planned courses:', _planned);
  console.log('[init] repository courses (state.repo):', state.repo.length);
  console.log('[init] PDF repository courses (board.metadata):', _pdfRepo);
}

function normalizeCourse(c, status) {
  return {
    course_id:                   c.course_id,
    name_he:                     c.name_he               || null,
    weekly_hours:                c.weekly_hours,
    difficulty_score:            c.difficulty_score,
    difficulty_level:            c.difficulty_level       || null,
    workload_score:              c.workload_score           ?? null,
    conceptual_complexity_score: c.conceptual_complexity_score ?? null,
    prerequisite_depth_score:    c.prerequisite_depth_score    ?? null,
    assessment_intensity_score:  c.assessment_intensity_score  ?? null,
    difficulty_confidence:       c.difficulty_confidence        ?? null,
    difficulty_warnings:         c.difficulty_warnings          || [],
    course_type:                 c.course_type            || 'elective',
    status,
    locked_by_user:              !!c.locked_by_user,
    source:                      c.source                 || 'auto',
    missing_prerequisites:        c.missing_prerequisites         || [],
    missing_prerequisite_details: c.missing_prerequisite_details  || [],
    prerequisites:                c.prerequisites                 || [],
    prerequisite_details:         c.prerequisite_details          || [],
    warnings:                     c.warnings                      || [],
    data_quality:                c.data_quality           || {},
    syllabus_url:                c.syllabus_url           || null,
    syllabus_links:              c.syllabus_links         || [],
    syllabus_text_available:     c.syllabus_text_available     ?? false,
    syllabus_summary_he:         c.syllabus_summary_he         || null,
    syllabus_topics_he:          c.syllabus_topics_he          || [],
    syllabus_prerequisites_he:   c.syllabus_prerequisites_he   || [],
    syllabus_assessment_he:      c.syllabus_assessment_he      || null,
    syllabus_structure_he:       c.syllabus_structure_he       || null,
    source_urls:                 c.source_urls            || [],
    semester_availability:       c.semester_availability  || null,
    grade_signal:                c.grade_signal           || null,
    instructor_uncertainty:      c.instructor_uncertainty || null,
    program_category_id:         c.program_category_id         || null,
    program_category_name_he:    c.program_category_name_he    || null,
    needs_category_review:       c.needs_category_review       || false,
    selection_reason:            c.selection_reason            || null,
    allowed_semesters:           c.allowed_semesters           || [],
    program_allowed_semesters:   c.program_allowed_semesters   || c.allowed_semesters || [],
    effective_allowed_semesters: c.effective_allowed_semesters || c.allowed_semesters || [],
    offering_source_url:         c.offering_source_url         || null,
    offering_source_confidence:  c.offering_source_confidence  || null,
    locked_by_default:           c.locked_by_default           ?? true,
    placement_rule:              c.placement_rule              || 'fixed_semester',
    is_mandatory:                c.is_mandatory ?? (c.course_type === 'mandatory'),
    placement_policy:            c.placement_policy || (
                                    c.course_type !== 'mandatory' ? 'elective'
                                    : (c.allowed_semesters || []).length > 1 ? 'flexible' : 'fixed'
                                  ),
    recommended_semester:        c.recommended_semester        ?? (c.allowed_semesters || [])[0] ?? null,
    needs_verification:          c.needs_verification          || false,
    source_note:                 c.source_note                 || '',
    offered_in_year:             c.offered_in_year             ?? true,
    offered_semesters:           c.offered_semesters           || [],
  };
}

/* ── Render ─────────────────────────────────────────────────────────────── */
function renderAll() { revalidateBoard(); renderChips(); renderSidebar(); renderBoard(); }

function renderChips() {
  const placed  = allPlacedIds().size;
  const noHours = Object.values(courseMap).filter(c => c.weekly_hours == null).length;
  const invalidCt = Object.values(boardValidation).filter(r => !r.valid).length;
  const planChip = placed > 0
    ? (invalidCt > 0
        ? mkChip('בעיות דרישות', invalidCt, true)
        : mkChip('תוכנית תקינה', '✓', false))
    : '';
  document.getElementById('hdr-chips').innerHTML = [
    mkChip('סה״כ', Object.keys(courseMap).length, false),
    mkChip('מוצבים', placed, false),
    mkChip('במאגר', state.repo.length, false),
    mkChip('חסרות שעות', noHours, noHours > 0),
    planChip,
  ].filter(Boolean).join('');
}
function mkChip(lbl, val, warn) {
  return `<div class="chip${warn?' warn':''}"><span class="cl">${esc(lbl)}</span> <span class="cv">${esc(val)}</span></div>`;
}

function _repoSearchText(c, nameHe) {
  const parts = [
    c.course_id, c.name_he, c.name_en, nameHe,
    c.program_category_name_he, CAT_CSS[c.program_category_id]?.label,
    ...(c.syllabus_topics_he || []), c.syllabus_summary_he,
  ];
  return parts.filter(Boolean).join(' ').toLowerCase();
}

function _buildRepoSection(gid, nameHe, ids, forceOpen, emptyMsg, notLoadedLabel) {
  const cards = ids.map(id => {
    const c = courseMap[id];
    if (!c) return '';
    return `<div class="repo-card-wrap" data-search="${esc(_repoSearchText(c, nameHe))}">${cardHtml(c, false)}</div>`;
  }).join('');
  const isOpen = forceOpen || openGroups.has(gid);
  const countDisplay = (notLoadedLabel && !ids.length) ? notLoadedLabel : ids.length;
  const emptyHint = !ids.length && emptyMsg
    ? `<div class="repo-empty-msg">${emptyMsg}</div>` : '';
  return `<details class="repo-group" data-group="${esc(gid)}"${isOpen?' open':''}${forceOpen?' data-force-open="1"':''}>
    <summary>
      ${esc(nameHe)}
      <span class="repo-group-count">${countDisplay}</span>
      <span class="repo-group-chevron">›</span>
    </summary>
    <div class="repo-zone" data-zone="repo">${cards}${emptyHint}</div>
  </details>`;
}

function renderSidebar() {
  const avail = state.repo.length;
  document.getElementById('repo-sub').textContent =
    `${avail} קורס${avail !== 1 ? 'ים' : ''} זמינים`;

  /* Bucket courses from repo */
  const mandatoryIds   = [];
  const blockedIds     = [];
  const missingIds     = [];
  const byCatId        = {};   // category_id → [ids]
  const otherIds       = [];   // in repo but not in any program category

  const useCats = programRequirements?.categories?.length > 0;
  if (useCats) {
    for (const cat of programRequirements.categories) byCatId[cat.category_id] = [];
  }

  /* Build a quick lookup: course_id → category_id from programRequirements */
  const progCatMap = {};
  if (useCats) {
    for (const cat of programRequirements.categories) {
      for (const cid of (cat.course_ids || [])) progCatMap[cid] = cat.category_id;
    }
  }

  for (const id of state.repo) {
    const c = courseMap[id];
    if (!c) continue;
    if (c.course_type === 'mandatory') { mandatoryIds.push(id); continue; }

    /* If the course belongs to a program category, always show it there —
       even if it is blocked or has partial data.  The category section card
       will display the appropriate status badge. */
    const catId = c.program_category_id || progCatMap[id] || null;
    if (useCats && catId && byCatId[catId] !== undefined) {
      byCatId[catId].push(id);
      continue;
    }

    /* Courses not in any program category fall into the generic sections */
    if (c.status === 'missing_from_db') { missingIds.push(id);   continue; }
    if (c.status === 'blocked')         { blockedIds.push(id);   continue; }
    if (useCats) {
      otherIds.push(id);
    } else {
      otherIds.push(id); /* fallback: all elective_avail */
    }
  }

  /* Build section HTML */
  let sections = '';
  /* Mandatory group — always shown; precise placeholder when empty */
  sections += _buildRepoSection('_mandatory', 'קורסי חובה', mandatoryIds, true,
    'קורסי החובה עדיין לא נטענו ממקור רשמי. לאחר הוספת קובץ קורסי החובה, הם ישובצו אוטומטית בלוח.',
    'טרם נטען');

  if (useCats) {
    /* Ordered category groups from program */
    for (const cat of programRequirements.categories) {
      const ids = byCatId[cat.category_id] || [];
      let suffix = (cat.min_courses > 0 && !cat.needs_review)
        ? ` (נדרש לפחות ${cat.min_courses})` : '';
      /* For the main elective section, make the count prominent in the title */
      if (cat.category_id === 'other_specialization' && ids.length > 0) {
        suffix = ` — ${ids.length} קורסים`;
      }
      sections += _buildRepoSection(cat.category_id, (cat.name_he || cat.category_id) + suffix, ids, false);
    }
    if (otherIds.length) {
      const otherLabel = programRequirements?.other_category_label || 'לא משויך לתוכנית הנבחרת';
      sections += _buildRepoSection('_other', otherLabel, otherIds, false);
    }
  } else {
    sections += _buildRepoSection('elective_avail', 'קורסי בחירה זמינים', otherIds, true);
  }

  if (blockedIds.length) {
    sections += _buildRepoSection('_blocked', 'חסומים בגלל דרישות קדם', blockedIds, false);
  }
  if (missingIds.length) {
    sections += _buildRepoSection('_missing', 'חסר מידע במאגר', missingIds, false);
  }

  /* Toggles */
  const blkToggle = blockedIds.length > 0
    ? `<button class="blk-toggle${allowBlockedDrag?' active':''}" id="blk-toggle-btn">
        <span class="blk-toggle-icon">${allowBlockedDrag?'🔓':'🔒'}</span>
        ${allowBlockedDrag ? 'הסתר גרירת חסומים' : 'הצג חסומים לגרירה ניסיונית'}
       </button>` : '';

  const invalToggle = `<button class="invalid-toggle${allowInvalidPlacement?' active':''}" id="invalid-toggle-btn"
    title="כאשר פעיל: מאפשר שיבוץ גם אם דרישות קדם לא הושלמו, עם סימון אזהרה">
    ⚠ ${allowInvalidPlacement ? 'אפשר שיבוץ לא תקין (פעיל)' : 'אפשר שיבוץ לא תקין עם אזהרה'}
  </button>`;

  /* Program progress panel */
  const prog = computeProgramProgress();
  const progressHtml = prog ? renderProgramProgress(prog) : '';

  /* AI panel — connected to /api/ai/course-planner via Vercel AI SDK */
  const aiPanelHtml = `<details class="ai-panel" id="ai-panel">
    <summary>🤖 <span>עוזר AI לתכנון מערכת</span>
      <span style="font-size:.59rem;color:#22c55e;margin-inline-start:4px" id="ai-status-badge">מחובר</span>
      <span class="ai-chevron">›</span>
    </summary>
    <div class="ai-body">
      <div class="ai-note">💡 שאל שאלות על התוכנית שלך — האסיסטנט מבוסס על הנתונים המקומיים בלבד.</div>
      <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">
        <button class="ai-prompt-btn" data-sidebar-prompt="האם התוכנית שלי מאוזנת?">💬 האם התוכנית שלי מאוזנת?</button>
        <button class="ai-prompt-btn" data-sidebar-prompt="איזה קורסי ליבה חסרים לי?">💬 איזה קורסי ליבה חסרים לי?</button>
        <button class="ai-prompt-btn" data-sidebar-prompt="איך אפשר להוריד עומס בסמסטר הכבד ביותר?">💬 איך אפשר להוריד עומס?</button>
        <button class="ai-prompt-btn" data-sidebar-prompt="האם יש בעיות דרישות קדם בתוכנית שלי?">💬 בעיות דרישות קדם?</button>
        <button class="ai-prompt-btn" data-sidebar-prompt="איזה קורסים מתאימים אם אני מעדיף עומס נמוך?">💬 קורסים עם עומס נמוך?</button>
      </div>
      <textarea class="ai-textarea" rows="3" id="ai-sidebar-textarea"
        placeholder="שאל שאלה על התוכנית…" dir="rtl"></textarea>
      <button class="ai-send" id="ai-sidebar-send">שלח ›</button>
      <div class="ai-response" id="ai-sidebar-response"></div>
    </div>
  </details>`;

  document.getElementById('repo-body').innerHTML = progressHtml + invalToggle + blkToggle + sections + aiPanelHtml;
  document.getElementById('invalid-toggle-btn')?.addEventListener('click', () => {
    allowInvalidPlacement = !allowInvalidPlacement;
    renderSidebar();
  });
  document.getElementById('blk-toggle-btn')?.addEventListener('click', () => {
    allowBlockedDrag = !allowBlockedDrag;
    renderSidebar();
  });
  /* Re-wire AI send + suggested prompt buttons (re-injected on each render) */
  document.getElementById('ai-sidebar-send')?.addEventListener('click', () => {
    const textarea = document.getElementById('ai-sidebar-textarea');
    const respEl   = document.getElementById('ai-sidebar-response');
    const sendBtn  = document.getElementById('ai-sidebar-send');
    const msg      = textarea?.value?.trim();
    if (!msg || !respEl || !sendBtn) return;
    callAiStream(msg, buildPlanContext(), null, respEl, sendBtn);
  });
  document.querySelectorAll('[data-sidebar-prompt]').forEach(btn => {
    btn.addEventListener('click', () => {
      const msg    = btn.dataset.sidebarPrompt;
      const respEl = document.getElementById('ai-sidebar-response');
      const sendBtn = document.getElementById('ai-sidebar-send');
      if (!msg || !respEl || !sendBtn) return;
      const textarea = document.getElementById('ai-sidebar-textarea');
      if (textarea) textarea.value = msg;
      callAiStream(msg, buildPlanContext(), null, respEl, sendBtn);
    });
  });

  /* Repository search */
  const searchInput = document.getElementById('repo-search-input');
  if (searchInput) {
    searchInput.value = repoSearchTerm;
    searchInput.addEventListener('input', () => {
      repoSearchTerm = searchInput.value;
      applyRepoSearch();
    });
  }
  document.getElementById('repo-search-clear')?.addEventListener('click', () => {
    repoSearchTerm = '';
    if (searchInput) searchInput.value = '';
    applyRepoSearch();
  });
  applyRepoSearch();
}

function applyRepoSearch() {
  const term = repoSearchTerm.trim().toLowerCase();
  const statusEl = document.getElementById('repo-search-status');
  const groups = document.querySelectorAll('#repo-body .repo-group');

  if (!term) {
    document.querySelectorAll('#repo-body .repo-card-wrap').forEach(w => { w.style.display = ''; });
    groups.forEach(g => {
      g.style.display = '';
      g.open = openGroups.has(g.dataset.group) || g.hasAttribute('data-force-open');
    });
    if (statusEl) statusEl.textContent = '';
    return;
  }

  let totalMatches = 0;
  groups.forEach(g => {
    let groupMatches = 0;
    g.querySelectorAll('.repo-card-wrap').forEach(w => {
      const match = (w.dataset.search || '').includes(term);
      w.style.display = match ? '' : 'none';
      if (match) groupMatches++;
    });
    totalMatches += groupMatches;
    if (groupMatches > 0) {
      g.style.display = '';
      g.open = true;
    } else {
      g.style.display = 'none';
    }
  });

  if (statusEl) {
    statusEl.textContent = totalMatches > 0
      ? `${totalMatches} קורסים נמצאו`
      : 'לא נמצאו קורסים';
  }
}

function renderBoard() {
  const emptyHint = allPlacedIds().size === 0
    ? `<div class="board-empty-hint">עדיין לא שובצו קורסים. גרור קורסים מהמאגר או השתמש בעתיד בעוזר AI לבניית תוכנית.</div>`
    : '';
  const yearGroups = [
    { label: "שנה ג׳", sems: SEMESTERS.slice(0, 2) },
    { label: "שנה ד׳", sems: SEMESTERS.slice(2, 4) },
  ];
  document.getElementById('board').innerHTML = emptyHint + yearGroups.map(yg =>
    `<div class="year-group">
      <div class="year-hdr">${esc(yg.label)}</div>
      <div class="year-sems">${yg.sems.map(s => semColHtml(s)).join('')}</div>
    </div>`
  ).join('');
}

function computeProgramProgress() {
  if (!programRequirements) return null;
  const allPlaced  = allPlacedIds();
  const allCounted = new Set([...allPlaced, ...completedCourseIds]);

  let plannedHours = 0, unknownHoursCount = 0;
  for (const cid of allPlaced) {
    const c = courseMap[cid];
    if (c?.weekly_hours != null) plannedHours += c.weekly_hours;
    else unknownHoursCount++;
  }

  const total     = programRequirements.total_required_hours || null;
  const pct       = total ? Math.min(100, Math.round((plannedHours / total) * 100)) : 0;
  const remaining = total != null ? Math.max(0, total - plannedHours) : null;

  const categories = (programRequirements.categories || []).map(cat => {
    const catSet  = new Set(cat.course_ids || []);
    const selected = [...allCounted].filter(cid => catSet.has(cid)).length;
    const min      = cat.min_courses || 0;
    return { ...cat, selected_count: selected, satisfied: selected >= min };
  });

  /* Core-total: sum across categories that belong to core_categories */
  const coreTotalMin = programRequirements.core_courses_total_min ?? null;
  let coreSelected = null;
  let coreSatisfied = null;
  if (coreTotalMin !== null) {
    /* core categories are those with min_courses > 0 and NOT advanced_labs/other */
    const nonCoreIds = new Set(['advanced_labs', 'other_specialization',
                                'uncategorized_review', 'other_specialization_electives']);
    coreSelected = categories
      .filter(c => c.min_courses > 0 && !c.needs_review && !nonCoreIds.has(c.category_id))
      .reduce((sum, c) => sum + c.selected_count, 0);
    coreSatisfied = coreSelected >= coreTotalMin;
  }

  return {
    total, plannedHours: Math.round(plannedHours * 10) / 10,
    pct, remaining, unknownHoursCount, categories,
    coreTotalMin, coreSelected, coreSatisfied,
  };
}

function renderProgramProgress(prog) {
  if (!prog) return '';
  const barColor = prog.pct >= 100 ? 'var(--success)' : 'var(--blue)';
  const hoursBar = prog.total != null ? `
    <div class="prog-hours-bar">
      <div class="prog-hours-track">
        <div class="prog-hours-fill" style="width:${prog.pct}%;background:${barColor}"></div>
      </div>
      <div class="prog-hours-labels">
        <span>${prog.plannedHours} ש׳׳ש מתוכננות</span>
        <span>${prog.total} ש׳׳ש נדרשות</span>
      </div>
    </div>` : '';

  /* Core-total row (e.g. "קורסי ליבה: 2/6") */
  const coreTotalRow = prog.coreTotalMin != null ? `
    <div class="prog-cat-row ${prog.coreSatisfied ? 'ok' : 'warn'}">
      <span>קורסי ליבה (סה״כ)</span>
      <span class="prog-cat-count">${prog.coreSelected}/${prog.coreTotalMin}</span>
    </div>` : '';

  /* Per-category rows for categories with min_courses > 0 */
  const reqCats = (prog.categories || []).filter(c => c.min_courses > 0 && !c.needs_review);
  const catRows = reqCats.map(cat =>
    `<div class="prog-cat-row ${cat.satisfied ? 'ok' : 'warn'}">
      <span>${esc(cat.name_he || cat.category_id)}</span>
      <span class="prog-cat-count">${cat.selected_count}/${cat.min_courses}</span>
    </div>`
  ).join('');

  /* Remaining hours note */
  const remainNote = prog.remaining != null && prog.remaining > 0
    ? `<div class="prog-req-note">שעות חסרות עד ${prog.total}: <strong>${prog.remaining}</strong></div>` : '';

  const unkNote = prog.unknownHoursCount > 0
    ? `<div class="prog-req-note">⚠ ${prog.unknownHoursCount} קורסים ללא שעות ידועות</div>` : '';

  return `<div class="prog-requirements">
    <div class="prog-req-title">התקדמות בתוכנית</div>
    ${hoursBar}${coreTotalRow}${catRows}${remainNote}${unkNote}
  </div>`;
}

function semColHtml(sem) {
  const ids     = (state.semesters[sem.id] || []).filter(id => !isCourseCompleted(id));
  const courses = ids.map(id => courseMap[id]).filter(Boolean);
  let knownHrs  = 0, unknownCt = 0;
  for (const c of courses) {
    if (c.weekly_hours != null) knownHrs += c.weekly_hours;
    else unknownCt++;
  }
  const avgDiff = courses.length
    ? (courses.reduce((s,c)=>s+(c.difficulty_score||0),0)/courses.length).toFixed(1)
    : null;
  const pct    = Math.min(100, (knownHrs / MAX_HOURS) * 100).toFixed(1);
  const wlCls  = knownHrs >= 16 ? 'over' : knownHrs >= 10 ? 'med' : '';
  const hrsLbl = unknownCt > 0 ? `${knownHrs} שעות ידועות` : `${knownHrs} ש׳׳ש`;
  const unkNote = unknownCt > 0
    ? `<div class="wl-note">⚠ ${unknownCt} קורסים ללא שעות ידועות</div>` : '';
  const cards  = ids.map(id => cardHtml(courseMap[id], true)).join('');
  return `<div class="semester-col ${esc(sem.css)}">
    <div class="sem-hdr">
      <div class="sem-title">${esc(SEM_HE[sem.id] || sem.id)}</div>
      <div class="sem-stats">
        <span>⏱ ${esc(hrsLbl)}</span>
        <span>📚 ${courses.length} קורסים</span>
        ${avgDiff != null ? `<span>📊 קושי ${esc(avgDiff)}</span>` : ''}
      </div>
      <div class="wl-wrap">
        <div class="wl-row">
          <span>עומס שבועי</span>
          <span>${knownHrs}/${MAX_HOURS} ש׳׳ש</span>
        </div>
        <div class="wl-track"><div class="wl-fill ${wlCls}" style="width:${pct}%"></div></div>
        ${unkNote}
      </div>
    </div>
    <div class="sem-zone" data-zone="semester" data-sem="${esc(sem.id)}">${cards}</div>
  </div>`;
}

/* Precise data-quality badge for repository/elective courses (replaces the
 * generic "מידע חלקי"), based on syllabus availability and name recovery. */
function syllabusBadgeHtml(c) {
  if (!c.name_he) return `<span class="badge bdg-missing">שם חסר</span>`;
  if (c.syllabus_summary_he) return `<span class="badge bdg-elective">סילבוס נותח</span>`;
  if (!c.syllabus_url) return `<span class="badge bdg-partial">סילבוס חסר</span>`;
  return `<span class="badge bdg-partial">סילבוס לא פורסם</span>`;
}

/* ── Course card HTML ───────────────────────────────────────────────────── */
function cardHtml(c, placed) {
  if (!c) return '';
  const type      = c.course_type || 'elective';
  const status    = c.status      || 'eligible';
  const level     = c.difficulty_level || '';
  const locked    = isLocked(c);
  const isBlocked = status === 'blocked';
  const canDrag   = !locked && !(isBlocked && !allowBlockedDrag);

  const isPartial    = status === 'partial_info';
  const isNotOffered = status === 'not_offered';

  const catId     = c.program_category_id || null;
  const catStyles = CAT_CSS[catId] || null;

  let cls = 'course-card';
  if (locked)                           cls += ' card-locked';
  else if (status === 'missing_from_db')  cls += ' card-missing';
  else if (isBlocked)                   cls += ' card-blocked';
  else if (isPartial || isNotOffered)   cls += ' card-missing'; /* reuse missing style */
  else if (type === 'mandatory')        cls += ' card-mandatory';
  else                                  cls += ' card-elective';
  if (placed && level && !locked)       cls += ` card-placed diff-${esc(level)}`;
  /* Category border override — only in repo (not placed), only for known categories */
  if (!placed && catStyles)             cls += ` ${catStyles.card}`;

  const isFixedMandatory = c.placement_policy === 'fixed' && type === 'mandatory';
  const isFlexMand       = c.placement_policy === 'flexible';

  const typeBdg = status === 'missing_from_db'
    ? `<span class="badge bdg-missing">${STAT_HE.missing_from_db}</span>`
    : isNotOffered
    ? `<span class="badge bdg-not-offered">לא מוצע בתשפ"ז</span>`
    : isPartial
    ? syllabusBadgeHtml(c)
    : status === 'blocked'
    ? `<span class="badge bdg-blocked">${STAT_HE.blocked}</span>`
    : isFlexMand && isOfferingRestrictedFlex(c)
    ? `<span class="badge bdg-mandatory-flex" title="${esc('חובה גמיש בתוכנית, מוצע השנה רק בסמסטר ' + (SEM_HE[(c.effective_allowed_semesters||[])[0]] || ''))}">חובה גמיש (השנה: ${esc(SEM_HE[(c.effective_allowed_semesters||[])[0]]?.split(' ').pop() || '')})</span>`
    : isFlexMand
    ? `<span class="badge bdg-mandatory-flex">חובה גמיש</span>`
    : isFixedMandatory
    ? `<span class="badge bdg-mandatory">חובה קבוע</span>`
    : `<span class="badge bdg-elective">${TYPE_HE.elective}</span>`;

  /* Category badge — shown in repo for core categories (fluids/solids/systems/labs) */
  const catBdg = (!placed && catStyles)
    ? `<span class="badge ${catStyles.bdg}">${esc(catStyles.label)}</span>`
    : '';

  /* Lightweight estimate: difficulty_score present but no workload subscore (not from full audit) */
  const isEstimatedDiff = level && c.workload_score == null && c.difficulty_score != null;
  const diffBdg = level
    ? `<span class="badge bdg-${esc(level)}" title="${isEstimatedDiff ? 'הערכה מבוססת מידע חלקי' : ''}">${esc(DIFF_HE[level]||level)}${c.difficulty_score!=null?' '+c.difficulty_score:''}${isEstimatedDiff?'~':''}</span>`
    : '';

  const prereqVr      = placed ? boardValidation[c.course_id] : null;
  const prereqWarnBdg = prereqVr && !prereqVr.valid
    ? `<span class="badge bdg-prereq-warn" title="${esc('דרישות קדם: ' + prereqVr.errors.map(_prereqName).join(', '))}">⚠ דרישות קדם</span>`
    : '';

  const hoursHtml = c.weekly_hours != null
    ? `<span class="hrs-tag"><span class="v">${esc(c.weekly_hours)}</span> ש׳׳ש</span>`
    : c.semester_hours != null
    ? `<span class="hrs-tag"><span class="v">${esc(c.semester_hours)}</span> שעות סמסטריאליות (לפי הסילבוס)<span class="hrs-unk" style="display:block;font-size:.6rem"> שעות שבועיות לא צוינו</span></span>`
    : `<span class="hrs-unk">שעות לא ידועות</span>`;

  const extraHoursHtml = [
    c.lab_hours != null ? `<span class="hrs-tag">מעבדה: <span class="v">${esc(c.lab_hours)}</span> שעות</span>` : '',
    c.teaching_format ? `<span class="hrs-tag">אופן הוראה: ${esc(c.teaching_format)}</span>` : '',
  ].filter(Boolean).join(' ');

  const warnIcon  = (c.warnings||[]).length
    ? `<span class="warn-icon" title="${esc((c.warnings||[]).join(', '))}">⚠</span>` : '';

  let actionBtn = '';
  if (isFixedMandatory) {
    actionBtn = `<span class="lock-btn" title="חובה קבוע — לא ניתן להזיז">🔒</span>`;
  } else if (isFlexMand) {
    actionBtn = `<span class="lock-btn" title="חובה גמיש — ניתן להזזה בין סמסטרים מותרים">↔</span>`;
  } else if (placed) {
    actionBtn = `<button class="rm-btn" data-rm="${esc(c.course_id)}" title="החזר למאגר">✕</button>`;
  }

  const dragHint = canDrag ? '<div class="card-drag-hint">⠿ גרירה</div>' : '';

  return `<div class="${cls}" ${canDrag?'draggable="true"':'draggable="false"'} data-cid="${esc(c.course_id)}">
  <div class="card-main">
    <div class="card-top">
      <span class="cid" dir="ltr">${esc(c.course_id)}</span>
      ${warnIcon}${actionBtn}
    </div>
    <div class="cname${c.name_he?'':' unnamed'}">${c.name_he?esc(c.name_he):'⚠ שם קורס חסר — נדרש ייבוא מידע'}</div>
    <div class="card-row">${typeBdg} ${catBdg} ${diffBdg} ${prereqWarnBdg} ${hoursHtml} ${extraHoursHtml}</div>
  </div>${dragHint}
</div>`;
}

/* ── Override localStorage helpers ─────────────────────────────────────── */
function getOverride(cid) {
  try {
    const raw = localStorage.getItem(LS_OVERRIDES);
    if (!raw) return null;
    return JSON.parse(raw)?.courses?.[cid] || null;
  } catch { return null; }
}

function saveOverride(cid) {
  const form = document.getElementById('override-form');
  if (!form) return;
  const hoursRaw = form.querySelector('[name=manual_weekly_hours]')?.value;
  const hours    = hoursRaw !== '' && hoursRaw != null ? parseFloat(hoursRaw) : null;
  const entry = {
    user_notes:                        form.querySelector('[name=user_notes]')?.value                       || '',
    manual_weekly_hours:               isNaN(hours) ? null : hours,
    manual_conceptual_complexity_note: form.querySelector('[name=manual_conceptual_complexity_note]')?.value || '',
    expected_instructor:               form.querySelector('[name=expected_instructor]')?.value               || '',
    known_instructor_notes:            form.querySelector('[name=known_instructor_notes]')?.value            || '',
    confidence_adjustment:             0,
    updated_at:                        new Date().toISOString(),
  };
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(LS_OVERRIDES) || '{}'); } catch {}
  if (!stored.courses) stored.courses = {};
  stored.courses[cid] = entry;
  localStorage.setItem(LS_OVERRIDES, JSON.stringify(stored));
}

function exportOverrides() {
  try {
    const raw  = localStorage.getItem(LS_OVERRIDES) || '{"courses":{}}';
    const blob = new Blob([raw], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'course_overrides.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  } catch (e) { console.error('[exportOverrides]', e); }
}

function _overrideHasData(ov) {
  return !!(ov?.user_notes?.trim() || ov?.manual_weekly_hours != null
            || ov?.manual_conceptual_complexity_note?.trim()
            || ov?.expected_instructor?.trim() || ov?.known_instructor_notes?.trim());
}

function buildOverrideDisplaySection(ov, mkSection, mkRow) {
  if (!_overrideHasData(ov)) return '';
  const rows = [
    ov.user_notes?.trim()                        ? mkRow('הערות:', esc(ov.user_notes))                                   : '',
    ov.manual_weekly_hours != null               ? mkRow('שעות (ידנית):', `${ov.manual_weekly_hours} ש׳׳ש`)              : '',
    ov.manual_conceptual_complexity_note?.trim() ? mkRow('מורכבות:', esc(ov.manual_conceptual_complexity_note))          : '',
    ov.expected_instructor?.trim()               ? mkRow('מרצה צפוי:', esc(ov.expected_instructor))                      : '',
    ov.known_instructor_notes?.trim()            ? mkRow('הערות מרצה:', esc(ov.known_instructor_notes))                  : '',
  ].filter(Boolean).join('');
  return mkSection(`<span class="override-badge" style="vertical-align:middle">מידע שהוזן ידנית</span>`, rows);
}

/* ── Course details modal ───────────────────────────────────────────────── */

/**
 * Assemble a structured text summary of all grounded data available for a
 * course. This is the context that will be injected into the AI prompt when
 * the API is connected.
 *
 * TODO: Pass this string to POST /api/ai/course-chat alongside the question
 *       when implementing the real API call in handleAiSend().
 */
/** Find which semester (if any) a course is currently placed in. */
function findCoursePlacement(courseId) {
  if (!state) return null;
  for (const sem of SEMESTERS) {
    if ((state.semesters[sem.id] || []).includes(courseId)) {
      return SEM_HE[sem.id] || sem.id;
    }
  }
  return null;
}

function buildCourseContext(c) {
  const ov = getOverride(c.course_id);
  const lines = [];

  lines.push(`קוד קורס: ${c.course_id}`);
  if (c.name_he)         lines.push(`שם קורס: ${c.name_he}`);
  if (c.weekly_hours != null)
                         lines.push(`שעות שבועיות: ${c.weekly_hours}`);
  else if (c.semester_hours != null)
                         lines.push(`היקף לפי הסילבוס: ${c.semester_hours} שעות סמסטריאליות (שעות שבועיות לא צוינו)`);
  else                   lines.push('שעות שבועיות: לא ידוע');

  if (c.lecture_hours != null) lines.push(`שעות הרצאה: ${c.lecture_hours}`);
  if (c.tutorial_hours != null) lines.push(`שעות תרגול: ${c.tutorial_hours}`);
  if (c.lab_hours != null) lines.push(`שעות מעבדה: ${c.lab_hours}`);
  if (c.teaching_format) lines.push(`אופן הוראה: ${c.teaching_format}`);

  lines.push(`סוג קורס: ${TYPE_HE[c.course_type] || c.course_type || 'לא ידוע'}`);

  const category = c.program_category_name_he || c.program_category_id;
  lines.push(`קטגוריה: ${category || 'לא ידוע'}`);

  const placement = findCoursePlacement(c.course_id);
  lines.push(`שיבוץ נוכחי: ${placement || 'לא משובץ בתוכנית'}`);

  if (c.difficulty_level)
                         lines.push(`רמת קושי כוללת: ${DIFF_HE[c.difficulty_level] || c.difficulty_level} (ציון ${c.difficulty_score ?? 'לא ידוע'})`);
  else                   lines.push('רמת קושי כוללת: לא ידוע');

  // Difficulty sub-scores — explicitly mark missing ones so the AI doesn't guess
  const subScores = [
    ['עומס',              c.workload_score],
    ['מורכבות מושגית',     c.conceptual_complexity_score],
    ['עומק דרישות קדם',    c.prerequisite_depth_score],
    ['עצימות הערכה',       c.assessment_intensity_score],
  ];
  for (const [label, val] of subScores) {
    lines.push(`${label}: ${val != null ? val : 'לא ידוע'}`);
  }
  if (c.difficulty_confidence != null) {
    lines.push(`אמינות נתוני קושי: ${c.difficulty_confidence}`);
    if (c.difficulty_confidence < 0.6) lines.push('⚠ נתוני הקושי לקורס זה חלקיים — אמינות נמוכה');
  } else {
    lines.push('אמינות נתוני קושי: לא ידוע');
  }

  const prereqs = (c.prerequisite_details || []).map(d => d.name_he ? `${d.name_he} (${d.course_id})` : d.course_id);
  if (prereqs.length)    lines.push(`דרישות קדם: ${prereqs.join(', ')}`);
  if (c.missing_prerequisites?.length)
                         lines.push(`דרישות קדם חסרות: ${c.missing_prerequisites.join(', ')}`);

  const hasSyllabus = !!(c.syllabus_url || c.syllabus_links?.length);
  if (c.syllabus_text_available && c.syllabus_summary_he) {
    lines.push('סילבוס זמין: כן (תוכן מהסילבוס מצורף להלן)');
    lines.push(`תקציר סילבוס: ${c.syllabus_summary_he}`);
    if (c.syllabus_topics_he?.length)
                           lines.push(`נושאי לימוד מהסילבוס: ${c.syllabus_topics_he.join(', ')}`);
    if (c.syllabus_prerequisites_he?.length)
                           lines.push(`דרישות קדם מהסילבוס: ${c.syllabus_prerequisites_he.join(', ')}`);
    if (c.syllabus_assessment_he)
                           lines.push(`מטלות/הערכה מהסילבוס: ${c.syllabus_assessment_he}`);
    if (c.syllabus_structure_he)
                           lines.push(`מבנה הקורס מהסילבוס: ${c.syllabus_structure_he}`);
  } else {
    lines.push('סילבוס זמין: לא — הסילבוס לא פורסם/לא זמין במערכת. יש להשתמש בנתונים אחרים (קטגוריה, שעות, ציונים, דרישות קדם) ולא להניח תוכן סילבוס.');
  }
  if (!c.name_he) lines.push('⚠ שם הקורס חסר במידע הזמין (לא נמצא מקור אמין).');
  if (hasSyllabus && c.syllabus_url) lines.push(`קישור סילבוס: ${c.syllabus_url}`);
  if (c.assessment_type) lines.push(`סוג הערכה: ${c.assessment_type}`);

  const gs = c.grade_signal;
  if (gs) {
    if (gs.average_grade      != null) lines.push(`ממוצע היסטורי: ${gs.average_grade}`);
    else                                lines.push('ממוצע היסטורי: לא ידוע');
    if (gs.median_grade       != null) lines.push(`חציון היסטורי: ${gs.median_grade}`);
    if (gs.standard_deviation != null) lines.push(`סטיית תקן: ${gs.standard_deviation}`);
    if (gs.pass_rate          != null) lines.push(`שיעור עוברים: ${Math.round(gs.pass_rate * 100)}%`);
    if (gs.num_students_total != null) lines.push(`סה״כ סטודנטים: ${gs.num_students_total}`);
    if (gs.years_available?.length)    lines.push(`שנים: ${gs.years_available.join(', ')}`);
    lines.push(`מקור ציונים: ${gs.source_name || 'TAU Refactor'} (לא רשמי)`);
  } else {
    lines.push('נתוני ציונים היסטוריים: לא זמינים');
  }

  const iu = c.instructor_uncertainty;
  if (iu) {
    if (iu.current_lecturers?.length)    lines.push(`מרצה נוכחי: ${iu.current_lecturers.join(', ')}`);
    if (iu.historical_lecturers?.length) lines.push(`מרצים היסטוריים: ${iu.historical_lecturers.join(', ')}`);
    if (iu.instructor_uncertainty_score != null)
                                         lines.push(`אי-ודאות מרצה: ${Math.round(iu.instructor_uncertainty_score * 100)}%`);
    if (iu.instructor_changed_warning)   lines.push('אזהרה: מרצה שונה מהנתונים ההיסטוריים');
  }
  if (ov?.expected_instructor)         lines.push(`מרצה צפוי (משתמש): ${ov.expected_instructor}`);
  if (ov?.known_instructor_notes)      lines.push(`הערות מרצה (משתמש): ${ov.known_instructor_notes}`);

  if (ov?.user_notes)                  lines.push(`הערות משתמש: ${ov.user_notes}`);
  if (ov?.manual_weekly_hours != null) lines.push(`שעות ידניות: ${ov.manual_weekly_hours}`);
  if (ov?.manual_conceptual_complexity_note)
                                       lines.push(`הערת מורכבות: ${ov.manual_conceptual_complexity_note}`);

  return lines.join('\n');
}

const _AI_SUGGESTED_PROMPTS = [
  'הסבר לי מה לומדים בקורס לפי הסילבוס',
  'האם הקורס מתאים למי שמעדיף עומס קל?',
  'אילו קורסים כדאי לקחת לפניו?',
  'מה חסר במידע על הקורס?',
];

function buildAiChatPanel(c) {
  const hasSyllabus = !!(c.syllabus_url || c.syllabus_links?.length);
  const ctxNote = hasSyllabus
    ? 'הניתוח מתבסס על: נתוני קורס, ציוני קושי, ציונים היסטוריים, קישור לסילבוס (ללא תוכן הסילבוס עצמו) והערות שהזנת.'
    : 'אין סילבוס שמור — הניתוח מוגבל למידע הקורס הבסיסי, ציוני קושי וציונים היסטוריים בלבד.';

  const promptBtns = _AI_SUGGESTED_PROMPTS.map(p =>
    `<button class="ai-prompt-btn" data-prompt="${esc(p)}">💬 ${esc(p)}</button>`
  ).join('');

  return `<div class="ai-chat-wrap">
    <div>
      <div class="ai-suggested-label">שאלות מוצעות</div>
      <div class="ai-suggested-prompts" id="ai-prompt-list">${promptBtns}</div>
    </div>
    <div class="ai-input-area">
      <textarea id="ai-chat-input" class="ai-textarea-chat" rows="3"
        placeholder="שאל שאלה על הקורס…" dir="rtl"></textarea>
      <div class="ai-send-row">
        <button id="ai-chat-send" class="ai-send-btn">שלח ›</button>
      </div>
    </div>
    <div id="ai-chat-response" class="ai-response-area ai-empty"></div>
    <div class="ai-context-note">ℹ ${esc(ctxNote)}</div>
  </div>`;
}

/** Handle the AI send button in the course detail modal. */
function handleAiSend(c) {
  const input    = document.getElementById('ai-chat-input');
  const respEl   = document.getElementById('ai-chat-response');
  const sendBtn  = document.getElementById('ai-chat-send');
  const question = input?.value?.trim();
  if (!question || !respEl || !sendBtn) return;
  const courseCtx = buildCourseContext(c);
  callAiStream(question, buildPlanContext(), courseCtx, respEl, sendBtn);
}

function syllabusLink(c) {
  if (c.syllabus_url) return c.syllabus_url;
  if (c.syllabus_links?.length) return c.syllabus_links[0];
  return null;
}

function openCourseDetails(cid) {
  const c = courseMap[cid];
  if (!c) return;

  const existingOverride = getOverride(cid);

  const type   = c.course_type      || 'elective';
  const status = c.status           || 'eligible';
  const level  = c.difficulty_level || '';
  const locked = isLocked(c);
  const sylUrl = syllabusLink(c);

  /* Badges */
  const _isFlexMand = c.placement_policy === 'flexible';
  const _isFixedMand = c.placement_policy === 'fixed' && type === 'mandatory';
  const typeBdg = status === 'missing_from_db'
    ? `<span class="badge bdg-missing">${STAT_HE.missing_from_db}</span>`
    : status === 'blocked'
    ? `<span class="badge bdg-blocked">${STAT_HE.blocked}</span>`
    : _isFlexMand && isOfferingRestrictedFlex(c)
    ? `<span class="badge bdg-mandatory-flex">חובה גמיש (השנה: ${esc(SEM_HE[(c.effective_allowed_semesters||[])[0]]?.split(' ').pop() || '')})</span>`
    : _isFlexMand
    ? `<span class="badge bdg-mandatory-flex">חובה גמיש</span>`
    : _isFixedMand
    ? `<span class="badge bdg-mandatory">חובה קבוע</span>`
    : `<span class="badge bdg-elective">${TYPE_HE.elective}</span>`;

  const diffBdg = level
    ? `<span class="badge bdg-${esc(level)}">${esc(DIFF_HE[level]||level)} ${c.difficulty_score ?? ''}</span>`
    : '';

  const hoursHtml = c.weekly_hours != null
    ? `<span class="hrs-tag"><span class="v">${esc(c.weekly_hours)}</span> ש׳׳ש</span>`
    : c.semester_hours != null
    ? `<span class="hrs-tag"><span class="v">${esc(c.semester_hours)}</span> שעות סמסטריאליות (לפי הסילבוס)<span class="hrs-unk" style="display:block;font-size:.6rem"> שעות שבועיות לא צוינו</span></span>`
    : `<span class="hrs-unk">שעות לא ידועות</span>`;

  /* Detail sections */
  const prereqs = (c.prerequisites||[]).filter(Boolean);
  const missing = (c.missing_prerequisites||[]).filter(Boolean);
  const warns   = (c.warnings||[]);
  const conf    = c.data_quality?.placement_confidence || '';
  const src     = c.source || '';

  const mkSection = (title, content) =>
    `<div class="detail-section"><div class="detail-section-title">${title}</div>${content}</div>`;

  const mkRow = (label, val) =>
    `<div class="detail-row"><span class="detail-lbl">${label}</span> <span class="detail-val">${val}</span></div>`;

  /* Basic info section */
  const _allowedSemLabels = (c.allowed_semesters || []).map(sid => SEM_HE[sid] || sid).join(' / ');
  const basicRows = [
    mkRow('קוד קורס:', `<span dir="ltr" style="font-family:ui-monospace,monospace;unicode-bidi:isolate">${esc(cid)}</span>`),
    mkRow('סוג:', esc(_isFlexMand ? 'חובה גמיש' : _isFixedMand ? 'חובה קבוע' : TYPE_HE[type] || type)),
    c.weekly_hours != null ? mkRow('שעות שבועיות:', `${esc(c.weekly_hours)} ש׳׳ש`)
      : c.semester_hours != null ? mkRow('היקף לפי הסילבוס:', `${esc(c.semester_hours)} שעות סמסטריאליות <span style="color:var(--miss-accent);font-size:.65rem">(שעות שבועיות לא צוינו)</span>`)
      : mkRow('שעות שבועיות:', '<span style="color:var(--miss-accent)">לא ידוע</span>'),
    c.lab_hours != null ? mkRow('מעבדה:', `${esc(c.lab_hours)} שעות`) : '',
    c.teaching_format ? mkRow('אופן הוראה:', esc(c.teaching_format)) : '',
    level ? mkRow('רמת קושי:', `${esc(DIFF_HE[level]||level)} (${esc(c.difficulty_score??'')})`) : '',
    (status !== 'eligible' && status !== 'partial_info') ? mkRow('מצב:', esc(STAT_HE[status] || status)) : '',
    c.semester_availability ? mkRow('זמינות:', esc(c.semester_availability)) : '',
    (c.allowed_semesters?.length > 1) ? mkRow('ניתן לשיבוץ ב:', esc(_allowedSemLabels)) : '',
    isOfferingRestrictedFlex(c)
      ? mkRow('שים לב:', esc(`חובה גמיש בתוכנית, מוצע השנה רק בסמסטר ${SEM_HE[(c.effective_allowed_semesters||[])[0]]?.split(' ').pop() || ''}`))
      : '',
    c.needs_verification ? mkRow('אימות:', '<span style="color:var(--warning)">⚠ ממתין לאימות</span>') : '',
  ].filter(Boolean).join('');

  /* Data-quality section: name source confidence, syllabus availability, missing data */
  const syllabusAvail = c.syllabus_summary_he ? 'סילבוס נותח'
    : c.syllabus_url ? 'סילבוס לא פורסם'
    : 'סילבוס חסר';
  const missingData = [
    !c.name_he ? 'שם קורס' : null,
    (c.weekly_hours == null && c.semester_hours == null) ? 'שעות שבועיות' : null,
    !c.syllabus_summary_he ? 'תקציר סילבוס' : null,
    c.grade_signal == null ? 'נתוני ציונים' : null,
  ].filter(Boolean);
  const dataQualityRows = [
    (c.name_source && c.name_source_confidence)
      ? mkRow('מקור שם:', esc(`${c.name_source} (אמינות: ${c.name_source_confidence})`))
      : '',
    mkRow('מקור סילבוס:', esc(c.syllabus_summary_he ? `${syllabusAvail} (${c.syllabus_source_url ? 'דף סילבוס TAU' : 'לא ידוע'})` : syllabusAvail)),
    (c.weekly_hours != null || c.semester_hours != null)
      ? mkRow('מקור שעות:', esc(c.hours_source ? `${c.hours_source}${c.hours_source_confidence ? ` (אמינות: ${c.hours_source_confidence})` : ''}` : 'תוכנית לימודים'))
      : '',
    c.grade_signal ? mkRow('מקור ציונים:', esc(c.grade_signal.source_name || 'TAU Refactor (לא רשמי)')) : '',
    mkRow('מקור קטגוריה/תוכנית:', 'נתוני קטגוריה/תוכנית מקורם בקובץ תוכנית פנימי ועשויים לדרוש אימות'),
    missingData.length ? mkRow('מידע חסר:', esc(missingData.join(', '))) : '',
  ].filter(Boolean).join('');

  /* Difficulty breakdown section */
  const hasDiffData = c.workload_score != null || c.conceptual_complexity_score != null
                      || c.prerequisite_depth_score != null || c.assessment_intensity_score != null;
  const diffSection = (() => {
    if (!hasDiffData) return '';
    const conf = c.difficulty_confidence;
    const pct  = score => score != null ? Math.round((score - 1) / 4 * 100) : null;

    const bar  = (label, score, color) => {
      if (score == null) return '';
      const p = pct(score);
      return `<div class="diff-brow">
        <span class="diff-blbl">${label}</span>
        <div class="diff-btrack"><div class="diff-bfill" style="width:${p}%;background:${color}"></div></div>
        <span class="diff-bval">${score.toFixed(1)}</span>
      </div>`;
    };

    const bars = [
      bar('מורכבות מושגית',  c.conceptual_complexity_score, 'var(--purple)'),
      bar('עומס לימודי',       c.workload_score,              '#3B82F6'),
      bar('עומק דרישות קדם',  c.prerequisite_depth_score,    'var(--success)'),
      bar('עצימות הערכה',     c.assessment_intensity_score,  'var(--warning)'),
    ].filter(Boolean).join('');

    const confHtml = conf != null
      ? `<div class="diff-conf">ביטחון: <strong>${Math.round(conf*100)}%</strong></div>`
      : '';

    /* Difficulty signals breakdown — shown when confidence < 0.6 */
    let signalsHtml = '';
    if (conf != null && conf < 0.6) {
      const available = [], missing = [];

      // Available signals
      if (c.weekly_hours != null)          available.push('שעות שבועיות');
      if (c.program_category_id)           available.push('קטגוריית קורס');
      if ((c.prerequisites||[]).length > 0) available.push('עומק דרישות קדם');
      if (c.course_details_url)            available.push('דף פרטי קורס (TAU)');
      if (c.syllabus_url)                  available.push('קישור סילבוס');
      const aStatus = c.assessment_analysis_status;
      if (aStatus === 'complete' && c.assessment_type && c.assessment_type !== 'unknown')
                                           available.push('סוג הערכה סופי');
      if (c.grade_signal)                  available.push('נתוני טאו פקטור');
      const aiStatus = c.syllabus_ai_analysis_status;
      if (aiStatus === 'complete')         available.push('ניתוח AI של סילבוס');

      // Missing signals
      if (c.weekly_hours == null)          missing.push('שעות שבועיות');

      // Syllabus / AI analysis — precise wording by status
      if (aiStatus === 'complete') {
        /* nothing — already in available */
      } else if (aiStatus === 'pending' || (c.syllabus_url && aiStatus !== 'complete')) {
        missing.push('ניתוח AI של הסילבוס לחילוץ נושאים וסוג הערכה');
      } else {
        missing.push('לא נמצא קישור סילבוס פעיל');
      }

      // Assessment type — AI-only field; never fabricated from regex
      if (aStatus === 'not_started') {
        missing.push('סוג ההערכה הסופי דורש ניתוח AI של הסילבוס');
      } else if (aStatus === 'not_available') {
        missing.push('לא נמצא סילבוס פעיל לניתוח סוג ההערכה');
      }

      // TAU Factor grade stats — distinguish "not loaded" from "not found"
      const tfStatus = c.tau_factor_status;
      const tauIdNote = c.tau_factor_lookup_id
        ? ` (מזהה: ${esc(c.tau_factor_lookup_id)})`
        : '';
      if (!c.grade_signal) {
        if (tfStatus === 'not_found')
          missing.push('לא נמצאו נתוני טאו פקטור עבור מספר הקורס' + tauIdNote);
        else if (tfStatus === 'failed')
          missing.push('טעינת נתוני טאו פקטור נכשלה' + tauIdNote);
        else if (tfStatus === 'not_started' || !tfStatus)
          missing.push('טרם נטענו נתוני טאו פקטור' + tauIdNote);
      }

      const avHtml = available.length
        ? `<div class="diff-signals"><span class="diff-sig-label ok">✓ קיים:</span> ${available.map(s=>`<span class="diff-sig-item">${esc(s)}</span>`).join('')}</div>`
        : '';
      const miHtml = missing.length
        ? `<div class="diff-signals"><span class="diff-sig-label miss">✗ חסר לחישוב מדויק:</span> ${missing.map(s=>`<span class="diff-sig-item miss">${esc(s)}</span>`).join('')}</div>`
        : '';
      signalsHtml = `<div class="diff-signals-wrap">⚠ ציון הקושי מבוסס על מידע חלקי — ייתכן שאינו מדויק.${avHtml}${miHtml}</div>`;
    }

    const diffWarns = (c.difficulty_warnings || []).filter(w => !w.includes('חלקי')).map(w =>
      `<div class="detail-warn">⚠ ${esc(w)}</div>`).join('');

    return mkSection('פירוט מדד הקושי', bars + confHtml + signalsHtml + diffWarns);
  })();

  /* Grade statistics section (secondary / unofficial) */
  const gradeSection = (() => {
    const gs = c.grade_signal;
    if (!gs) return '';
    const pct = gs.pass_rate != null ? `${Math.round(gs.pass_rate * 100)}%` : null;
    const rows = [
      gs.average_grade      != null ? mkRow('ממוצע:',           `${gs.average_grade}`)    : '',
      gs.median_grade       != null ? mkRow('חציון:',           `${gs.median_grade}`)      : '',
      gs.standard_deviation != null ? mkRow('סטיית תקן:',      `${gs.standard_deviation}`) : '',
      pct                           ? mkRow('שיעור עוברים:',   pct)                        : '',
      gs.num_students_total != null ? mkRow('סה״כ סטודנטים:', `${gs.num_students_total}`)  : '',
      gs.years_available?.length    ? mkRow('שנים זמינות:',    gs.years_available.join(', ')) : '',
      mkRow('מקור:', `<span style="color:var(--text-muted);font-size:.68rem">${esc(gs.source_name || 'TAU Refactor')}</span>`),
    ].filter(Boolean).join('');
    const unofficialWarn = `<div class="detail-warn" style="margin-top:6px">⚠ נתוני הציונים מבוססים על מקור היסטורי לא רשמי (${esc(gs.source_name || 'TAU Refactor')}) ועשויים שלא לשקף את הסמסטר הקרוב — אזהרה זו מתייחסת רק לנתוני הציונים, לא לשם/סילבוס/שעות הקורס.</div>`;
    return mkSection('נתוני ציונים היסטוריים', rows + unofficialWarn);
  })();

  /* Instructor uncertainty section */
  const instructorSection = (() => {
    const iu = c.instructor_uncertainty;

    // Merge backend instructor_notes with user's localStorage override fields
    const ov = getOverride(cid);
    const userExpected = ov?.expected_instructor?.trim()        || null;
    const userNotes    = ov?.known_instructor_notes?.trim()     || null;

    // If nothing at all, render a minimal note only when current lecturer is unknown
    const hasBacked = iu && (iu.current_lecturers?.length || iu.historical_lecturers?.length
                             || iu.instructor_uncertainty_score > 0 || iu.warnings?.length);
    const hasUserData = userExpected || userNotes;
    if (!hasBacked && !hasUserData) return '';

    const score = iu?.instructor_uncertainty_score ?? null;
    const scoreColor = score == null ? '#9CA3AF'
      : score < 0.30 ? 'var(--success)'
      : score < 0.60 ? 'var(--warning)'
      : 'var(--danger)';

    let html = '';

    // Score bar
    if (score != null) {
      const pct = Math.round(score * 100);
      html += `<div class="iu-score-row">
        <div class="iu-track"><div class="iu-fill" style="width:${pct}%;background:${scoreColor}"></div></div>
        <span class="iu-val">${pct}%</span>
      </div>`;
    }

    // Current lecturers (backend data + user override)
    const currentAll = [...(iu?.current_lecturers || [])];
    if (userExpected && !currentAll.includes(userExpected)) currentAll.push(userExpected);
    if (currentAll.length) {
      html += mkRow('מרצה נוכחי:', '');
      html += `<div class="iu-lecturers">${currentAll.map(n => `<span class="iu-lecturer-tag">${esc(n)}</span>`).join('')}</div>`;
    }

    // Historical lecturers
    const hist = iu?.historical_lecturers || [];
    if (hist.length) {
      html += mkRow('מרצים היסטוריים:', '');
      html += `<div class="iu-lecturers">${hist.map(n => `<span class="iu-lecturer-tag" style="opacity:.7">${esc(n)}</span>`).join('')}</div>`;
    }

    // Warnings from backend
    const iuWarns = (iu?.warnings || []).map(w =>
      `<div class="detail-warn" style="margin-top:5px">⚠ ${esc(w)}</div>`
    ).join('');
    html += iuWarns;

    // User-provided instructor notes (from localStorage)
    if (userNotes) {
      html += `<div class="iu-user-note">✏ <strong>הערת משתמש:</strong> ${esc(userNotes)}</div>`;
    }

    return mkSection('אי־ודאות מרצה', html || '<div class="detail-none">אין מידע מרצה</div>');
  })();

  /* Prerequisites section */
  const prereqDetails  = (c.prerequisite_details         || []);
  const missingDetails = (c.missing_prerequisite_details || []);

  const mkPrereqChip = (detail, isMissing) => {
    const cls = isMissing ? 'detail-chip missing' : 'detail-chip';
    if (detail.name_he) {
      return `<span class="${cls}">${esc(detail.name_he)} <span class="prereq-id">(${esc(detail.course_id)})</span></span>`;
    }
    return `<span class="${cls} prereq-no-name">${esc(detail.course_id)} <span class="prereq-id">— שם לא נמצא</span></span>`;
  };

  const prereqChipsHtml = prereqDetails.length
    ? `<div class="detail-chips">${prereqDetails.map(d => mkPrereqChip(d, false)).join('')}</div>`
    : (prereqs.length
        ? `<div class="detail-chips">${prereqs.map(p=>`<span class="detail-chip">${esc(p)}</span>`).join('')}</div>`

  document.getElementById('override-export-btn').addEventListener('click', exportOverrides);
